# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/zvariant_utils"
version = "4.2.0"

[project.features]
default = []
gvariant = []

[rust]
name = "zvariant_utils"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.81" }
quote = { loaf = "crates-io/quote", version = "^1.0.36" }
serde = { loaf = "crates-io/serde", version = "^1.0.200", features = ["derive"] }
syn = { loaf = "crates-io/syn", version = "^3.0", features = ["extra-traits", "full"] }
winnow = { loaf = "crates-io/winnow", version = "^1.0" }
