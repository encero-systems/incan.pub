# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rayon"
version = "1.11.0"

[project.features]
web_spin_lock = ["dep:wasm_sync", "rayon-core/web_spin_lock"]

[rust]
name = "rayon"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
either = { loaf = "crates-io/either", version = "^1", default-features = false }
rayon-core = { loaf = "crates-io/rayon-core", version = "^1.13.0" }
wasm_sync = { loaf = "crates-io/wasm_sync", version = "^0.1.0", optional = true }
