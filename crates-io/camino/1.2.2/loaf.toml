# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/camino"
version = "1.2.2"

[project.features]
proptest1 = ["dep:proptest"]
serde1 = ["dep:serde_core"]

[rust]
name = "camino"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
proptest = { loaf = "crates-io/proptest", version = "^1.0.0", optional = true }
serde_core = { loaf = "crates-io/serde_core", version = "^1", optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["serde1"]
cfg = ["absolute_path", "os_str_bytes", "os_string_pathbuf_leak", "path_add_extension", "path_buf_deref_mut", "pathbuf_const_new", "try_reserve_2"]
