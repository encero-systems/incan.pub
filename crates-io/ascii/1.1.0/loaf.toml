# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ascii"
version = "1.1.0"

[project.features]
alloc = []
default = ["std"]
serde = ["dep:serde"]
serde_test = ["dep:serde_test"]
std = ["alloc"]

[rust]
name = "ascii"
type = "lib"
edition = "2015"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0.25", optional = true }
serde_test = { loaf = "crates-io/serde_test", version = "^1.0", optional = true }
