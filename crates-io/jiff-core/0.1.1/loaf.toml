# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/jiff-core"
version = "0.1.1"

[project.features]
alloc = ["defmt?/alloc"]
arbitrary = ["dep:arbitrary", "std"]
default = ["std", "tz-fat"]
defmt = ["dep:defmt"]
logging = ["dep:log"]
std = ["alloc", "log?/std"]
tz-fat = []

[rust]
name = "jiff_core"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.4.2", features = ["derive"], optional = true }
defmt = { loaf = "crates-io/defmt", version = "^1.0.0", optional = true }
log = { loaf = "crates-io/log", version = "^0.4.21", default-features = false, optional = true }
