# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rfc6979"
version = "0.4.0"

[rust]
name = "rfc6979"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
hmac = { loaf = "crates-io/hmac", version = "^0.12", features = ["reset"], default-features = false }
subtle = { loaf = "crates-io/subtle", version = "^2", default-features = false }
