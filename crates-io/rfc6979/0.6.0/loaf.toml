# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rfc6979"
version = "0.6.0"

[rust]
name = "rfc6979"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bigint = { loaf = "crates-io/crypto-bigint", version = "^0.7.5", default-features = false }
hmac = { loaf = "crates-io/hmac", version = "^0.13", default-features = false }
