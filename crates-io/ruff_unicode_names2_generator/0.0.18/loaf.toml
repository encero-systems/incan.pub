# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ruff_unicode_names2_generator"
version = "0.0.18"

[rust]
name = "unicode_names2_generator"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
phf_codegen = { loaf = "crates-io/phf_codegen", version = "^0.11.3", default-features = false }
rand = { loaf = "crates-io/rand", version = "^0.10.0", features = ["std_rng"], default-features = false }
