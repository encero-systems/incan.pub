# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/email_address"
version = "0.2.9"

[project.features]
default = ["serde_support"]
serde = ["dep:serde"]
serde_support = ["serde"]

[rust]
name = "email_address"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
