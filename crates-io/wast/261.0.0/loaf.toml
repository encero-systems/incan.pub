# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wast"
version = "261.0.0"

[project.features]
component-model = ["wasm-module", "wasm-encoder/component-model"]
default = ["wasm-module", "component-model"]
dwarf = ["dep:gimli"]
wasm-module = []

[rust]
name = "wast"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bumpalo = { loaf = "crates-io/bumpalo", version = "^3.20" }
gimli = { loaf = "crates-io/gimli", version = "^0.34.0", optional = true }
leb128fmt = { loaf = "crates-io/leb128fmt", version = "^0.1.0", default-features = false }
memchr = { loaf = "crates-io/memchr", version = "^2.4.1" }
unicode-width = { loaf = "crates-io/unicode-width", version = "^0.2.0" }
wasm-encoder = { loaf = "crates-io/wasm-encoder", version = "^0.261.0", features = ["std"], default-features = false }
