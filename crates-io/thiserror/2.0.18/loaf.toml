# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/thiserror"
version = "2.0.18"

[project.features]
default = ["std"]
std = []

[rust]
name = "thiserror"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
thiserror-impl = { loaf = "crates-io/thiserror-impl", version = "=2.0.18" }
