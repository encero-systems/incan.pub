# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/thiserror"
version = "2.0.18"

[project.features]
default = ["std"]
std = []

[rust]
name = "thiserror"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
thiserror-impl = { loaf = "crates-io/thiserror-impl", version = "=2.0.18" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default", "std"]
cfg = []
out = [{ name = "private.rs", path = "out/5ecbfb43b967/private.rs", digest = "sha256:5ecbfb43b967bb5711c3bb87517713f04b59d7673d7a98f6358303c28ff6dee4" }]
