# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/thiserror"
version = "1.0.69"

[rust]
name = "thiserror"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
thiserror-impl = { loaf = "crates-io/thiserror-impl", version = "=1.0.69" }
