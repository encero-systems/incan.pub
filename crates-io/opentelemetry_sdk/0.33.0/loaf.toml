# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/opentelemetry_sdk"
version = "0.33.0"

[project.features]
bench_profiling = []
default = ["trace", "metrics", "logs", "internal-logs"]
experimental_async_runtime = ["dep:futures-channel", "dep:futures-executor", "dep:futures-util", "dep:thiserror"]
experimental_logs_batch_log_processor_with_async_runtime = ["logs", "experimental_async_runtime"]
experimental_metrics_bound_instruments = ["metrics", "opentelemetry/experimental_metrics_bound_instruments"]
experimental_metrics_custom_reader = ["metrics"]
experimental_metrics_disable_name_validation = ["metrics"]
experimental_metrics_periodicreader_with_async_runtime = ["metrics", "experimental_async_runtime"]
experimental_trace_batch_span_processor_with_async_runtime = ["dep:tokio", "tokio/sync", "trace", "experimental_async_runtime"]
http = ["dep:http"]
internal-logs = ["opentelemetry/internal-logs"]
jaeger_remote_sampler = ["trace", "opentelemetry-http", "http", "serde", "serde_json", "url", "experimental_async_runtime"]
logs = ["opentelemetry/logs", "dep:futures-channel", "dep:futures-executor", "dep:futures-util"]
metrics = ["opentelemetry/metrics", "dep:futures-channel", "dep:futures-executor", "dep:futures-util", "dep:thiserror"]
opentelemetry-http = ["dep:opentelemetry-http"]
percent-encoding = ["dep:percent-encoding"]
rand = ["dep:rand"]
rt-tokio = ["dep:tokio", "tokio/rt", "tokio/time", "tokio-stream", "experimental_async_runtime"]
rt-tokio-current-thread = ["dep:tokio", "tokio/rt", "tokio/time", "tokio-stream", "experimental_async_runtime"]
serde = ["dep:serde"]
serde_json = ["dep:serde_json"]
spec_unstable_metrics_views = ["metrics"]
testing = ["opentelemetry/testing", "trace", "metrics", "logs", "dep:tokio", "tokio/sync"]
tokio = ["dep:tokio"]
tokio-stream = ["dep:tokio-stream"]
trace = ["opentelemetry/trace", "rand", "percent-encoding", "dep:futures-channel", "dep:futures-executor", "dep:futures-util", "dep:thiserror"]
url = ["dep:url"]

[rust]
name = "opentelemetry_sdk"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
futures-channel = { loaf = "crates-io/futures-channel", version = "^0.3", optional = true }
futures-executor = { loaf = "crates-io/futures-executor", version = "^0.3", optional = true }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3", features = ["async-await-macro", "sink", "std"], default-features = false, optional = true }
http = { loaf = "crates-io/http", version = "^1.1", features = ["std"], default-features = false, optional = true }
opentelemetry = { loaf = "crates-io/opentelemetry", version = "^0.33", default-features = false }
opentelemetry-http = { loaf = "crates-io/opentelemetry-http", version = "^0.33", default-features = false, optional = true }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.0", optional = true }
portable-atomic = { loaf = "crates-io/portable-atomic", version = "^1", features = ["fallback"], default-features = false, target = "cfg(not(target_has_atomic = \"64\"))" }
rand = { loaf = "crates-io/rand", version = "^0.9", features = ["os_rng", "small_rng", "std", "std_rng", "thread_rng"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive", "rc"], default-features = false, optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0", optional = true }
thiserror = { loaf = "crates-io/thiserror", version = "^2", default-features = false, optional = true }
tokio = { loaf = "crates-io/tokio", version = "^1", default-features = false, optional = true }
tokio-stream = { loaf = "crates-io/tokio-stream", version = "^0.1", optional = true }
url = { loaf = "crates-io/url", version = "^2.5", default-features = false, optional = true }
