# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/sqlx-postgres"
version = "0.9.0"

[project.features]
any = ["sqlx-core/any"]
bigdecimal = ["dep:bigdecimal", "dep:num-bigint", "sqlx-core/bigdecimal"]
bit-vec = ["dep:bit-vec", "sqlx-core/bit-vec"]
chrono = ["dep:chrono", "sqlx-core/chrono"]
ipnet = ["dep:ipnet", "sqlx-core/ipnet"]
ipnetwork = ["dep:ipnetwork", "sqlx-core/ipnetwork"]
json = ["dep:serde", "dep:serde_json", "sqlx-core/json"]
mac_address = ["dep:mac_address", "sqlx-core/mac_address"]
migrate = ["sqlx-core/migrate", "dep:crc"]
offline = ["json", "sqlx-core/offline", "smallvec/serde"]
rust_decimal = ["dep:rust_decimal", "rust_decimal/maths", "sqlx-core/rust_decimal"]
time = ["dep:time", "sqlx-core/time"]
uuid = ["dep:uuid", "sqlx-core/uuid"]

[rust]
name = "sqlx_postgres"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
atoi = { loaf = "crates-io/atoi", version = "^2.0" }
base64 = { loaf = "crates-io/base64", version = "^0.22.1", features = ["alloc"], default-features = false }
bigdecimal = { loaf = "crates-io/bigdecimal", version = "^0.4.0", optional = true }
bit-vec = { loaf = "crates-io/bit-vec", version = "^0.8", optional = true }
bitflags = { loaf = "crates-io/bitflags", version = "^2.4", default-features = false }
byteorder = { loaf = "crates-io/byteorder", version = "^1.4.3", features = ["std"], default-features = false }
chrono = { loaf = "crates-io/chrono", version = "^0.4.34", features = ["clock", "std"], default-features = false, optional = true }
crc = { loaf = "crates-io/crc", version = "^3.0.0", optional = true }
dotenvy = { loaf = "crates-io/dotenvy", version = "^0.15.7", default-features = false }
etcetera = { loaf = "crates-io/etcetera", version = "^0.11.0", target = "cfg(target_os = \"windows\")" }
futures-channel = { loaf = "crates-io/futures-channel", version = "^0.3.32", features = ["alloc", "sink", "std"], default-features = false }
futures-core = { loaf = "crates-io/futures-core", version = "^0.3.32", default-features = false }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3.32", features = ["alloc", "io", "sink"], default-features = false }
hex = { loaf = "crates-io/hex", version = "^0.4.3" }
hkdf = { loaf = "crates-io/hkdf", version = "^0.13.0" }
hmac = { loaf = "crates-io/hmac", version = "^0.13.0", default-features = false }
ipnet = { loaf = "crates-io/ipnet", version = "^2.3.0", optional = true }
ipnetwork = { loaf = "crates-io/ipnetwork", version = "^0.21.1", optional = true }
itoa = { loaf = "crates-io/itoa", version = "^1.0.5" }
log = { loaf = "crates-io/log", version = "^0.4.18" }
mac_address = { loaf = "crates-io/mac_address", version = "^1.1.5", optional = true }
md-5 = { loaf = "crates-io/md-5", version = "^0.11.0", default-features = false }
memchr = { loaf = "crates-io/memchr", version = "^2.5.0", default-features = false }
num-bigint = { loaf = "crates-io/num-bigint", version = "^0.4.3", optional = true }
rand = { loaf = "crates-io/rand", version = "^0.10.1", features = ["thread_rng"], default-features = false }
rust_decimal = { loaf = "crates-io/rust_decimal", version = "^1.36.0", features = ["std"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.219", features = ["derive"], optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.142", features = ["raw_value"], optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.11.0", default-features = false }
smallvec = { loaf = "crates-io/smallvec", version = "^1.13.1" }
sqlx-core = { loaf = "crates-io/sqlx-core", version = "=0.9.0" }
stringprep = { loaf = "crates-io/stringprep", version = "^0.1.2" }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.18", features = ["std"], default-features = false }
time = { loaf = "crates-io/time", version = "^0.3.47", features = ["formatting", "macros", "parsing"], optional = true }
tracing = { loaf = "crates-io/tracing", version = "^0.1.37", features = ["log"] }
uuid = { loaf = "crates-io/uuid", version = "^1.12.1", optional = true }
whoami = { loaf = "crates-io/whoami", version = "^2.0.2", default-features = false }
