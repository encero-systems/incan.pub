# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/notify-types"
version = "2.1.0"

[project.features]
serde = ["dep:serde", "bitflags/serde"]
serialization-compat-6 = []
web-time = ["dep:web-time"]

[rust]
name = "notify_types"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2" }
serde = { loaf = "crates-io/serde", version = "^1.0.89", features = ["derive"], optional = true }
web-time = { loaf = "crates-io/web-time", version = "^1.1.0", optional = true }
