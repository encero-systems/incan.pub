# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/assert-json-diff"
version = "2.0.2"

[rust]
name = "assert_json_diff"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1" }
serde_json = { loaf = "crates-io/serde_json", version = "^1" }
