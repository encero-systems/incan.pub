# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/icu_collections"
version = "2.1.1"

[project.features]
alloc = ["serde?/alloc", "zerovec/alloc"]
databake = ["dep:databake", "zerovec/databake"]
serde = ["dep:serde", "zerovec/serde", "potential_utf/serde", "alloc"]

[rust]
name = "icu_collections"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
databake = { loaf = "crates-io/databake", version = "^0.2.0", features = ["derive"], default-features = false, optional = true }
displaydoc = { loaf = "crates-io/displaydoc", version = "^0.2.3", default-features = false }
potential_utf = { loaf = "crates-io/potential_utf", version = "^0.1.3", features = ["zerovec"], default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0.220", features = ["derive"], default-features = false, optional = true }
yoke = { loaf = "crates-io/yoke", version = "^0.8.0", features = ["derive"], default-features = false }
zerofrom = { loaf = "crates-io/zerofrom", version = "^0.1.3", features = ["derive"], default-features = false }
zerovec = { loaf = "crates-io/zerovec", version = "^0.11.3", features = ["derive", "yoke"], default-features = false }
