# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/text-size"
version = "1.1.1"

[project.features]
serde = ["dep:serde"]

[rust]
name = "text_size"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0", default-features = false, optional = true }
