# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/mime_guess"
version = "2.0.5"

[project.features]
default = ["rev-mappings"]
rev-mappings = []

[rust]
name = "mime_guess"
type = "lib"
edition = "2015"
build-script = true

[dependencies]
mime = { loaf = "crates-io/mime", version = "^0.3" }
unicase = { loaf = "crates-io/unicase", version = "^2.4.0" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["default", "rev-mappings"]
cfg = []
environment = [{ name = "MIME_TYPES_GENERATED_PATH", out = "mime_types_generated.rs" }]
