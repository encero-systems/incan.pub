name = "crates-io/serde-value"
version = "0.7.0"

[rust]
name = "serde_value"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
ordered-float = { loaf = "crates-io/ordered-float", version = "^2.0.0" }
serde = { loaf = "crates-io/serde", version = "^1.0.0" }
