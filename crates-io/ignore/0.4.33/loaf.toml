# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ignore"
version = "0.4.33"

[project.features]
simd-accel = []

[rust]
name = "ignore"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
crossbeam-deque = { loaf = "crates-io/crossbeam-deque", version = "^0.8.3" }
globset = { loaf = "crates-io/globset", version = "^0.4.18" }
log = { loaf = "crates-io/log", version = "^0.4.20" }
memchr = { loaf = "crates-io/memchr", version = "^2.6.3" }
regex-automata = { loaf = "crates-io/regex-automata", version = "^0.4.18", features = ["dfa-onepass", "hybrid", "meta", "nfa", "perf", "std", "syntax"], default-features = false }
same-file = { loaf = "crates-io/same-file", version = "^1.0.6" }
walkdir = { loaf = "crates-io/walkdir", version = "^2.4.0" }
winapi-util = { loaf = "crates-io/winapi-util", version = "^0.1.2", target = "cfg(windows)" }
