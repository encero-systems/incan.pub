# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/objc2"
version = "0.6.5"

[project.features]
alloc = ["objc2-encode/alloc"]
catch-all = ["exception"]
default = ["std"]
disable-encoding-assertions = []
exception = ["dep:objc2-exception-helper"]
gnustep-1-7 = ["unstable-static-class", "objc2-exception-helper?/gnustep-1-7"]
gnustep-1-8 = ["gnustep-1-7", "objc2-exception-helper?/gnustep-1-8"]
gnustep-1-9 = ["gnustep-1-8", "objc2-exception-helper?/gnustep-1-9"]
gnustep-2-0 = ["gnustep-1-9", "objc2-exception-helper?/gnustep-2-0"]
gnustep-2-1 = ["gnustep-2-0", "objc2-exception-helper?/gnustep-2-1"]
objc2-proc-macros = []
relax-sign-encoding = []
relax-void-encoding = []
std = ["alloc", "objc2-encode/std"]
unstable-apple-new = []
unstable-arbitrary-self-types = []
unstable-autoreleasesafe = []
unstable-coerce-pointee = []
unstable-compiler-rt = ["gnustep-1-7"]
unstable-darwin-objc = []
unstable-gnustep-strict-apple-compat = ["gnustep-1-7"]
unstable-objfw = []
unstable-requires-macos = []
unstable-static-class = ["dep:objc2-proc-macros"]
unstable-static-class-inlined = ["unstable-static-class"]
unstable-static-sel = ["dep:objc2-proc-macros"]
unstable-static-sel-inlined = ["unstable-static-sel"]
unstable-winobjc = ["gnustep-1-8"]
verify = []

[rust]
name = "objc2"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
objc2-encode = { loaf = "crates-io/objc2-encode", version = "^4.1.0", default-features = false }
objc2-exception-helper = { loaf = "crates-io/objc2-exception-helper", version = "^0.1.1", default-features = false, optional = true }
objc2-proc-macros = { loaf = "crates-io/objc2-proc-macros", version = "^0.2.0", optional = true }
