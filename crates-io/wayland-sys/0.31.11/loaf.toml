# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wayland-sys"
version = "0.31.11"

[project.features]
client = ["dep:dlib", "dep:log"]
cursor = ["client"]
dlopen = ["once_cell"]
egl = ["client"]
libc = ["dep:libc"]
libwayland_client_1_23 = []
libwayland_server_1_22 = []
libwayland_server_1_23 = ["libwayland_server_1_22"]
memoffset = ["dep:memoffset"]
once_cell = ["dep:once_cell"]
server = ["libc", "memoffset", "dep:dlib", "dep:log"]

[rust]
name = "wayland_sys"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
dlib = { loaf = "crates-io/dlib", version = "^0.5.3", optional = true }
libc = { loaf = "crates-io/libc", version = "^0.2", optional = true }
log = { loaf = "crates-io/log", version = "^0.4", optional = true }
memoffset = { loaf = "crates-io/memoffset", version = "^0.9", optional = true }
once_cell = { loaf = "crates-io/once_cell", version = "^1.0", optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = []
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = []
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = []
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "release"
features = []
cfg = []
