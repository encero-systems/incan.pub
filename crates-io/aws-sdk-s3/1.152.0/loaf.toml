# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-sdk-s3"
version = "1.152.0"

[project.features]
behavior-version-latest = []
default = ["sigv4a", "http-1x", "rustls", "default-https-client", "rt-tokio"]
default-https-client = ["aws-smithy-runtime/default-https-client"]
gated-tests = []
http-02x = ["dep:http", "aws-smithy-runtime-api/http-02x"]
http-1x = ["aws-smithy-runtime-api/http-1x"]
legacy-https-client = ["aws-smithy-runtime/tls-rustls"]
legacy-test-util = ["test-util", "aws-smithy-runtime/legacy-test-util"]
rt-tokio = ["aws-smithy-async/rt-tokio", "aws-smithy-types/http-body-1-x", "aws-smithy-types/rt-tokio"]
rustls = ["aws-smithy-runtime/tls-rustls"]
sigv4a = ["aws-runtime/sigv4a"]
test-util = ["aws-credential-types/test-util"]

[rust]
name = "aws_sdk_s3"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
arc-swap = { loaf = "crates-io/arc-swap", version = "^1" }
aws-credential-types = { loaf = "crates-io/aws-credential-types", version = "^1.3.0" }
aws-runtime = { loaf = "crates-io/aws-runtime", version = "^1.10.0", features = ["event-stream", "http-1x"] }
aws-sigv4 = { loaf = "crates-io/aws-sigv4", version = "^1.6.0" }
aws-smithy-async = { loaf = "crates-io/aws-smithy-async", version = "^1.3.0" }
aws-smithy-checksums = { loaf = "crates-io/aws-smithy-checksums", version = "^0.65.0" }
aws-smithy-eventstream = { loaf = "crates-io/aws-smithy-eventstream", version = "^0.61.4" }
aws-smithy-http = { loaf = "crates-io/aws-smithy-http", version = "^0.64.1", features = ["event-stream"] }
aws-smithy-json = { loaf = "crates-io/aws-smithy-json", version = "^0.63.1" }
aws-smithy-observability = { loaf = "crates-io/aws-smithy-observability", version = "^0.3.0" }
aws-smithy-runtime = { loaf = "crates-io/aws-smithy-runtime", version = "^1.16.0", features = ["client"] }
aws-smithy-runtime-api = { loaf = "crates-io/aws-smithy-runtime-api", version = "^1.19.0", features = ["client", "http-1x"] }
aws-smithy-schema = { loaf = "crates-io/aws-smithy-schema", version = "^0.2.1" }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.8.1", features = ["http-body-1-x"] }
aws-smithy-xml = { loaf = "crates-io/aws-smithy-xml", version = "^0.62.1" }
aws-types = { loaf = "crates-io/aws-types", version = "^1.6.0" }
bytes = { loaf = "crates-io/bytes", version = "^1.4.0" }
fastrand = { loaf = "crates-io/fastrand", version = "^2.0.0" }
hex = { loaf = "crates-io/hex", version = "^0.4.3" }
hmac = { loaf = "crates-io/hmac", version = "^0.13" }
http = { loaf = "crates-io/http", version = "^0.2.9", optional = true }
http-1x = { loaf = "crates-io/http", version = "^1" }
http-body-1x = { loaf = "crates-io/http-body", version = "^1" }
lru = { loaf = "crates-io/lru", version = "^0.18.2" }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.0.0" }
regex-lite = { loaf = "crates-io/regex-lite", version = "^0.1.5" }
sha2 = { loaf = "crates-io/sha2", version = "^0.11" }
tracing = { loaf = "crates-io/tracing", version = "^0.1" }
url = { loaf = "crates-io/url", version = "^2.3.1" }
