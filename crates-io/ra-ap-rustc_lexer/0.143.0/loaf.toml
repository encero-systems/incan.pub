# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra-ap-rustc_lexer"
version = "0.143.0"

[rust]
name = "ra_ap_rustc_lexer"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
memchr = { loaf = "crates-io/memchr", version = "^2.7.6" }
unicode-properties = { loaf = "crates-io/unicode-properties", version = "^0.1.0", features = ["emoji"], default-features = false }
unicode-xid = { loaf = "crates-io/unicode-xid", version = "^0.2.0" }
