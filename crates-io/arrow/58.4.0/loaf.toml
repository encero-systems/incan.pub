arrow-data = { loaf = "crates-io/arrow-data", version = "^58.4.0" }
arrow-ipc = { loaf = "crates-io/arrow-ipc", version = "^58.4.0", optional = true }
arrow-json = { loaf = "crates-io/arrow-json", version = "^58.4.0", optional = true }
arrow-ord = { loaf = "crates-io/arrow-ord", version = "^58.4.0" }
arrow-pyarrow = { loaf = "crates-io/arrow-pyarrow", version = "^58.4.0", optional = true }
arrow-row = { loaf = "crates-io/arrow-row", version = "^58.4.0" }
arrow-schema = { loaf = "crates-io/arrow-schema", version = "^58.4.0" }
arrow-select = { loaf = "crates-io/arrow-select", version = "^58.4.0" }
arrow-string = { loaf = "crates-io/arrow-string", version = "^58.4.0" }
half = { loaf = "crates-io/half", version = "^2.1", features = ["rand_distr"], default-features = false, optional = true }
rand = { loaf = "crates-io/rand", version = "^0.9", features = ["std", "std_rng", "thread_rng"], default-features = false, optional = true }

