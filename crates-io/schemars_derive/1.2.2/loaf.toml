# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/schemars_derive"
version = "1.2.2"

[rust]
name = "schemars_derive"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.91" }
quote = { loaf = "crates-io/quote", version = "^1.0.35" }
serde_derive_internals = { loaf = "crates-io/serde_derive_internals", version = "^0.30.0" }
syn = { loaf = "crates-io/syn", version = "^3" }
