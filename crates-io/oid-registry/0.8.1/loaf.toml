# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/oid-registry"
version = "0.8.1"

[project.features]
crypto = ["kdf", "pkcs1", "pkcs7", "pkcs9", "pkcs12", "nist_algs", "x962"]
default = ["registry"]
kdf = []
ms_spc = []
nist_algs = []
pkcs1 = []
pkcs12 = []
pkcs7 = []
pkcs9 = []
registry = []
x500 = []
x509 = []
x962 = []

[rust]
name = "oid_registry"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
asn1-rs = { loaf = "crates-io/asn1-rs", version = "^0.7" }
