# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cssparser-macros"
version = "0.7.1"

[rust]
name = "cssparser_macros"
type = "proc-macro"
edition = "2018"
build-script = false

[rust.source]
root = "lib.rs"

[dependencies]
quote = { loaf = "crates-io/quote", version = "^1.0.29" }
syn = { loaf = "crates-io/syn", version = ">=2, <4", features = ["extra-traits", "full"] }
