# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/darling_core"
version = "0.24.1"

[project.features]
diagnostics = []
serde = ["dep:serde"]
strsim = ["dep:strsim"]
suggestions = ["strsim"]

[rust]
name = "darling_core"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
ident_case = { loaf = "crates-io/ident_case", version = "^1.0.1" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.86" }
quote = { loaf = "crates-io/quote", version = "^1.0.18" }
serde = { loaf = "crates-io/serde", version = "^1.0.210", optional = true }
strsim = { loaf = "crates-io/strsim", version = "^0.11.1", optional = true }
syn = { loaf = "crates-io/syn", version = "^3.0.0", features = ["extra-traits", "full"] }
