# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/page_size"
version = "0.6.0"

[project.features]
no_std = ["spin"]
spin = ["dep:spin"]

[rust]
name = "page_size"
type = "lib"
edition = "2015"
build-script = false

[dependencies]
libc = { loaf = "crates-io/libc", version = "^0.2", target = "cfg(unix)" }
spin = { loaf = "crates-io/spin", version = "^0.9.8", optional = true }
winapi = { loaf = "crates-io/winapi", version = "^0.3.9", features = ["sysinfoapi"], target = "cfg(windows)" }
