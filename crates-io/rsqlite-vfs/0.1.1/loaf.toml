# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rsqlite-vfs"
version = "0.1.1"

[rust]
name = "rsqlite_vfs"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.16.1", features = ["default-hasher"], default-features = false }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.12", default-features = false }
