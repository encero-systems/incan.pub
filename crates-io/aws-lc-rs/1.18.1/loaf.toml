# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-lc-rs"
version = "1.18.1"

[project.features]
alloc = []
asan = ["aws-lc-sys?/asan", "aws-lc-fips-sys?/asan"]
aws-lc-sys = ["dep:aws-lc-sys"]
bindgen = ["aws-lc-sys?/bindgen", "aws-lc-fips-sys?/bindgen"]
default = ["aws-lc-sys", "alloc", "ring-io", "ring-sig-verify"]
dev-tests-only = []
fips = ["dep:aws-lc-fips-sys"]
legacy-des = ["aws-lc-sys?/all-bindings"]
non-fips = ["aws-lc-sys"]
prebuilt-nasm = ["aws-lc-sys?/prebuilt-nasm"]
ring-io = ["dep:untrusted"]
ring-sig-verify = ["dep:untrusted"]
test_logging = []
unstable = []

[rust]
name = "aws_lc_rs"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
aws-lc-fips-sys = { loaf = "crates-io/aws-lc-fips-sys", version = "^0.14.2", optional = true }
aws-lc-sys = { loaf = "crates-io/aws-lc-sys", version = "^0.45.0", default-features = false, optional = true }
untrusted = { loaf = "crates-io/untrusted", version = "^0.7.1", optional = true }
zeroize = { loaf = "crates-io/zeroize", version = "^1.8.1" }
