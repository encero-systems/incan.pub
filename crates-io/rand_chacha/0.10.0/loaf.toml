# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rand_chacha"
version = "0.10.0"

[project.features]
default = ["std"]
serde = ["dep:serde"]
std = ["ppv-lite86/std"]

[rust]
name = "rand_chacha"
type = "lib"
edition = "2024"

[dependencies]
ppv-lite86 = { loaf = "crates-io/ppv-lite86", version = "^0.2.14", features = ["simd"], default-features = false }
rand_core = { loaf = "crates-io/rand_core", version = "^0.10.0" }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive"], optional = true }
