[project]
name = "crates-io/blake3"
version = "1.8.7"

[project.features]
default = ["std"]
digest = ["dep:digest"]
mmap = ["std", "dep:memmap2"]
neon = []
no_avx2 = []
no_avx512 = []
no_neon = []
no_sse2 = []
no_sse41 = []
prefer_intrinsics = []
pure = []
rayon = ["dep:rayon-core"]
serde = ["dep:serde"]
std = ["constant_time_eq/std"]
traits-preview = ["dep:digest"]
wasm32_simd = []
zeroize = ["dep:zeroize", "arrayvec/zeroize"]

[rust]
name = "blake3"
type = "lib"
edition = "2024"
build-script = true

[dependencies]
arrayvec = { loaf = "crates-io/arrayvec", version = "^0.7.4", default-features = false }
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.0" }
constant_time_eq = { loaf = "crates-io/constant_time_eq", version = "^0.4.2", default-features = false }
cpufeatures = { loaf = "crates-io/cpufeatures", version = "^0.3.0", target = "cfg(any(target_arch = \"x86\", target_arch = \"x86_64\"))" }
digest = { loaf = "crates-io/digest", version = "^0.11.2", features = ["mac"], optional = true }
memmap2 = { loaf = "crates-io/memmap2", version = "^0.9", optional = true }
rayon-core = { loaf = "crates-io/rayon-core", version = "^1.12.1", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive"], default-features = false, optional = true }
zeroize = { loaf = "crates-io/zeroize", version = "^1", default-features = false, optional = true }

