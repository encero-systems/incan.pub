# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/is-macro"
version = "0.3.8"

[project.features]
small-panic = []

[rust]
name = "is_macro"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
heck = { loaf = "crates-io/heck", version = "^0.5.0" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.94" }
quote = { loaf = "crates-io/quote", version = "^1.0.40" }
syn = { loaf = "crates-io/syn", version = "^2.0.100", features = ["derive", "extra-traits", "fold", "full"] }
