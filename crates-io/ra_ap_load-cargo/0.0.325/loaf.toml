# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra_ap_load-cargo"
version = "0.0.325"

[project.features]
in-rust-tree = ["hir-expand/in-rust-tree"]

[rust]
name = "ra_ap_load_cargo"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.98" }
crossbeam-channel = { loaf = "crates-io/crossbeam-channel", version = "^0.5.15" }
hir-expand = { loaf = "crates-io/ra_ap_hir_expand", version = "=0.0.325" }
ide-db = { loaf = "crates-io/ra_ap_ide_db", version = "=0.0.325" }
intern = { loaf = "crates-io/ra_ap_intern", version = "=0.0.325" }
itertools = { loaf = "crates-io/itertools", version = "^0.14.0" }
proc-macro-api = { loaf = "crates-io/ra_ap_proc_macro_api", version = "=0.0.325" }
project-model = { loaf = "crates-io/ra_ap_project_model", version = "=0.0.325" }
span = { loaf = "crates-io/ra_ap_span", version = "=0.0.325" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.41", features = ["std"], default-features = false }
tt = { loaf = "crates-io/ra_ap_tt", version = "=0.0.325" }
vfs = { loaf = "crates-io/ra_ap_vfs", version = "=0.0.325" }
vfs-notify = { loaf = "crates-io/ra_ap_vfs-notify", version = "=0.0.325" }
