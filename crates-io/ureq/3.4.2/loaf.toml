# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ureq"
version = "3.4.2"

[project.features]
_doc = ["rustls?/aws-lc-rs"]
_ring = ["rustls?/ring"]
_rustls = []
_test = []
_tls = ["dep:rustls-pki-types"]
_url = ["dep:url"]
brotli = ["dep:brotli-decompressor"]
charset = ["dep:encoding_rs"]
cookies = ["dep:cookie_store", "_url"]
default = ["rustls", "gzip"]
gzip = ["dep:flate2"]
json = ["dep:serde", "dep:serde_json", "cookie_store?/serde_json"]
multipart = ["dep:mime_guess", "dep:getrandom"]
native-tls = ["native-tls-no-default", "dep:der", "_tls", "native-tls-webpki-roots"]
native-tls-no-default = ["dep:native-tls", "dep:der", "_tls"]
native-tls-webpki-roots = ["dep:webpki-root-certs"]
platform-verifier = ["dep:rustls-platform-verifier"]
rustls = ["rustls-no-provider", "_ring", "rustls-webpki-roots"]
rustls-no-provider = ["dep:rustls", "_tls", "_rustls"]
rustls-webpki-roots = ["dep:webpki-roots"]
socks-proxy = ["dep:socks"]
vendored = ["native-tls?/vendored"]
win-system-proxy = ["dep:winreg"]

[rust]
name = "ureq"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
base64 = { loaf = "crates-io/base64", version = "^0.23.1", features = ["std"], default-features = false }
brotli-decompressor = { loaf = "crates-io/brotli-decompressor", version = "^5.0.0", optional = true }
cookie_store = { loaf = "crates-io/cookie_store", version = "^0.22", features = ["preserve_order"], default-features = false, optional = true }
der = { loaf = "crates-io/der", version = "^0.8.0", features = ["pem", "std"], default-features = false, optional = true }
encoding_rs = { loaf = "crates-io/encoding_rs", version = "^0.8.34", optional = true }
flate2 = { loaf = "crates-io/flate2", version = "^1.0.30", optional = true }
getrandom = { loaf = "crates-io/getrandom", version = "^0.4", optional = true }
log = { loaf = "crates-io/log", version = "^0.4.25" }
mime_guess = { loaf = "crates-io/mime_guess", version = "^2.0.5", optional = true }
native-tls = { loaf = "crates-io/native-tls", version = "^0.2.14", default-features = false, optional = true }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.3.1" }
rustls = { loaf = "crates-io/rustls", version = "^0.23.22", features = ["logging", "std", "tls12"], default-features = false, optional = true }
rustls-pki-types = { loaf = "crates-io/rustls-pki-types", version = "^1.11.0", features = ["std"], default-features = false, optional = true }
rustls-platform-verifier = { loaf = "crates-io/rustls-platform-verifier", version = "^0.7.0", default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.138", features = ["std"], default-features = false, optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.120", features = ["std"], default-features = false, optional = true }
socks = { loaf = "crates-io/socks", version = "^0.3.4", optional = true }
ureq-proto = { loaf = "crates-io/ureq-proto", version = "^0.6.3", features = ["client"], default-features = false }
url = { loaf = "crates-io/url", version = "^2.3.1", default-features = false, optional = true }
utf8-zero = { loaf = "crates-io/utf8-zero", version = "^0.8.1" }
webpki-root-certs = { loaf = "crates-io/webpki-root-certs", version = "^1.0.0", default-features = false, optional = true }
webpki-roots = { loaf = "crates-io/webpki-roots", version = "^1.0.0", default-features = false, optional = true }
winreg = { loaf = "crates-io/winreg", version = "^0.56", optional = true, target = "cfg(windows)" }
