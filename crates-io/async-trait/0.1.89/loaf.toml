# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/async-trait"
version = "0.1.89"

[rust]
name = "async_trait"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.74" }
quote = { loaf = "crates-io/quote", version = "^1.0.35" }
syn = { loaf = "crates-io/syn", version = "^2.0.46", features = ["clone-impls", "full", "parsing", "printing", "proc-macro", "visit-mut"], default-features = false }
