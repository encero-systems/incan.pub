# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/num-bigint"
version = "0.5.1"

[project.features]
arbitrary = ["dep:arbitrary"]
default = ["std"]
quickcheck = ["dep:quickcheck"]
rand_0_10 = ["rand_core_0_10", "dep:rand_0_10"]
rand_0_9 = ["rand_core_0_9", "dep:rand_0_9"]
rand_core_0_10 = ["dep:rand_core_0_10"]
rand_core_0_9 = ["dep:rand_core_0_9"]
serde = ["dep:serde"]
std = ["num-integer/std", "num-traits/std"]

[rust]
name = "num_bigint"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1", default-features = false, optional = true }
num-integer = { loaf = "crates-io/num-integer", version = "^0.1.46", features = ["i128"], default-features = false }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.18", features = ["i128"], default-features = false }
quickcheck = { loaf = "crates-io/quickcheck", version = "^1", default-features = false, optional = true }
rand_0_10 = { loaf = "crates-io/rand", version = "^0.10", default-features = false, optional = true }
rand_0_9 = { loaf = "crates-io/rand", version = "^0.9", default-features = false, optional = true }
rand_core_0_10 = { loaf = "crates-io/rand_core", version = "^0.10", default-features = false, optional = true }
rand_core_0_9 = { loaf = "crates-io/rand_core", version = "^0.9", default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", default-features = false, optional = true }
