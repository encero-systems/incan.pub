# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/system-configuration"
version = "0.7.0"

[rust]
name = "system_configuration"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2" }
core-foundation = { loaf = "crates-io/core-foundation", version = "^0.9" }
system-configuration-sys = { loaf = "crates-io/system-configuration-sys", version = "^0.6" }
