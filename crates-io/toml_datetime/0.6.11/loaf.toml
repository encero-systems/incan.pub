# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/toml_datetime"
version = "0.6.11"

[project.features]
serde = ["dep:serde"]

[rust]
name = "toml_datetime"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0.145", optional = true }
