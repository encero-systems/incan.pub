# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rusqlite"
version = "0.40.2"

[project.features]
array = ["vtab", "pointer"]
backup = []
blob = []
buildtime_bindgen = ["libsqlite3-sys?/buildtime_bindgen", "sqlite-wasm-rs?/bindgen"]
bundled = ["libsqlite3-sys?/bundled", "modern_sqlite"]
bundled-full = ["modern-full", "bundled"]
bundled-sqlcipher = ["libsqlite3-sys?/bundled-sqlcipher", "bundled"]
bundled-sqlcipher-vendored-openssl = ["libsqlite3-sys?/bundled-sqlcipher-vendored-openssl", "bundled-sqlcipher"]
bundled-windows = ["libsqlite3-sys?/bundled-windows"]
cache = ["hashlink"]
chrono = ["dep:chrono"]
collation = []
column_decltype = []
column_metadata = ["libsqlite3-sys?/column_metadata"]
csv = ["dep:csv"]
csvtab = ["csv", "vtab"]
default = ["cache", "ffi-sqlite-wasm-rs"]
extra_check = []
fallible_uint = []
ffi-sqlite-wasm-rs = ["dep:sqlite-wasm-rs"]
functions = []
hashlink = ["dep:hashlink"]
hooks = []
i128_blob = []
in_gecko = ["modern_sqlite", "libsqlite3-sys?/in_gecko"]
jiff = ["dep:jiff"]
libsqlite3-sys = ["dep:libsqlite3-sys"]
limits = []
load_extension = []
loadable_extension = ["libsqlite3-sys?/loadable_extension"]
modern-full = ["array", "backup", "blob", "modern_sqlite", "chrono", "collation", "column_metadata", "column_decltype", "csvtab", "extra_check", "functions", "hooks", "i128_blob", "jiff", "limits", "load_extension", "serde_json", "serialize", "series", "time", "trace", "unlock_notify", "url", "uuid", "vtab", "window"]
modern_sqlite = ["libsqlite3-sys?/bundled_bindings"]
pointer = []
preupdate_hook = ["libsqlite3-sys?/preupdate_hook", "hooks"]
rusqlite-macros = ["dep:rusqlite-macros"]
serde_json = ["dep:serde_json"]
serialize = []
series = ["vtab"]
session = ["libsqlite3-sys?/session", "hooks"]
sqlcipher = ["libsqlite3-sys?/sqlcipher"]
time = ["dep:time"]
trace = []
unlock_notify = ["libsqlite3-sys?/unlock_notify"]
url = ["dep:url"]
uuid = ["dep:uuid"]
vtab = []
wasm32-wasi-vfs = ["libsqlite3-sys?/wasm32-wasi-vfs"]
window = ["functions"]
with-asan = ["libsqlite3-sys?/with-asan"]

[rust]
name = "rusqlite"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.6.0" }
chrono = [{ loaf = "crates-io/chrono", version = "^0.4.42", features = ["clock"], default-features = false, optional = true }, { loaf = "crates-io/chrono", version = "^0.4.42", features = ["wasmbind"], default-features = false, optional = true, target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }]
csv = { loaf = "crates-io/csv", version = "^1.1", optional = true }
fallible-iterator = { loaf = "crates-io/fallible-iterator", version = "^0.3" }
fallible-streaming-iterator = { loaf = "crates-io/fallible-streaming-iterator", version = "^0.1" }
hashlink = { loaf = "crates-io/hashlink", version = "^0.12", optional = true }
jiff = [{ loaf = "crates-io/jiff", version = "^0.2", features = ["js"], default-features = false, optional = true, target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }, { loaf = "crates-io/jiff", version = "^0.2", features = ["std"], default-features = false, optional = true }]
libsqlite3-sys = [{ loaf = "crates-io/libsqlite3-sys", version = "^0.38.2", target = "cfg(not(all(target_family = \"wasm\", target_os = \"unknown\")))" }, { loaf = "crates-io/libsqlite3-sys", version = "^0.38.1", optional = true, target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }]
rusqlite-macros = { loaf = "crates-io/rusqlite-macros", version = "^0.4.3", optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0", optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1.6.1" }
sqlite-wasm-rs = { loaf = "crates-io/sqlite-wasm-rs", version = "^0.5.1", default-features = false, optional = true, target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }
time = [{ loaf = "crates-io/time", version = "^0.3.47", features = ["formatting", "macros", "parsing"], optional = true }, { loaf = "crates-io/time", version = "^0.3.47", features = ["wasm-bindgen"], optional = true, target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }]
url = { loaf = "crates-io/url", version = "^2.1", optional = true }
uuid = [{ loaf = "crates-io/uuid", version = "^1.0", features = ["js"], optional = true, target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }, { loaf = "crates-io/uuid", version = "^1.0", optional = true }]
