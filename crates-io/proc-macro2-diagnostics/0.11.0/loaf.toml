# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/proc-macro2-diagnostics"
version = "0.11.0"

[project.features]
nightly = []

[rust]
name = "proc_macro2_diagnostics"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^3", features = ["parsing", "printing"], default-features = false }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = []
cfg = []
