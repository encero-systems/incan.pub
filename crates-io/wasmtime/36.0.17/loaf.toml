# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasmtime"
version = "36.0.17"

[project.features]
addr2line = ["dep:addr2line", "dep:gimli", "std"]
all-arch = ["wasmtime-cranelift?/all-arch", "wasmtime-winch?/all-arch", "pulley"]
async = ["dep:wasmtime-fiber", "dep:async-trait", "wasmtime-component-macro?/async", "runtime"]
cache = ["dep:wasmtime-cache", "std"]
call-hook = []
component-model = ["wasmtime-environ/component-model", "wasmtime-cranelift?/component-model", "wasmtime-winch?/component-model", "dep:wasmtime-component-macro", "dep:wasmtime-component-util", "dep:encoding_rs", "dep:semver"]
component-model-async = ["async", "component-model", "std", "wasmtime-component-macro?/component-model-async", "dep:futures", "futures/std"]
component-model-async-bytes = ["component-model-async", "dep:bytes"]
coredump = ["dep:wasm-encoder", "runtime", "std"]
cranelift = ["dep:wasmtime-cranelift", "std", "dep:wasmtime-unwinder", "wasmtime-unwinder/cranelift"]
custom-native-signals = []
custom-virtual-memory = []
debug-builtins = ["dep:wasmtime-jit-debug", "wasmtime-jit-debug/gdb_jit_int"]
default = ["async", "cache", "gc", "gc-drc", "gc-null", "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator", "demangle", "addr2line", "coredump", "debug-builtins", "runtime", "component-model", "threads", "stack-switching", "std"]
demangle = ["wasmtime-environ/demangle", "std"]
gc = ["wasmtime-environ/gc", "wasmtime-cranelift?/gc", "wasmtime-winch?/gc"]
gc-drc = ["gc", "wasmtime-environ/gc-drc", "wasmtime-cranelift?/gc-drc", "wasmtime-winch?/gc-drc"]
gc-null = ["gc", "wasmtime-environ/gc-null", "wasmtime-cranelift?/gc-null", "wasmtime-winch?/gc-null"]
incremental-cache = ["wasmtime-cranelift?/incremental-cache", "std"]
memory-protection-keys = ["pooling-allocator"]
once_cell = ["dep:once_cell"]
parallel-compilation = ["dep:rayon", "std"]
pooling-allocator = ["runtime", "std"]
profile-pulley = ["pulley", "profiling", "pulley-interpreter/profile"]
profiling = ["dep:fxprof-processed-profile", "dep:ittapi", "dep:rustix", "rustix/thread", "dep:serde_json", "std", "dep:wasmtime-jit-debug", "wasmtime-jit-debug/perf_jitdump"]
pulley = []
reexport-wasmparser = []
runtime = ["dep:smallvec", "dep:mach2", "dep:memfd", "dep:wasmtime-asm-macros", "dep:wasmtime-slab", "dep:wasmtime-versioned-export-macros", "dep:windows-sys", "pulley-interpreter/interp", "dep:wasmtime-unwinder"]
stack-switching = ["runtime", "std", "wasmtime-environ/stack-switching", "wasmtime-cranelift?/stack-switching", "wasmtime-winch?/stack-switching"]
std = ["postcard/use-std", "wasmtime-environ/std", "object/std", "once_cell", "wasmtime-fiber?/std", "pulley-interpreter/std", "wasmtime-math/std", "addr2line?/std", "dep:rustix", "wasmtime-jit-icache-coherence", "wasmtime-jit-debug?/std"]
threads = ["wasmtime-cranelift?/threads", "wasmtime-winch?/threads", "std"]
trace-log = ["wasmtime-cranelift?/trace-log"]
wasmtime-jit-debug = ["dep:wasmtime-jit-debug"]
wasmtime-jit-icache-coherence = ["dep:wasmtime-jit-icache-coherence"]
wat = ["dep:wat"]
wave = ["dep:wasm-wave", "component-model"]
winch = ["dep:wasmtime-winch", "std"]
wmemcheck = ["dep:wasmtime-wmemcheck", "wasmtime-cranelift?/wmemcheck", "wasmtime-winch?/wmemcheck", "wasmtime-environ/wmemcheck", "std"]

[rust]
name = "wasmtime"
type = "lib"
edition = "2024"
build-script = true

[dependencies]
addr2line = { loaf = "crates-io/addr2line", version = "^0.25.0", default-features = false, optional = true }
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.93", default-features = false }
async-trait = { loaf = "crates-io/async-trait", version = "^0.1.71", optional = true }
bitflags = { loaf = "crates-io/bitflags", version = "^2.0" }
bumpalo = { loaf = "crates-io/bumpalo", version = "^3.11.0" }
bytes = { loaf = "crates-io/bytes", version = "^1.4", default-features = false, optional = true }
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0" }
encoding_rs = { loaf = "crates-io/encoding_rs", version = "^0.8.31", optional = true }
futures = { loaf = "crates-io/futures", version = "^0.3.27", features = ["alloc"], default-features = false, optional = true }
fxprof-processed-profile = { loaf = "crates-io/fxprof-processed-profile", version = "^0.6.0", optional = true }
gimli = { loaf = "crates-io/gimli", version = "^0.32.0", features = ["read"], default-features = false, optional = true }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.15", features = ["default-hasher"], default-features = false }
indexmap = { loaf = "crates-io/indexmap", version = "^2.0.0", default-features = false }
ittapi = [{ loaf = "crates-io/ittapi", version = "^0.4.0", optional = true, target = "cfg(all(target_arch = \"x86_64\", target_os = \"linux\"))" }, { loaf = "crates-io/ittapi", version = "^0.4.0", optional = true, target = "cfg(all(target_arch = \"x86_64\", target_os = \"macos\"))" }, { loaf = "crates-io/ittapi", version = "^0.4.0", optional = true, target = "cfg(all(target_arch = \"x86_64\", target_os = \"windows\"))" }]
libc = { loaf = "crates-io/libc", version = "^0.2.112" }
log = { loaf = "crates-io/log", version = "^0.4.27", default-features = false }
mach2 = { loaf = "crates-io/mach2", version = "^0.4.2", optional = true, target = "cfg(target_vendor = \"apple\")" }
memfd = { loaf = "crates-io/memfd", version = "^0.6.2", optional = true, target = "cfg(target_os = \"linux\")" }
object = { loaf = "crates-io/object", version = "^0.37.0", features = ["elf", "read_core", "unaligned"], default-features = false }
once_cell = { loaf = "crates-io/once_cell", version = "^1.12.0", optional = true }
postcard = { loaf = "crates-io/postcard", version = "^1.0.8", features = ["alloc"], default-features = false }
pulley-interpreter = { loaf = "crates-io/pulley-interpreter", version = "=36.0.17" }
rayon = { loaf = "crates-io/rayon", version = "^1.0", optional = true }
rustix = { loaf = "crates-io/rustix", version = "^1.0.3", features = ["mm", "param"], optional = true, target = "cfg(unix)" }
semver = { loaf = "crates-io/semver", version = "^1.0.17", default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.215", features = ["alloc"], default-features = false }
serde_derive = { loaf = "crates-io/serde_derive", version = "^1.0.188" }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.80", optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1.6.1", features = ["union"], optional = true }
target-lexicon = { loaf = "crates-io/target-lexicon", version = "^0.13.0" }
wasm-encoder = { loaf = "crates-io/wasm-encoder", version = "^0.236.0", optional = true }
wasm-wave = { loaf = "crates-io/wasm-wave", version = "^0.236.0", optional = true }
wasmparser = { loaf = "crates-io/wasmparser", version = "^0.236.0", features = ["simd"], default-features = false }
wasmtime-asm-macros = { loaf = "crates-io/wasmtime-internal-asm-macros", version = "=36.0.17", optional = true }
wasmtime-cache = { loaf = "crates-io/wasmtime-internal-cache", version = "=36.0.17", optional = true }
wasmtime-component-macro = { loaf = "crates-io/wasmtime-internal-component-macro", version = "=36.0.17", optional = true }
wasmtime-component-util = { loaf = "crates-io/wasmtime-internal-component-util", version = "=36.0.17", optional = true }
wasmtime-cranelift = { loaf = "crates-io/wasmtime-internal-cranelift", version = "=36.0.17", features = ["pulley"], optional = true }
wasmtime-environ = { loaf = "crates-io/wasmtime-environ", version = "=36.0.17" }
wasmtime-fiber = { loaf = "crates-io/wasmtime-internal-fiber", version = "=36.0.17", optional = true }
wasmtime-jit-debug = { loaf = "crates-io/wasmtime-internal-jit-debug", version = "=36.0.17", optional = true }
wasmtime-jit-icache-coherence = { loaf = "crates-io/wasmtime-internal-jit-icache-coherence", version = "=36.0.17", optional = true }
wasmtime-math = { loaf = "crates-io/wasmtime-internal-math", version = "=36.0.17" }
wasmtime-slab = { loaf = "crates-io/wasmtime-internal-slab", version = "=36.0.17", optional = true }
wasmtime-unwinder = { loaf = "crates-io/wasmtime-internal-unwinder", version = "=36.0.17", optional = true }
wasmtime-versioned-export-macros = { loaf = "crates-io/wasmtime-internal-versioned-export-macros", version = "=36.0.17" }
wasmtime-winch = { loaf = "crates-io/wasmtime-internal-winch", version = "=36.0.17", optional = true }
wasmtime-wmemcheck = { loaf = "crates-io/wasmtime-internal-wmemcheck", version = "=36.0.17", optional = true }
wat = { loaf = "crates-io/wat", version = "^1.236.0", optional = true }
windows-sys = { loaf = "crates-io/windows-sys", version = "^0.60.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_SystemInformation"], optional = true, target = "cfg(target_os = \"windows\")" }
