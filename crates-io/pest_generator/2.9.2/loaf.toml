# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/pest_generator"
version = "2.9.2"

[project.features]
default = ["std"]
export-internal = []
grammar-extras = ["pest_meta/grammar-extras"]
std = ["pest/std"]

[rust]
name = "pest_generator"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
pest = { loaf = "crates-io/pest", version = "^2.9.2", default-features = false }
pest_meta = { loaf = "crates-io/pest_meta", version = "^2.9.2" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^2.0" }
