# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ttf-parser"
version = "0.20.0"

[project.features]
apple-layout = []
default = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"]
glyph-names = []
gvar-alloc = ["std"]
opentype-layout = []
std = []
variable-fonts = []

[rust]
name = "ttf_parser"
type = "lib"
edition = "2018"
build-script = false
