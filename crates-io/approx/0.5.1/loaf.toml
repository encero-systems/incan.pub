# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/approx"
version = "0.5.1"

[project.features]
default = ["std"]
num-complex = ["dep:num-complex"]
std = []

[rust]
name = "approx"
type = "lib"
edition = "2015"
build-script = false

[dependencies]
num-complex = { loaf = "crates-io/num-complex", version = "^0.4.0", optional = true }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.0", default-features = false }
