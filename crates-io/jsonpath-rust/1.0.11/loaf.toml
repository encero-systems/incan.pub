# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/jsonpath-rust"
version = "1.0.11"

[rust]
name = "jsonpath_rust"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
pest = { loaf = "crates-io/pest", version = "^2.7.15" }
pest_derive = { loaf = "crates-io/pest_derive", version = "^2.7.15" }
regex = { loaf = "crates-io/regex", version = "^1" }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0" }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.9" }
