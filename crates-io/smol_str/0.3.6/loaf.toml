# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/smol_str"
version = "0.3.6"

[project.features]
arbitrary = ["dep:arbitrary"]
borsh = ["dep:borsh"]
default = ["std"]
serde = ["dep:serde_core"]
std = ["serde_core?/std", "borsh?/std"]

[rust]
name = "smol_str"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.3", optional = true }
borsh = { loaf = "crates-io/borsh", version = "^1.4.0", default-features = false, optional = true }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0.220", default-features = false, optional = true }
