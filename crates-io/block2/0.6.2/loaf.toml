# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/block2"
version = "0.6.2"

[project.features]
alloc = []
compiler-rt = ["objc2/unstable-compiler-rt"]
default = ["std"]
gnustep-1-7 = ["objc2/gnustep-1-7"]
gnustep-1-8 = ["gnustep-1-7", "objc2/gnustep-1-8"]
gnustep-1-9 = ["gnustep-1-8", "objc2/gnustep-1-9"]
gnustep-2-0 = ["gnustep-1-9", "objc2/gnustep-2-0"]
gnustep-2-1 = ["gnustep-2-0", "objc2/gnustep-2-1"]
std = ["alloc"]
unstable-coerce-pointee = []
unstable-objfw = []
unstable-private = []
unstable-winobjc = ["gnustep-1-8"]

[rust]
name = "block2"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
objc2 = { loaf = "crates-io/objc2", version = ">=0.6.2, <0.8.0", features = ["std"], default-features = false }
