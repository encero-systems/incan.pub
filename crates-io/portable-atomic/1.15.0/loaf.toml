# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/portable-atomic"
version = "1.15.0"

[project.features]
critical-section = ["dep:critical-section"]
default = ["fallback"]
disable-fiq = []
fallback = []
float = []
force-amo = []
require-cas = []
s-mode = []
serde = ["dep:serde"]
std = []
unsafe-assume-privileged = []
unsafe-assume-single-core = []

[rust]
name = "portable_atomic"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
critical-section = { loaf = "crates-io/critical-section", version = "^1", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.60", default-features = false, optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = []
cfg = ["portable_atomic_ll_sc_rmw", "portable_atomic_target_feature=\"lse2\""]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default", "fallback"]
cfg = ["portable_atomic_ll_sc_rmw", "portable_atomic_target_feature=\"lse2\""]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["fallback"]
cfg = ["portable_atomic_ll_sc_rmw", "portable_atomic_target_feature=\"lse2\""]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["require-cas"]
cfg = ["portable_atomic_ll_sc_rmw", "portable_atomic_target_feature=\"lse2\""]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = []
cfg = ["portable_atomic_ll_sc_rmw", "portable_atomic_target_feature=\"lse2\""]
