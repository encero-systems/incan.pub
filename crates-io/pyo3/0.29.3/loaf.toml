# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/pyo3"
version = "0.29.3"

[project.features]
abi3 = ["pyo3-ffi/abi3"]
abi3-py310 = ["abi3-py311", "pyo3-ffi/abi3-py310"]
abi3-py311 = ["abi3-py312", "pyo3-ffi/abi3-py311"]
abi3-py312 = ["abi3-py313", "pyo3-ffi/abi3-py312"]
abi3-py313 = ["abi3-py314", "pyo3-ffi/abi3-py313"]
abi3-py314 = ["abi3-py315", "pyo3-ffi/abi3-py314"]
abi3-py315 = ["abi3", "pyo3-ffi/abi3-py315"]
abi3-py38 = ["abi3-py39", "pyo3-ffi/abi3-py38"]
abi3-py39 = ["abi3-py310", "pyo3-ffi/abi3-py39"]
abi3t = ["pyo3-ffi/abi3t"]
abi3t-py315 = ["abi3t", "pyo3-ffi/abi3t-py315"]
anyhow = ["dep:anyhow"]
arc_lock = ["lock_api", "dep:lock_api", "lock_api/arc_lock", "parking_lot?/arc_lock"]
auto-initialize = []
bigdecimal = ["dep:bigdecimal", "num-bigint"]
bytes = ["dep:bytes"]
chrono = ["dep:chrono"]
chrono-local = ["dep:chrono", "chrono/clock", "dep:iana-time-zone"]
chrono-tz = ["dep:chrono-tz"]
default = ["macros"]
either = ["dep:either"]
experimental-async = ["macros", "dep:pyo3-macros", "pyo3-macros/experimental-async"]
experimental-inspect = ["dep:pyo3-macros", "pyo3-macros/experimental-inspect"]
extension-module = ["pyo3-ffi/extension-module"]
eyre = ["dep:eyre"]
full = ["macros", "anyhow", "arc_lock", "bigdecimal", "bytes", "chrono", "chrono-local", "chrono-tz", "either", "experimental-async", "experimental-inspect", "eyre", "hashbrown", "indexmap", "jiff-02", "lock_api", "num-bigint", "num-complex", "num-rational", "ordered-float", "parking_lot", "py-clone", "rust_decimal", "serde", "smallvec", "time", "uuid"]
generate-import-lib = ["pyo3-ffi/generate-import-lib"]
hashbrown = ["dep:hashbrown"]
indexmap = ["dep:indexmap"]
inventory = ["dep:inventory"]
jiff-02 = ["dep:jiff-02"]
lock_api = ["dep:lock_api"]
macros = ["pyo3-macros"]
multiple-pymethods = ["inventory", "dep:pyo3-macros", "pyo3-macros/multiple-pymethods"]
nightly = []
num-bigint = ["dep:num-bigint", "dep:num-traits"]
num-complex = ["dep:num-complex"]
num-rational = ["dep:num-rational"]
ordered-float = ["dep:ordered-float"]
parking_lot = ["dep:parking_lot", "lock_api"]
py-clone = []
pyo3-macros = ["dep:pyo3-macros"]
rust_decimal = ["dep:rust_decimal"]
serde = ["dep:serde"]
smallvec = ["dep:smallvec"]
time = ["dep:time"]
uuid = ["dep:uuid"]

[rust]
name = "pyo3"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.1", optional = true }
bigdecimal = { loaf = "crates-io/bigdecimal", version = "^0.4.7", optional = true }
bytes = { loaf = "crates-io/bytes", version = "^1.10", optional = true }
chrono = { loaf = "crates-io/chrono", version = "^0.4.25", default-features = false, optional = true }
chrono-tz = { loaf = "crates-io/chrono-tz", version = ">=0.10, <0.11", default-features = false, optional = true }
either = { loaf = "crates-io/either", version = "^1.9", optional = true }
eyre = { loaf = "crates-io/eyre", version = ">=0.6.8, <0.7", optional = true }
hashbrown = { loaf = "crates-io/hashbrown", version = ">=0.15.0, <0.18", features = ["default-hasher"], default-features = false, optional = true }
iana-time-zone = { loaf = "crates-io/iana-time-zone", version = "^0.1", features = ["fallback"], optional = true }
indexmap = { loaf = "crates-io/indexmap", version = ">=2.5.0, <3", optional = true }
inventory = { loaf = "crates-io/inventory", version = "^0.3.5", optional = true }
jiff-02 = { loaf = "crates-io/jiff", version = "^0.2", optional = true }
libc = { loaf = "crates-io/libc", version = "^0.2.62" }
lock_api = { loaf = "crates-io/lock_api", version = "^0.4", optional = true }
num-bigint = { loaf = "crates-io/num-bigint", version = "^0.4.4", optional = true }
num-complex = { loaf = "crates-io/num-complex", version = ">=0.4.6, <0.5", optional = true }
num-rational = { loaf = "crates-io/num-rational", version = "^0.4.1", optional = true }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.16", optional = true }
once_cell = { loaf = "crates-io/once_cell", version = "^1.21" }
ordered-float = { loaf = "crates-io/ordered-float", version = "^5.0.0", default-features = false, optional = true }
parking_lot = { loaf = "crates-io/parking_lot", version = "^0.12", optional = true }
portable-atomic = { loaf = "crates-io/portable-atomic", version = "^1.0", target = "cfg(not(target_has_atomic = \"64\"))" }
pyo3-ffi = { loaf = "crates-io/pyo3-ffi", version = "=0.29.3" }
pyo3-macros = { loaf = "crates-io/pyo3-macros", version = "=0.29.3", optional = true }
rust_decimal = { loaf = "crates-io/rust_decimal", version = "^1.15", default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1.0", optional = true }
time = { loaf = "crates-io/time", version = "^0.3.38", default-features = false, optional = true }
uuid = { loaf = "crates-io/uuid", version = "^1.12.0", optional = true }
