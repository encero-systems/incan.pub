# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tar"
version = "0.4.46"

[project.features]
default = ["xattr"]
xattr = ["dep:xattr"]

[rust]
name = "tar"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
filetime = { loaf = "crates-io/filetime", version = "^0.2.8" }
libc = { loaf = "crates-io/libc", version = "^0.2", target = "cfg(unix)" }
xattr = { loaf = "crates-io/xattr", version = "^1.1.3", optional = true, target = "cfg(unix)" }
