# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ena"
version = "0.14.4"

[project.features]
bench = []
dogged = ["dep:dogged"]
persistent = ["dogged"]

[rust]
name = "ena"
type = "lib"
edition = "2015"
build-script = false

[dependencies]
dogged = { loaf = "crates-io/dogged", version = "^0.2.0", optional = true }
log = { loaf = "crates-io/log", version = "^0.4" }
