# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/dlib"
version = "0.5.3"

[rust]
name = "dlib"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
libloading = { loaf = "crates-io/libloading", version = ">=0.7, <0.9" }
