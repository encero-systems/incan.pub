# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-smithy-http"
version = "0.64.1"

[project.features]
aws-smithy-eventstream = ["dep:aws-smithy-eventstream"]
event-stream = ["aws-smithy-eventstream"]
rt-tokio = ["aws-smithy-types/rt-tokio"]

[rust]
name = "aws_smithy_http"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
aws-smithy-eventstream = { loaf = "crates-io/aws-smithy-eventstream", version = "^0.61.4", optional = true }
aws-smithy-runtime-api = { loaf = "crates-io/aws-smithy-runtime-api", version = "^1.18.0", features = ["client", "http-1x"] }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.8.1", features = ["byte-stream-poll-next", "http-body-1-x"] }
bytes = { loaf = "crates-io/bytes", version = "^1.11.1" }
bytes-utils = { loaf = "crates-io/bytes-utils", version = "^0.1" }
futures-core = { loaf = "crates-io/futures-core", version = "^0.3.31" }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3.29", default-features = false }
http-1x = { loaf = "crates-io/http", version = "^1.3.1" }
http-body-1x = { loaf = "crates-io/http-body", version = "^1.0.1" }
http-body-util = { loaf = "crates-io/http-body-util", version = "^0.1.3" }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.3.1" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.14" }
pin-utils = { loaf = "crates-io/pin-utils", version = "^0.1.0" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.44" }
