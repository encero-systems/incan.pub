# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/io-extras"
version = "0.18.4"

[project.features]
async-std = ["dep:async-std"]
default = []
mio = ["dep:mio"]
os_pipe = ["dep:os_pipe"]
socket2 = ["dep:socket2"]
tokio = ["dep:tokio"]
use_async_std = ["async-std"]
use_mio_net = ["mio", "dep:mio", "mio/net"]
use_mio_os_ext = ["mio", "dep:mio", "mio/os-ext"]
use_os_pipe = ["os_pipe"]
use_socket2 = ["socket2"]
use_tokio = ["tokio"]

[rust]
name = "io_extras"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
async-std = { loaf = "crates-io/async-std", version = "^1.13.0", features = ["io_safety"], optional = true }
io-lifetimes = { loaf = "crates-io/io-lifetimes", version = "^2.0.0" }
mio = { loaf = "crates-io/mio", version = "^1.0.2", optional = true }
os_pipe = { loaf = "crates-io/os_pipe", version = "^1.2.1", optional = true }
socket2 = { loaf = "crates-io/socket2", version = "^0.5.7", optional = true }
tokio = { loaf = "crates-io/tokio", version = "^1.6.0", features = ["fs", "io-std", "net", "process"], optional = true }
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.52, <=0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Console"], target = "cfg(windows)" }
