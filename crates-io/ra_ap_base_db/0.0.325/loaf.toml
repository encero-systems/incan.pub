# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra_ap_base_db"
version = "0.0.325"

[project.features]
default = []
in-rust-tree = []

[rust]
name = "ra_ap_base_db"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
cfg = { loaf = "crates-io/ra_ap_cfg", version = "=0.0.325", features = ["syntax", "tt"] }
dashmap = { loaf = "crates-io/dashmap", version = "=6.1.0", features = ["inline", "raw-api"] }
indexmap = { loaf = "crates-io/indexmap", version = "^2.9.0", features = ["serde"] }
intern = { loaf = "crates-io/ra_ap_intern", version = "=0.0.325" }
la-arena = { loaf = "crates-io/la-arena", version = "^0.3.1" }
query-group = { loaf = "crates-io/ra_ap_query-group-macro", version = "=0.0.325" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.1.1" }
salsa = { loaf = "crates-io/salsa", version = "^0.25.2", features = ["inventory", "macros", "rayon", "salsa_unstable"], default-features = false }
salsa-macros = { loaf = "crates-io/salsa-macros", version = "^0.25.2" }
semver = { loaf = "crates-io/semver", version = "^1.0.26" }
span = { loaf = "crates-io/ra_ap_span", version = "=0.0.325" }
syntax = { loaf = "crates-io/ra_ap_syntax", version = "=0.0.325" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.41", features = ["std"], default-features = false }
triomphe = { loaf = "crates-io/triomphe", version = "^0.1.14", features = ["std"], default-features = false }
vfs = { loaf = "crates-io/ra_ap_vfs", version = "=0.0.325" }
