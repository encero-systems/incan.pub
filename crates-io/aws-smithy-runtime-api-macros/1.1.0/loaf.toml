# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-smithy-runtime-api-macros"
version = "1.1.0"

[rust]
name = "aws_smithy_runtime_api_macros"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.106" }
quote = { loaf = "crates-io/quote", version = "^1.0.44" }
syn = { loaf = "crates-io/syn", version = "^2.0.114", features = ["full"] }
