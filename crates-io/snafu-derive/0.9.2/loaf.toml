# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/snafu-derive"
version = "0.9.2"

[project.features]
unstable-provider-api = []

[rust]
name = "snafu_derive"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
heck = { loaf = "crates-io/heck", version = ">=0.4, <0.6", default-features = false }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.52", default-features = false }
quote = { loaf = "crates-io/quote", version = "^1.0.25", default-features = false }
syn = { loaf = "crates-io/syn", version = "^2.0", features = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro", "visit-mut"], default-features = false }
