# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/futures-lite"
version = "2.6.1"

[project.features]
alloc = []
default = ["race", "std"]
fastrand = ["dep:fastrand"]
futures-io = ["dep:futures-io"]
memchr = ["dep:memchr"]
parking = ["dep:parking"]
race = ["fastrand"]
std = ["alloc", "dep:fastrand", "fastrand/std", "futures-io", "parking"]

[rust]
name = "futures_lite"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
fastrand = { loaf = "crates-io/fastrand", version = "^2.0.0", default-features = false, optional = true }
futures-core = { loaf = "crates-io/futures-core", version = "^0.3.5", default-features = false }
futures-io = { loaf = "crates-io/futures-io", version = "^0.3.5", optional = true }
memchr = { loaf = "crates-io/memchr", version = "^2.3.3", optional = true }
parking = { loaf = "crates-io/parking", version = "^2.2.0", optional = true }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.0" }
