# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/phf_macros"
version = "0.14.0"

[project.features]
ptrhash = ["phf_generator/ptrhash"]
uncased = ["uncased_", "phf_shared/uncased"]
uncased_ = ["dep:uncased_"]
unicase = ["unicase_", "phf_shared/unicase"]
unicase_ = ["dep:unicase_"]

[rust]
name = "phf_macros"
type = "proc-macro"
edition = "2024"
build-script = false

[dependencies]
phf_generator = { loaf = "crates-io/phf_generator", version = "^0.14.0" }
phf_shared = { loaf = "crates-io/phf_shared", version = "^0.14.0", default-features = false }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.95" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^2", features = ["full"] }
uncased_ = { loaf = "crates-io/uncased", version = "^0.9.7", optional = true }
unicase_ = { loaf = "crates-io/unicase", version = "^2.4.0", optional = true }
