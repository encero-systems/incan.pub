# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/primeorder"
version = "0.14.0"

[project.features]
alloc = ["elliptic-curve/alloc", "serdect?/alloc"]
basepoint-table = []
critical-section = ["basepoint-table", "dep:once_cell", "once_cell/critical-section"]
dev = []
hash2curve = []
once_cell = ["dep:once_cell"]
serde = ["elliptic-curve/serde", "serdect"]
serdect = ["dep:serdect"]
std = ["alloc", "elliptic-curve/std", "once_cell?/std"]

[rust]
name = "primeorder"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
elliptic-curve = { loaf = "crates-io/elliptic-curve", version = "^0.14.1", features = ["arithmetic", "sec1"], default-features = false }
once_cell = { loaf = "crates-io/once_cell", version = "^1.21", default-features = false, optional = true }
primefield = { loaf = "crates-io/primefield", version = "^0.14" }
serdect = { loaf = "crates-io/serdect", version = "^0.4", default-features = false, optional = true }
wnaf = { loaf = "crates-io/wnaf", version = "^0.14", default-features = false }
