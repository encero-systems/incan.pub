# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/windows-core"
version = "0.100.0"

[project.features]
default = ["std", "proc-macros"]
proc-macros = ["dep:windows-implement", "dep:windows-interface"]
std = ["windows-result/std", "windows-strings/std"]

[rust]
name = "windows_core"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
windows-implement = { loaf = "crates-io/windows-implement", version = "^0.100.0", default-features = false, optional = true }
windows-interface = { loaf = "crates-io/windows-interface", version = "^0.100.0", default-features = false, optional = true }
windows-link = { loaf = "crates-io/windows-link", version = "^0.100.0", default-features = false }
windows-result = { loaf = "crates-io/windows-result", version = "^0.100.0", default-features = false }
windows-strings = { loaf = "crates-io/windows-strings", version = "^0.100.0", default-features = false }
