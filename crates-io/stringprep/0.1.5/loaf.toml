# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/stringprep"
version = "0.1.5"

[rust]
name = "stringprep"
type = "lib"
edition = "2015"
build-script = false

[dependencies]
unicode-bidi = { loaf = "crates-io/unicode-bidi", version = "^0.3" }
unicode-normalization = { loaf = "crates-io/unicode-normalization", version = "^0.1" }
unicode-properties = { loaf = "crates-io/unicode-properties", version = "^0.1.1" }
