# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cranelift-isle"
version = "0.123.17"

[project.features]
codespan-reporting = ["dep:codespan-reporting"]
default = []
fancy-errors = ["codespan-reporting"]
log = ["dep:log"]
logging = ["log"]

[rust]
name = "cranelift_isle"
type = "lib"
edition = "2024"
build-script = true

[dependencies]
codespan-reporting = { loaf = "crates-io/codespan-reporting", version = "^0.11.1", optional = true }
log = { loaf = "crates-io/log", version = "^0.4.27", default-features = false, optional = true }
