# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/hmac"
version = "0.13.0"

[project.features]
zeroize = ["digest/zeroize"]

[rust]
name = "hmac"
type = "lib"
