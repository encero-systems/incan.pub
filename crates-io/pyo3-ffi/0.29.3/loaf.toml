# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/pyo3-ffi"
version = "0.29.3"

[project.features]
abi3 = []
abi3-py310 = ["abi3-py311"]
abi3-py311 = ["abi3-py312"]
abi3-py312 = ["abi3-py313"]
abi3-py313 = ["abi3-py314"]
abi3-py314 = ["abi3-py315"]
abi3-py315 = ["abi3"]
abi3-py38 = ["abi3-py39"]
abi3-py39 = ["abi3-py310"]
abi3t = []
abi3t-py315 = ["abi3t"]
default = []
extension-module = []
generate-import-lib = []

[rust]
name = "pyo3_ffi"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
libc = { loaf = "crates-io/libc", version = "^0.2.62" }
