# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/windows-interface"
version = "0.100.0"

[rust]
name = "windows_interface"
type = "proc-macro"
edition = "2024"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0", default-features = false }
quote = { loaf = "crates-io/quote", version = "^1.0", default-features = false }
syn = { loaf = "crates-io/syn", version = "^2.0", features = ["clone-impls", "full", "parsing", "printing", "proc-macro"], default-features = false }
