# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/selectors"
version = "0.41.0"

[project.features]
bench = []
to_shmem = ["dep:to_shmem", "dep:to_shmem_derive"]

[rust]
name = "selectors"
type = "lib"
edition = "2024"
build-script = false

[rust.source]
root = "lib.rs"

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2" }
cssparser = { loaf = "crates-io/cssparser", version = "^0.38" }
derive_more = { loaf = "crates-io/derive_more", version = "^2", features = ["add", "add_assign"] }
log = { loaf = "crates-io/log", version = "^0.4" }
new_debug_unreachable = { loaf = "crates-io/new_debug_unreachable", version = "^1" }
precomputed-hash = { loaf = "crates-io/precomputed-hash", version = "^0.1" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.1.1" }
servo_arc = { loaf = "crates-io/servo_arc", version = "^0.5.0" }
smallvec = { loaf = "crates-io/smallvec", version = "^1.0" }
to_shmem = { loaf = "crates-io/to_shmem", version = "^0.6.0", features = ["servo"], optional = true }
to_shmem_derive = { loaf = "crates-io/to_shmem_derive", version = "^0.2.0", optional = true }
