# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-lc-sys"
version = "0.45.0"

[project.features]
all-bindings = []
asan = []
bindgen = []
default = ["all-bindings"]
disable-prebuilt-nasm = []
fips = []
prebuilt-nasm = []
ssl = ["bindgen", "all-bindings"]

[rust]
name = "aws_lc_sys"
type = "lib"
edition = "2021"
build-script = true
