# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/signal-hook-registry"
version = "1.4.8"

[rust]
name = "signal_hook_registry"
type = "lib"
edition = "2015"

[dependencies]
errno = { loaf = "crates-io/errno", version = ">=0.2, <0.4" }
libc = { loaf = "crates-io/libc", version = "^0.2" }
