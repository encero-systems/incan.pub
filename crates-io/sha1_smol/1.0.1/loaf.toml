# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/sha1_smol"
version = "1.0.1"

[project.features]
alloc = []
serde = ["dep:serde"]
std = ["alloc"]

[rust]
name = "sha1_smol"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
