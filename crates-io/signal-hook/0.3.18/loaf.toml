# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/signal-hook"
version = "0.3.18"

[project.features]
cc = []
channel = []
default = ["channel", "iterator"]
extended-siginfo = ["channel", "iterator", "extended-siginfo-raw"]
extended-siginfo-raw = ["cc"]
iterator = ["channel"]

[rust]
name = "signal_hook"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
libc = { loaf = "crates-io/libc", version = "^0.2" }
signal-hook-registry = { loaf = "crates-io/signal-hook-registry", version = "^1.4" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["channel", "default", "iterator"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["channel", "default", "iterator"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["channel", "default", "iterator"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "release"
features = ["channel", "default", "iterator"]
cfg = []
