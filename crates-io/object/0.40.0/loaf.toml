# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/object"
version = "0.40.0"

[project.features]
all = ["read", "write", "build", "std", "compression", "names", "wasm"]
alloc = ["dep:alloc"]
archive = []
build = ["build_core", "write_std", "elf"]
build_core = ["read_core", "write_core"]
cargo-all = []
coff = []
compression = ["dep:flate2", "dep:ruzstd", "std"]
core = ["dep:core"]
default = ["read", "compression"]
doc = ["all"]
elf = []
goff = []
macho = []
names = []
pe = ["coff"]
read = ["read_core", "archive", "coff", "elf", "macho", "pe", "xcoff"]
read_core = []
rustc-dep-of-std = ["core", "alloc", "memchr/rustc-dep-of-std"]
std = ["memchr/std"]
unaligned = []
unstable = []
unstable-all = ["all", "unstable", "goff"]
wasm = ["dep:wasmparser"]
write = ["write_std", "coff", "elf", "macho", "pe", "xcoff"]
write_core = ["dep:crc32fast", "dep:indexmap", "dep:hashbrown"]
write_std = ["write_core", "std", "indexmap?/std", "crc32fast?/std"]
xcoff = []

[rust]
name = "object"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
alloc = { loaf = "crates-io/rustc-std-workspace-alloc", version = "^1.0.0", optional = true }
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0.0", optional = true }
crc32fast = { loaf = "crates-io/crc32fast", version = "^1.2", default-features = false, optional = true }
flate2 = { loaf = "crates-io/flate2", version = "^1", optional = true }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.17.0", features = ["default-hasher"], default-features = false, optional = true }
indexmap = { loaf = "crates-io/indexmap", version = "^2.14", default-features = false, optional = true }
memchr = { loaf = "crates-io/memchr", version = "^2.4.1", default-features = false }
ruzstd = { loaf = "crates-io/ruzstd", version = "^0.9.0", optional = true }
wasmparser = { loaf = "crates-io/wasmparser", version = "^0.255.0", default-features = false, optional = true }
