# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/spin"
version = "0.12.3"

[project.features]
barrier = ["mutex"]
core = ["dep:core"]
default = ["lock_api", "mutex", "spin_mutex", "rwlock", "once", "lazylock", "barrier"]
fair_mutex = ["mutex"]
lazy = ["lazylock"]
lazylock = ["once"]
lock_api = ["dep:lock_api_crate"]
mutex = []
once = []
portable-atomic = ["dep:portable-atomic"]
portable_atomic = ["portable-atomic"]
rustc-dep-of-std = ["core"]
rwlock = []
spin_mutex = ["mutex"]
std = []
ticket_mutex = ["mutex"]
use_ticket_mutex = ["mutex", "ticket_mutex"]

[rust]
name = "spin"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0.0", optional = true }
lock_api_crate = { loaf = "crates-io/lock_api", version = "^0.4", optional = true }
portable-atomic = { loaf = "crates-io/portable-atomic", version = "^1.3", features = ["require-cas"], default-features = false, optional = true }
