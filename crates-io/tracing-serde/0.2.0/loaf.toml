# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tracing-serde"
version = "0.2.0"

[project.features]
valuable = ["valuable_crate", "valuable-serde", "tracing-core/valuable"]
valuable-serde = ["dep:valuable-serde"]
valuable_crate = ["dep:valuable_crate"]

[rust]
name = "tracing_serde"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1" }
tracing-core = { loaf = "crates-io/tracing-core", version = "^0.1.28" }
valuable-serde = { loaf = "crates-io/valuable-serde", version = "^0.1.0", default-features = false, optional = true, target = "cfg(tracing_unstable)" }
valuable_crate = { loaf = "crates-io/valuable", version = "^0.1.0", default-features = false, optional = true, target = "cfg(tracing_unstable)" }
