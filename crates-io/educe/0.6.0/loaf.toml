# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/educe"
version = "0.6.0"

[project.features]
Clone = []
Copy = []
Debug = []
Default = []
Deref = []
DerefMut = []
Eq = []
Hash = []
Into = []
Ord = []
PartialEq = []
PartialOrd = []
default = ["Debug", "Clone", "Copy", "PartialEq", "Eq", "PartialOrd", "Ord", "Hash", "Default", "Deref", "DerefMut", "Into"]
full = ["syn/full"]

[rust]
name = "educe"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
enum-ordinalize = { loaf = "crates-io/enum-ordinalize", version = "^4.2", features = ["derive"], default-features = false }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^2" }
