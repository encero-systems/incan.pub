# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/const-random-macro"
version = "0.1.16"

[rust]
name = "const_random_macro"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
getrandom = { loaf = "crates-io/getrandom", version = "^0.2.0" }
once_cell = { loaf = "crates-io/once_cell", version = "^1.15", features = ["alloc", "race"], default-features = false }
tiny-keccak = { loaf = "crates-io/tiny-keccak", version = "^2.0.2", features = ["shake"] }
