# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/const_format"
version = "0.2.36"

[project.features]
__debug = ["const_format_proc_macros/debug"]
__docsrs = []
__inline_const_pat_tests = ["__test", "fmt"]
__only_new_tests = ["__test"]
__test = []
all = ["fmt", "derive", "rust_1_64", "assert"]
assert = ["assertc"]
assertc = ["fmt", "assertcp"]
assertcp = ["rust_1_51"]
const_generics = ["rust_1_51"]
constant_time_as_str = ["fmt"]
default = []
derive = ["fmt", "const_format_proc_macros/derive"]
fmt = ["rust_1_83"]
more_str_macros = ["rust_1_64"]
nightly_const_generics = ["const_generics"]
rust_1_51 = []
rust_1_64 = ["rust_1_51"]
rust_1_83 = ["rust_1_64"]

[rust]
name = "const_format"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
const_format_proc_macros = { loaf = "crates-io/const_format_proc_macros", version = "=0.2.34" }
konst = { loaf = "crates-io/konst", version = "^0.2.20", features = ["rust_1_64"], default-features = false }
