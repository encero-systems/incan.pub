# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/bs58"
version = "0.5.1"

[project.features]
alloc = ["tinyvec?/alloc"]
cb58 = ["sha2"]
check = ["sha2"]
default = ["std"]
sha2 = ["dep:sha2"]
smallvec = ["dep:smallvec"]
std = ["alloc", "tinyvec?/std"]
tinyvec = ["dep:tinyvec"]

[rust]
name = "bs58"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
sha2 = { loaf = "crates-io/sha2", version = "^0.10", default-features = false, optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1", optional = true }
tinyvec = { loaf = "crates-io/tinyvec", version = "^1.6.0", features = ["grab_spare_slice"], default-features = false, optional = true }
