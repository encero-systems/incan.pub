# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/phf"
version = "0.11.3"

[project.features]
default = ["std"]
macros = ["phf_macros"]
phf_macros = ["dep:phf_macros"]
serde = ["dep:serde"]
std = ["phf_shared/std"]
uncased = ["phf_shared/uncased"]
unicase = ["phf_macros?/unicase", "phf_shared/unicase"]

[rust]
name = "phf"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
phf_macros = { loaf = "crates-io/phf_macros", version = "^0.11.3", optional = true }
phf_shared = { loaf = "crates-io/phf_shared", version = "^0.11.3", default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
