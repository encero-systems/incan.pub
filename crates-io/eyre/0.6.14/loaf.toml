# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/eyre"
version = "0.6.14"

[project.features]
auto-install = []
default = ["auto-install", "track-caller"]
track-caller = []

[rust]
name = "eyre"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
indenter = { loaf = "crates-io/indenter", version = "^0.3.0" }
once_cell = { loaf = "crates-io/once_cell", version = "^1.18.0" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["auto-install", "default", "track-caller"]
cfg = ["backtrace", "eyre_no_fmt_args_capture", "eyre_no_fmt_arguments_as_str", "track_caller"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["auto-install", "default", "track-caller"]
cfg = ["backtrace", "eyre_no_fmt_args_capture", "eyre_no_fmt_arguments_as_str", "track_caller"]
