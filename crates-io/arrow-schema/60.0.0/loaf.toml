# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/arrow-schema"
version = "60.0.0"

[project.features]
bitflags = ["dep:bitflags"]
canonical_extension_types = ["dep:serde_core", "dep:serde_json"]
ffi = ["bitflags"]
serde = ["dep:serde_core", "dep:serde"]

[rust]
name = "arrow_schema"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.0.0", default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive"], default-features = false, optional = true }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0", features = ["rc", "std"], default-features = false, optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0", optional = true }
