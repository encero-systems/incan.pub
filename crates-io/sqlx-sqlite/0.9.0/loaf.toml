# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/sqlx-sqlite"
version = "0.9.0"

[project.features]
_unstable-all-sqlite-features = ["deserialize", "load-extension", "preupdate-hook", "unlock-notify"]
_unstable-all-types = ["json", "chrono", "time", "uuid"]
_unstable-docs = ["bundled", "any", "_unstable-all-types", "_unstable-all-sqlite-features"]
any = ["sqlx-core/any"]
bigdecimal = []
bundled = ["libsqlite3-sys/bundled"]
chrono = ["dep:chrono", "sqlx-core/chrono"]
deserialize = []
json = ["sqlx-core/json", "serde"]
load-extension = []
migrate = ["sqlx-core/migrate"]
offline = ["sqlx-core/offline", "serde"]
preupdate-hook = ["libsqlite3-sys/preupdate_hook"]
regexp = ["dep:regex"]
rust_decimal = []
serde = ["dep:serde"]
sqlx-toml = ["sqlx-core/sqlx-toml"]
time = ["dep:time", "sqlx-core/time"]
unbundled = ["libsqlite3-sys/buildtime_bindgen"]
unlock-notify = ["libsqlite3-sys/unlock_notify"]
uuid = ["dep:uuid", "sqlx-core/uuid"]

[rust]
name = "sqlx_sqlite"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
atoi = { loaf = "crates-io/atoi", version = "^2.0" }
chrono = { loaf = "crates-io/chrono", version = "^0.4.34", features = ["clock", "std"], default-features = false, optional = true }
flume = { loaf = "crates-io/flume", version = "^0.12.0", features = ["async"], default-features = false }
form_urlencoded = { loaf = "crates-io/form_urlencoded", version = "^1.2.2" }
futures-channel = { loaf = "crates-io/futures-channel", version = "^0.3.32", features = ["alloc", "sink", "std"], default-features = false }
futures-core = { loaf = "crates-io/futures-core", version = "^0.3.32", default-features = false }
futures-executor = { loaf = "crates-io/futures-executor", version = "^0.3.32" }
futures-intrusive = { loaf = "crates-io/futures-intrusive", version = "^0.5.0" }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3.32", features = ["alloc", "sink"], default-features = false }
libsqlite3-sys = { loaf = "crates-io/libsqlite3-sys", version = ">=0.30.1, <0.38.0", features = ["pkg-config", "vcpkg"], default-features = false }
log = { loaf = "crates-io/log", version = "^0.4.18" }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.3.0" }
regex = { loaf = "crates-io/regex", version = "^1.6.0", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.219", features = ["derive"], optional = true }
sqlx-core = { loaf = "crates-io/sqlx-core", version = "=0.9.0" }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.18", features = ["std"], default-features = false }
time = { loaf = "crates-io/time", version = "^0.3.47", features = ["formatting", "macros", "parsing"], optional = true }
tracing = { loaf = "crates-io/tracing", version = "^0.1.37", features = ["log"] }
url = { loaf = "crates-io/url", version = "^2.2.2" }
uuid = { loaf = "crates-io/uuid", version = "^1.12.1", optional = true }
