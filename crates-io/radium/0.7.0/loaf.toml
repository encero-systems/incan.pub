# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/radium"
version = "0.7.0"

[rust]
name = "radium"
type = "lib"
edition = "2018"
build-script = true

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = []
cfg = ["radium_atomic_16", "radium_atomic_32", "radium_atomic_64", "radium_atomic_8", "radium_atomic_ptr"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = []
cfg = ["radium_atomic_16", "radium_atomic_32", "radium_atomic_64", "radium_atomic_8", "radium_atomic_ptr"]
