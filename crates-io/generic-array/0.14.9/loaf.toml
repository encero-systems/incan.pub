# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/generic-array"
version = "0.14.9"

[project.features]
more_lengths = []
serde = ["dep:serde"]
zeroize = ["dep:zeroize"]

[rust]
name = "generic_array"
type = "lib"
edition = "2015"
build-script = true

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0", default-features = false, optional = true }
typenum = { loaf = "crates-io/typenum", version = "^1.12" }
zeroize = { loaf = "crates-io/zeroize", version = "^1", default-features = false, optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = []
cfg = ["ga_is_deprecated", "relaxed_coherence"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = []
cfg = ["ga_is_deprecated", "relaxed_coherence"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = []
cfg = ["ga_is_deprecated", "relaxed_coherence"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "release"
features = []
cfg = ["ga_is_deprecated", "relaxed_coherence"]
