# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/generic-array"
version = "0.14.9"

[project.features]
more_lengths = []
serde = ["dep:serde"]
zeroize = ["dep:zeroize"]

[rust]
name = "generic_array"
type = "lib"
edition = "2015"
build-script = true

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0", default-features = false, optional = true }
typenum = { loaf = "crates-io/typenum", version = "^1.12" }
zeroize = { loaf = "crates-io/zeroize", version = "^1", default-features = false, optional = true }
