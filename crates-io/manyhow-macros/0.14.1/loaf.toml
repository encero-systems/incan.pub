# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/manyhow-macros"
version = "0.14.1"

[rust]
name = "manyhow_macros"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro-utils = { loaf = "crates-io/proc-macro-utils", version = "^0.10.0" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1" }
quote = { loaf = "crates-io/quote", version = "^1" }
