# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/opentelemetry-http"
version = "0.33.0"

[project.features]
default = ["internal-logs"]
hyper = ["dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:tokio"]
internal-logs = ["opentelemetry/internal-logs"]
reqwest = ["dep:reqwest"]
reqwest-blocking = ["dep:reqwest", "reqwest/blocking"]
reqwest-rustls = ["dep:reqwest", "reqwest/rustls"]

[rust]
name = "opentelemetry_http"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
async-trait = { loaf = "crates-io/async-trait", version = "^0.1" }
bytes = { loaf = "crates-io/bytes", version = "^1" }
http = { loaf = "crates-io/http", version = "^1.1", features = ["std"], default-features = false }
http-body-util = { loaf = "crates-io/http-body-util", version = "^0.1", optional = true }
hyper = { loaf = "crates-io/hyper", version = "^1.3", default-features = false, optional = true }
hyper-util = { loaf = "crates-io/hyper-util", version = "^0.1", features = ["client-legacy", "http1", "http2"], optional = true }
opentelemetry = { loaf = "crates-io/opentelemetry", version = "^0.33", features = ["trace"], default-features = false }
reqwest = { loaf = "crates-io/reqwest", version = "^0.13.1", default-features = false, optional = true }
tokio = { loaf = "crates-io/tokio", version = "^1", features = ["time"], default-features = false, optional = true }
