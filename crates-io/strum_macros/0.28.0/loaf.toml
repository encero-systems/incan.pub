# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/strum_macros"
version = "0.28.0"

[rust]
name = "strum_macros"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
heck = { loaf = "crates-io/heck", version = "^0.5.0" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^2.0", features = ["parsing"] }
