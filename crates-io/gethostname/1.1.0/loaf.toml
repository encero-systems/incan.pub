# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/gethostname"
version = "1.1.0"

[rust]
name = "gethostname"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
rustix = { loaf = "crates-io/rustix", version = "^1.0.3", features = ["system"], default-features = false, target = "cfg(not(windows))" }
windows-link = { loaf = "crates-io/windows-link", version = "^0.2.1", target = "cfg(windows)" }
