# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/annotate-snippets"
version = "0.12.16"

[project.features]
default = ["std"]
simd = ["dep:memchr"]
std = ["anstyle/std", "memchr?/std"]
testing-colors = []

[rust]
name = "annotate_snippets"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
anstyle = { loaf = "crates-io/anstyle", version = "^1.0.13", default-features = false }
memchr = { loaf = "crates-io/memchr", version = "^2.8.0", default-features = false, optional = true }
unicode-width = { loaf = "crates-io/unicode-width", version = "^0.2.2" }
