# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rustls-pki-types"
version = "1.15.1"

[project.features]
alloc = ["dep:zeroize"]
default = ["alloc"]
std = ["alloc"]
web = ["web-time"]
web-time = ["dep:web-time"]

[rust]
name = "rustls_pki_types"
type = "lib"
edition = "2021"

[dependencies]
web-time = { loaf = "crates-io/web-time", version = "^1", optional = true, target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }
zeroize = { loaf = "crates-io/zeroize", version = "^1", optional = true }
