# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/memoffset"
version = "0.9.1"

[project.features]
default = []
unstable_const = []
unstable_offset_of = []

[rust]
name = "memoffset"
type = "lib"
edition = "2015"
build-script = true

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default"]
cfg = ["allow_clippy", "doctests", "maybe_uninit", "raw_ref_macros", "stable_const", "stable_offset_of", "tuple_ty"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default"]
cfg = ["allow_clippy", "doctests", "maybe_uninit", "raw_ref_macros", "stable_const", "stable_offset_of", "tuple_ty"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["default"]
cfg = ["allow_clippy", "doctests", "maybe_uninit", "raw_ref_macros", "stable_const", "stable_offset_of", "tuple_ty"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "release"
features = ["default"]
cfg = ["allow_clippy", "doctests", "maybe_uninit", "raw_ref_macros", "stable_const", "stable_offset_of", "tuple_ty"]
