# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra_ap_proc_macro_api"
version = "0.0.325"

[project.features]
default = []
in-rust-tree = []
proc-macro-srv = ["dep:proc-macro-srv"]
sysroot-abi = ["proc-macro-srv", "dep:proc-macro-srv", "proc-macro-srv/sysroot-abi"]

[rust]
name = "ra_ap_proc_macro_api"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
indexmap = { loaf = "crates-io/indexmap", version = "^2.9.0", features = ["serde"] }
intern = { loaf = "crates-io/ra_ap_intern", version = "=0.0.325" }
paths = { loaf = "crates-io/ra_ap_paths", version = "=0.0.325", features = ["serde1"] }
postcard = { loaf = "crates-io/postcard", version = "^1.1.3", features = ["alloc"] }
proc-macro-srv = { loaf = "crates-io/ra_ap_proc_macro_srv", version = "=0.0.325", optional = true }
rayon = { loaf = "crates-io/rayon", version = "^1.10.0" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.1.1" }
semver = { loaf = "crates-io/semver", version = "^1.0.26" }
serde = { loaf = "crates-io/serde", version = "^1.0.219" }
serde_derive = { loaf = "crates-io/serde_derive", version = "^1.0.219" }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.140", features = ["unbounded_depth"] }
span = { loaf = "crates-io/ra_ap_span", version = "=0.0.325", default-features = false }
stdx = { loaf = "crates-io/ra_ap_stdx", version = "=0.0.325" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.41", features = ["std"], default-features = false }
tt = { loaf = "crates-io/ra_ap_tt", version = "=0.0.325" }
