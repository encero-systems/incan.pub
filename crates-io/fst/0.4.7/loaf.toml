# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/fst"
version = "0.4.7"

[project.features]
default = []
levenshtein = ["utf8-ranges"]
utf8-ranges = ["dep:utf8-ranges"]

[rust]
name = "fst"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
utf8-ranges = { loaf = "crates-io/utf8-ranges", version = "^1.0.4", optional = true }
