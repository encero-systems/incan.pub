# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/fst"
version = "0.4.7"

[project.features]
default = []
levenshtein = ["utf8-ranges"]
utf8-ranges = ["dep:utf8-ranges"]

[rust]
name = "fst"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
utf8-ranges = { loaf = "crates-io/utf8-ranges", version = "^1.0.4", optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default"]
cfg = []
out = [{ name = "crc32_table.rs", path = "out/d26a1c1709a1/crc32_table.rs", digest = "sha256:d26a1c1709a1b3526f8e919ca189a0bb1e6dd14432aaaf8b1f6bbab0794ce157" }]
