# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/async-broadcast"
version = "0.7.2"

[rust]
name = "async_broadcast"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
event-listener = { loaf = "crates-io/event-listener", version = "^5.0.0" }
event-listener-strategy = { loaf = "crates-io/event-listener-strategy", version = "^0.5.0" }
futures-core = { loaf = "crates-io/futures-core", version = "^0.3.21" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.13" }
