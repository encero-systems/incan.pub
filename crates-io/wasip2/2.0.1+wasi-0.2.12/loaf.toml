# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasip2"
version = "2.0.1+wasi-0.2.12"

[project.features]
alloc = ["dep:alloc"]
bitflags = ["wit-bindgen/bitflags"]
core = ["dep:core"]
default = ["std", "bitflags"]
rustc-dep-of-std = ["core", "alloc", "wit-bindgen/rustc-dep-of-std"]
std = []

[rust]
name = "wasip2"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
alloc = { loaf = "crates-io/rustc-std-workspace-alloc", version = "^1.0", optional = true }
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0", optional = true }
wit-bindgen = { loaf = "crates-io/wit-bindgen", version = "^0.62.0", default-features = false }
