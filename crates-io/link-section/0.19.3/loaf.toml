# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/link-section"
version = "0.19.3"

[project.features]
default = ["proc_macro", "std"]
proc_macro = ["dep:linktime-proc-macro"]
std = []

[rust]
name = "link_section"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
linktime-proc-macro = { loaf = "crates-io/linktime-proc-macro", version = "^0.2.3", features = ["link_section"], optional = true }
