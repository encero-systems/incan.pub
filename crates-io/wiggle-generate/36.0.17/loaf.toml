# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wiggle-generate"
version = "36.0.17"

[rust]
name = "wiggle_generate"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.93", default-features = false }
heck = { loaf = "crates-io/heck", version = "^0.5" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^2.0.25", features = ["full"] }
witx = { loaf = "crates-io/witx", version = "^0.9.1" }
