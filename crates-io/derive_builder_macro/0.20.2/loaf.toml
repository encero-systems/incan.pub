# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/derive_builder_macro"
version = "0.20.2"

[project.features]
alloc = ["derive_builder_core/alloc"]
clippy = ["derive_builder_core/clippy"]
lib_has_std = ["derive_builder_core/lib_has_std"]

[rust]
name = "derive_builder_macro"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
derive_builder_core = { loaf = "crates-io/derive_builder_core", version = "=0.20.2" }
syn = { loaf = "crates-io/syn", version = "^2.0.15", features = ["extra-traits", "full"] }
