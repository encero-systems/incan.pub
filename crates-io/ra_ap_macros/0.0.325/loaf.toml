# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra_ap_macros"
version = "0.0.325"

[rust]
name = "ra_ap_macros"
type = "proc-macro"
edition = "2024"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^2.0.9" }
synstructure = { loaf = "crates-io/synstructure", version = "^0.13.0" }
