# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/http-body"
version = "0.4.6"

[rust]
name = "http_body"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
bytes = { loaf = "crates-io/bytes", version = "^1" }
http = { loaf = "crates-io/http", version = "^0.2" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2" }
