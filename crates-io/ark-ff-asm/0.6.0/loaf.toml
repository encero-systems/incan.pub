# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/ark-ff-asm"
version = "0.6.0"

[rust]
name = "ark_ff_asm"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^2.0", features = ["extra-traits", "full"] }
