# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/phf_generator"
version = "0.14.0"

[project.features]
ptrhash = ["phf_shared/ptrhash"]

[rust]
name = "phf_generator"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
fastrand = { loaf = "crates-io/fastrand", version = "^2.1.0", default-features = false }
phf_shared = { loaf = "crates-io/phf_shared", version = "^0.14.0", default-features = false }
