# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wit-bindgen-rust-macro"
version = "0.62.0"

[project.features]
default = ["macro-string"]
macro-string = ["dep:macro-string"]

[rust]
name = "wit_bindgen_rust_macro"
type = "proc-macro"
edition = "2024"
build-script = true

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.102" }
macro-string = { loaf = "crates-io/macro-string", version = "^0.3.0", optional = true }
prettyplease = { loaf = "crates-io/prettyplease", version = "^0.3.0" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^3.0.5", features = ["printing"] }
wit-bindgen-core = { loaf = "crates-io/wit-bindgen-core", version = "^0.62.0" }
wit-bindgen-rust = { loaf = "crates-io/wit-bindgen-rust", version = "^0.62.0" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default", "macro-string"]
cfg = []
environment = [{ name = "DEBUG_OUTPUT_DIR", out = "." }]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["macro-string"]
cfg = []
environment = [{ name = "DEBUG_OUTPUT_DIR", out = "." }]
