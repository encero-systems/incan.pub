# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wit-bindgen-rust-macro"
version = "0.51.0"

[project.features]
async = []

[rust]
name = "wit_bindgen_rust_macro"
type = "proc-macro"
edition = "2024"

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.72" }
prettyplease = { loaf = "crates-io/prettyplease", version = "^0.2.20" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^2.0.89", features = ["printing"] }
wit-bindgen-core = { loaf = "crates-io/wit-bindgen-core", version = "^0.51.0" }
wit-bindgen-rust = { loaf = "crates-io/wit-bindgen-rust", version = "^0.51.0" }
