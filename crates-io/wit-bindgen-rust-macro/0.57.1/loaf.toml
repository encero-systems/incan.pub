# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wit-bindgen-rust-macro"
version = "0.57.1"

[project.features]
default = ["macro-string"]
macro-string = ["dep:macro-string"]

[rust]
name = "wit_bindgen_rust_macro"
type = "proc-macro"
edition = "2024"

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.102" }
macro-string = { loaf = "crates-io/macro-string", version = "^0.2.0", optional = true }
prettyplease = { loaf = "crates-io/prettyplease", version = "^0.2.20" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^2.0.89", features = ["printing"] }
wit-bindgen-core = { loaf = "crates-io/wit-bindgen-core", version = "^0.57.1" }
wit-bindgen-rust = { loaf = "crates-io/wit-bindgen-rust", version = "^0.57.1" }
