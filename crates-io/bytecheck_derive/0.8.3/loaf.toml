# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/bytecheck_derive"
version = "0.8.3"

[rust]
name = "bytecheck_derive"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1", default-features = false }
quote = { loaf = "crates-io/quote", version = "^1", default-features = false }
syn = { loaf = "crates-io/syn", version = "^3.0", features = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro"], default-features = false }
