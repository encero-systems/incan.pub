# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/der-parser"
version = "10.0.0"

[project.features]
as_bitvec = ["bitvec"]
bigint = ["num-bigint"]
bitvec = ["dep:bitvec"]
cookie-factory = ["dep:cookie-factory"]
default = ["std"]
num-bigint = ["dep:num-bigint"]
serialize = ["std", "cookie-factory"]
std = []
unstable = []

[rust]
name = "der_parser"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
asn1-rs = { loaf = "crates-io/asn1-rs", version = "^0.7" }
bitvec = { loaf = "crates-io/bitvec", version = "^1.0", optional = true }
cookie-factory = { loaf = "crates-io/cookie-factory", version = "^0.3.0", optional = true }
displaydoc = { loaf = "crates-io/displaydoc", version = "^0.2", default-features = false }
nom = { loaf = "crates-io/nom", version = "^7.0" }
num-bigint = { loaf = "crates-io/num-bigint", version = "^0.4", optional = true }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2" }
rusticata-macros = { loaf = "crates-io/rusticata-macros", version = "^4.0" }
