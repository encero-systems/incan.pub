# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cranelift-frontend"
version = "0.123.17"

[project.features]
core = ["hashbrown", "cranelift-codegen/core"]
default = ["std"]
hashbrown = ["dep:hashbrown"]
std = ["cranelift-codegen/std"]

[rust]
name = "cranelift_frontend"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
cranelift-codegen = { loaf = "crates-io/cranelift-codegen", version = "^0.123.17", features = ["std", "unwind"], default-features = false }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.15", default-features = false, optional = true }
log = { loaf = "crates-io/log", version = "^0.4.27", default-features = false }
smallvec = { loaf = "crates-io/smallvec", version = "^1.6.1", features = ["union"] }
target-lexicon = { loaf = "crates-io/target-lexicon", version = "^0.13.0" }
