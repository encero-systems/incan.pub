# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/icu_provider_macros"
version = "1.5.0"

[rust]
name = "icu_provider_macros"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.61" }
quote = { loaf = "crates-io/quote", version = "^1.0.28" }
syn = { loaf = "crates-io/syn", version = "^2.0.21" }
