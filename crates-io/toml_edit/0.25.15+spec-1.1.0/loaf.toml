# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/toml_edit"
version = "0.25.15+spec-1.1.0"

[project.features]
debug = ["toml_parser?/debug", "dep:anstream", "dep:anstyle", "display"]
default = ["parse", "display"]
display = ["dep:toml_writer"]
parse = ["dep:toml_parser", "dep:winnow"]
serde = ["dep:serde_core", "toml_datetime/serde", "dep:serde_spanned"]
unbounded = []

[rust]
name = "toml_edit"
type = "lib"
edition = "2024"

[dependencies]
anstream = { loaf = "crates-io/anstream", version = "^1.0.0", optional = true }
anstyle = { loaf = "crates-io/anstyle", version = "^1.0.14", optional = true }
indexmap = { loaf = "crates-io/indexmap", version = "^2.13.0", features = ["std"] }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0.228", optional = true }
serde_spanned = { loaf = "crates-io/serde_spanned", version = "^1.1.1", features = ["serde"], optional = true }
toml_datetime = { loaf = "crates-io/toml_datetime", version = "^1.1.1" }
toml_parser = { loaf = "crates-io/toml_parser", version = "^1.1.3", optional = true }
toml_writer = { loaf = "crates-io/toml_writer", version = "^1.1.2", optional = true }
winnow = { loaf = "crates-io/winnow", version = "^1.0.0", optional = true }
