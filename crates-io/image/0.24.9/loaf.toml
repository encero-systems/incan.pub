# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/image"
version = "0.24.9"

[project.features]
avif = ["avif-encoder"]
avif-decoder = ["mp4parse", "dcv-color-primitives", "dav1d"]
avif-encoder = ["ravif", "rgb"]
benchmarks = []
bmp = []
dav1d = ["dep:dav1d"]
dcv-color-primitives = ["dep:dcv-color-primitives"]
dds = ["dxt"]
default = ["gif", "jpeg", "ico", "png", "pnm", "tga", "tiff", "webp", "bmp", "hdr", "dxt", "dds", "farbfeld", "jpeg_rayon", "openexr", "qoi"]
dxt = []
exr = ["dep:exr"]
farbfeld = []
gif = ["dep:gif"]
hdr = []
ico = ["bmp", "png"]
jpeg = ["dep:jpeg"]
jpeg_rayon = ["dep:jpeg", "jpeg/rayon"]
libwebp = ["dep:libwebp"]
mp4parse = ["dep:mp4parse"]
openexr = ["exr"]
png = ["dep:png"]
pnm = []
qoi = ["dep:qoi"]
ravif = ["dep:ravif"]
rayon = ["dep:rayon"]
rgb = ["dep:rgb"]
tga = []
tiff = ["dep:tiff"]
webp = []
webp-encoder = ["libwebp", "webp"]

[rust]
name = "image"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bytemuck = { loaf = "crates-io/bytemuck", version = "^1.8.0", features = ["extern_crate_alloc"] }
byteorder = { loaf = "crates-io/byteorder", version = "^1.3.2" }
color_quant = { loaf = "crates-io/color_quant", version = "^1.1" }
dav1d = { loaf = "crates-io/dav1d", version = "^0.10.2", optional = true }
dcv-color-primitives = { loaf = "crates-io/dcv-color-primitives", version = "^0.6.1", optional = true }
exr = { loaf = "crates-io/exr", version = "^1.5.0", optional = true }
gif = { loaf = "crates-io/gif", version = "^0.13", optional = true }
jpeg = { loaf = "crates-io/jpeg-decoder", version = "^0.3.0", default-features = false, optional = true }
libwebp = { loaf = "crates-io/webp", version = "^0.2.2", default-features = false, optional = true }
mp4parse = { loaf = "crates-io/mp4parse", version = "^0.17.0", optional = true }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.0" }
png = { loaf = "crates-io/png", version = "^0.17.6", optional = true }
qoi = { loaf = "crates-io/qoi", version = "^0.4", optional = true }
ravif = { loaf = "crates-io/ravif", version = "^0.11.0", optional = true }
rayon = { loaf = "crates-io/rayon", version = "^1.7.0", optional = true }
rgb = { loaf = "crates-io/rgb", version = "^0.8.25", optional = true }
tiff = { loaf = "crates-io/tiff", version = "^0.9.0", optional = true }
