# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra_ap_project_model"
version = "0.0.325"

[project.features]
default = []
in-rust-tree = []

[rust]
name = "ra_ap_project_model"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.98" }
base-db = { loaf = "crates-io/ra_ap_base_db", version = "=0.0.325" }
cargo_metadata = { loaf = "crates-io/cargo_metadata", version = "^0.23.0" }
cfg = { loaf = "crates-io/ra_ap_cfg", version = "=0.0.325", features = ["syntax", "tt"] }
intern = { loaf = "crates-io/ra_ap_intern", version = "=0.0.325" }
itertools = { loaf = "crates-io/itertools", version = "^0.14.0" }
la-arena = { loaf = "crates-io/la-arena", version = "^0.3.1" }
paths = { loaf = "crates-io/ra_ap_paths", version = "=0.0.325", features = ["serde1"] }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.1.1" }
semver = { loaf = "crates-io/semver", version = "^1.0.26" }
serde = { loaf = "crates-io/serde", version = "^1.0.219" }
serde_derive = { loaf = "crates-io/serde_derive", version = "^1.0.219" }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.140" }
span = { loaf = "crates-io/ra_ap_span", version = "=0.0.325" }
stdx = { loaf = "crates-io/ra_ap_stdx", version = "=0.0.325" }
temp-dir = { loaf = "crates-io/temp-dir", version = "^0.1.16" }
toml = { loaf = "crates-io/toml", version = "^0.9.8" }
toolchain = { loaf = "crates-io/ra_ap_toolchain", version = "=0.0.325" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.41", features = ["attributes", "std"], default-features = false }
triomphe = { loaf = "crates-io/triomphe", version = "^0.1.14", features = ["std"], default-features = false }
