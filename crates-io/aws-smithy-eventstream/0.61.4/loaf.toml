# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-smithy-eventstream"
version = "0.61.4"

[project.features]
__bench-jemalloc = []
__bench-mimalloc = []
derive-arbitrary = ["dep:arbitrary", "dep:derive_arbitrary", "arbitrary?/derive"]
test-util = []

[rust]
name = "aws_smithy_eventstream"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.3", optional = true }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.6.4", features = ["http-body-1-x"] }
bytes = { loaf = "crates-io/bytes", version = "^1.11.1" }
crc32fast = { loaf = "crates-io/crc32fast", version = "^1.3" }
derive_arbitrary = { loaf = "crates-io/derive_arbitrary", version = "^1.3", optional = true }
