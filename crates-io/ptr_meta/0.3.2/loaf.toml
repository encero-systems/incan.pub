# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ptr_meta"
version = "0.3.2"

[project.features]
default = ["derive", "std"]
derive = ["ptr_meta_derive"]
ptr_meta_derive = ["dep:ptr_meta_derive"]
std = []

[rust]
name = "ptr_meta"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
ptr_meta_derive = { loaf = "crates-io/ptr_meta_derive", version = "=0.3.2", default-features = false, optional = true }
