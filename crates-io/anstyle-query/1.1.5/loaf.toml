# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/anstyle-query"
version = "1.1.5"

[rust]
name = "anstyle_query"
type = "lib"
edition = "2021"

[dependencies]
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.60.2, <0.62", features = ["Win32_Foundation", "Win32_System_Console"], target = "cfg(windows)" }
