# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/jiff"
version = "0.2.37"

[project.features]
alloc = ["jcore/alloc", "serde_core?/alloc", "portable-atomic-util/alloc", "defmt?/alloc"]
arbitrary = ["dep:arbitrary", "jcore/arbitrary", "std"]
default = ["std", "tz-system", "tz-fat", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline"]
defmt = ["dep:defmt", "jcore/defmt"]
js = ["dep:wasm-bindgen", "dep:js-sys"]
logging = ["dep:log", "jcore/logging"]
perf-inline = []
serde = ["dep:serde_core"]
static = ["static-tz", "jiff-static?/tzdb"]
static-tz = ["dep:jiff-static"]
std = ["alloc", "jcore/std", "log?/std", "serde_core?/std"]
tz-fat = ["jcore/tz-fat", "jiff-static?/tz-fat"]
tz-system = ["std", "dep:windows-link"]
tzdb-bundle-always = ["dep:jiff-tzdb", "alloc"]
tzdb-bundle-platform = ["dep:jiff-tzdb-platform", "alloc"]
tzdb-concatenated = ["std"]
tzdb-zoneinfo = ["std"]

[rust]
name = "jiff"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.4.2", features = ["derive"], optional = true }
defmt = { loaf = "crates-io/defmt", version = "^1.0.0", optional = true }
jcore = { loaf = "crates-io/jiff-core", version = "^0.1.0", default-features = false }
jiff-static = [{ loaf = "crates-io/jiff-static", version = "=0.2.37", target = "cfg(any())" }, { loaf = "crates-io/jiff-static", version = "^0.2", optional = true }]
jiff-tzdb = { loaf = "crates-io/jiff-tzdb", version = "^0.1.8", optional = true }
jiff-tzdb-platform = { loaf = "crates-io/jiff-tzdb-platform", version = "^0.1.3", optional = true, target = "cfg(any(windows, target_family = \"wasm\"))" }
js-sys = { loaf = "crates-io/js-sys", version = "^0.3.50", optional = true, target = "cfg(all(any(target_arch = \"wasm32\", target_arch = \"wasm64\"), target_os = \"unknown\"))" }
log = { loaf = "crates-io/log", version = "^0.4.21", default-features = false, optional = true }
portable-atomic = { loaf = "crates-io/portable-atomic", version = "^1.10.0", default-features = false, target = "cfg(not(target_has_atomic = \"ptr\"))" }
portable-atomic-util = { loaf = "crates-io/portable-atomic-util", version = "^0.2.4", default-features = false, target = "cfg(not(target_has_atomic = \"ptr\"))" }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0.221", default-features = false, optional = true }
wasm-bindgen = { loaf = "crates-io/wasm-bindgen", version = "^0.2.70", optional = true, target = "cfg(all(any(target_arch = \"wasm32\", target_arch = \"wasm64\"), target_os = \"unknown\"))" }
windows-link = { loaf = "crates-io/windows-link", version = "^0.2.1", optional = true, target = "cfg(windows)" }
