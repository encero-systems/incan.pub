# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tower-http"
version = "0.6.11"

[project.features]
add-extension = []
async-compression = []
auth = ["base64", "validate-request"]
base64 = ["dep:base64"]
catch-panic = ["tracing", "dep:futures-util", "futures-util/std", "dep:http-body", "dep:http-body-util"]
compression-br = ["dep:async-compression", "async-compression?/brotli", "futures-core", "dep:http-body", "tokio-util", "dep:tokio"]
compression-deflate = ["dep:async-compression", "async-compression?/zlib", "futures-core", "dep:http-body", "tokio-util", "dep:tokio"]
compression-full = ["compression-br", "compression-deflate", "compression-gzip", "compression-zstd"]
compression-gzip = ["dep:async-compression", "async-compression?/gzip", "futures-core", "dep:http-body", "tokio-util", "dep:tokio"]
compression-zstd = ["dep:async-compression", "async-compression?/zstd", "futures-core", "dep:http-body", "tokio-util", "dep:tokio"]
cors = []
decompression-br = ["dep:async-compression", "async-compression?/brotli", "futures-core", "dep:http-body", "dep:http-body-util", "tokio-util", "dep:tokio"]
decompression-deflate = ["dep:async-compression", "async-compression?/zlib", "futures-core", "dep:http-body", "dep:http-body-util", "tokio-util", "dep:tokio"]
decompression-full = ["decompression-br", "decompression-deflate", "decompression-gzip", "decompression-zstd"]
decompression-gzip = ["dep:async-compression", "async-compression?/gzip", "futures-core", "dep:http-body", "dep:http-body-util", "tokio-util", "dep:tokio"]
decompression-zstd = ["dep:async-compression", "async-compression?/zstd", "futures-core", "dep:http-body", "dep:http-body-util", "tokio-util", "dep:tokio"]
default = []
follow-redirect = ["futures-util", "dep:http-body", "dep:url", "dep:tower", "tower/util"]
fs = ["dep:tokio", "tokio?/fs", "tokio?/io-util", "futures-core", "futures-util", "dep:http-body", "dep:http-body-util", "dep:tokio-util", "tokio-util/io", "dep:http-range-header", "mime_guess", "mime", "percent-encoding", "httpdate", "set-status", "dep:futures-util", "futures-util/alloc"]
full = ["add-extension", "auth", "catch-panic", "compression-full", "cors", "decompression-full", "follow-redirect", "fs", "limit", "map-request-body", "map-response-body", "metrics", "normalize-path", "on-early-drop", "propagate-header", "redirect", "request-id", "sensitive-headers", "set-header", "set-status", "timeout", "trace", "util", "validate-request"]
futures-core = ["dep:futures-core"]
futures-util = ["dep:futures-util"]
httpdate = ["dep:httpdate"]
limit = ["dep:http-body", "dep:http-body-util"]
map-request-body = []
map-response-body = []
metrics = ["dep:http-body", "dep:tokio", "tokio?/time"]
mime = ["dep:mime"]
mime_guess = ["dep:mime_guess"]
normalize-path = []
on-early-drop = ["dep:http-body"]
percent-encoding = ["dep:percent-encoding"]
propagate-header = []
redirect = []
request-id = ["uuid"]
sensitive-headers = []
set-header = []
set-status = []
timeout = ["dep:http-body", "dep:tokio", "tokio?/time"]
tokio = []
tokio-util = ["dep:tokio-util"]
tower = ["dep:tower"]
trace = ["dep:http-body", "tracing"]
tracing = ["dep:tracing"]
util = ["tower"]
uuid = ["dep:uuid"]
validate-request = ["mime"]

[rust]
name = "tower_http"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
async-compression = { loaf = "crates-io/async-compression", version = "^0.4", features = ["tokio"], optional = true }
base64 = { loaf = "crates-io/base64", version = "^0.22", optional = true }
bitflags = { loaf = "crates-io/bitflags", version = "^2.0.2" }
bytes = { loaf = "crates-io/bytes", version = "^1" }
futures-core = { loaf = "crates-io/futures-core", version = "^0.3", default-features = false, optional = true }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3.14", default-features = false, optional = true }
http = { loaf = "crates-io/http", version = "^1.0" }
http-body = { loaf = "crates-io/http-body", version = "^1.0.0", optional = true }
http-body-util = { loaf = "crates-io/http-body-util", version = "^0.1.0", optional = true }
http-range-header = { loaf = "crates-io/http-range-header", version = "^0.4.0", optional = true }
httpdate = { loaf = "crates-io/httpdate", version = "^1.0", optional = true }
mime = { loaf = "crates-io/mime", version = "^0.3.17", default-features = false, optional = true }
mime_guess = { loaf = "crates-io/mime_guess", version = "^2", default-features = false, optional = true }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.1.0", optional = true }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.7" }
tokio = { loaf = "crates-io/tokio", version = "^1.6", default-features = false, optional = true }
tokio-util = { loaf = "crates-io/tokio-util", version = "^0.7", features = ["io"], default-features = false, optional = true }
tower = { loaf = "crates-io/tower", version = "^0.5", optional = true }
tower-layer = { loaf = "crates-io/tower-layer", version = "^0.3.3" }
tower-service = { loaf = "crates-io/tower-service", version = "^0.3" }
tracing = { loaf = "crates-io/tracing", version = "^0.1", default-features = false, optional = true }
url = { loaf = "crates-io/url", version = "^2.5", optional = true }
uuid = { loaf = "crates-io/uuid", version = "^1.0", features = ["v4"], optional = true }
