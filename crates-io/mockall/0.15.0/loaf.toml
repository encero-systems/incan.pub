# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/mockall"
version = "0.15.0"

[project.features]
nightly = ["mockall_derive/nightly_derive", "downcast/nightly"]

[rust]
name = "mockall"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0" }
downcast = { loaf = "crates-io/downcast", version = "^0.11" }
fragile = { loaf = "crates-io/fragile", version = "^2.0" }
mockall_derive = { loaf = "crates-io/mockall_derive", version = "=0.15.0" }
predicates = { loaf = "crates-io/predicates", version = "^3.0.0", default-features = false }
predicates-tree = { loaf = "crates-io/predicates-tree", version = "^1.0" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = []
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = []
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = []
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "release"
features = []
cfg = []
