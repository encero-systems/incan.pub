# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/hickory-resolver"
version = "0.26.3"

[project.features]
__dnssec = []
__h3 = ["__quic"]
__https = ["__tls"]
__quic = ["dep:quinn", "__tls"]
__tls = ["dep:rustls", "dep:tokio-rustls", "tokio"]
default = ["system-config", "tokio"]
dnssec-aws-lc-rs = ["hickory-proto/dnssec-aws-lc-rs", "hickory-net/dnssec-aws-lc-rs", "__dnssec"]
dnssec-ring = ["hickory-proto/dnssec-ring", "hickory-net/dnssec-ring", "__dnssec"]
h3-aws-lc-rs = ["hickory-net/h3-aws-lc-rs", "__h3"]
h3-ring = ["hickory-net/h3-ring", "__h3"]
https-aws-lc-rs = ["hickory-net/https-aws-lc-rs", "__https"]
https-ring = ["hickory-net/https-ring", "__https"]
metrics = ["dep:metrics"]
quic-aws-lc-rs = ["hickory-net/quic-aws-lc-rs", "__quic", "dep:quinn", "quinn/rustls-aws-lc-rs"]
quic-ring = ["hickory-net/quic-ring", "__quic", "dep:quinn", "quinn/rustls-ring"]
recursor = ["dep:async-recursion", "dep:lru-cache"]
rustls-platform-verifier = ["hickory-net/rustls-platform-verifier"]
serde = ["dep:serde", "hickory-proto/serde"]
system-config = ["dep:ipconfig", "dep:resolv-conf", "dep:jni", "dep:ndk-context", "dep:system-configuration"]
tls-aws-lc-rs = ["hickory-net/tls-aws-lc-rs", "__tls"]
tls-ring = ["hickory-net/tls-ring", "__tls"]
tokio = ["dep:tokio", "tokio/rt", "hickory-net/tokio"]
toml = ["dep:toml"]
webpki-roots = ["dep:webpki-roots", "hickory-net/webpki-roots"]

[rust]
name = "hickory_resolver"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
async-recursion = { loaf = "crates-io/async-recursion", version = "^1.0.0", optional = true }
cfg-if = { loaf = "crates-io/cfg-if", version = "^1" }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3.5", features = ["std"], default-features = false }
hickory-net = { loaf = "crates-io/hickory-net", version = "^0.26.3", default-features = false }
hickory-proto = { loaf = "crates-io/hickory-proto", version = "^0.26.3", features = ["access-control", "std"], default-features = false }
ipconfig = { loaf = "crates-io/ipconfig", version = "^0.3.0", optional = true, target = "cfg(windows)" }
ipnet = { loaf = "crates-io/ipnet", version = "^2.11.0", features = ["serde"], default-features = false }
jni = { loaf = "crates-io/jni", version = "^0.22.1", optional = true, target = "cfg(target_os = \"android\")" }
lru-cache = { loaf = "crates-io/lru-cache", version = "^0.1.2", optional = true }
metrics = { loaf = "crates-io/metrics", version = "^0.24.1", optional = true }
moka = { loaf = "crates-io/moka", version = "^0.12", features = ["sync"] }
ndk-context = { loaf = "crates-io/ndk-context", version = "^0.1.1", optional = true, target = "cfg(target_os = \"android\")" }
once_cell = { loaf = "crates-io/once_cell", version = "^1.20.0", features = ["critical-section"], default-features = false }
parking_lot = { loaf = "crates-io/parking_lot", version = "^0.12" }
quinn = { loaf = "crates-io/quinn", version = "^0.11.2", features = ["log", "runtime-tokio"], default-features = false, optional = true }
rand = { loaf = "crates-io/rand", version = "^0.10.0", features = ["alloc"], default-features = false }
resolv-conf = { loaf = "crates-io/resolv-conf", version = "^0.7.6", features = ["system"], optional = true }
rustls = { loaf = "crates-io/rustls", version = "^0.23.23", features = ["logging", "std", "tls12"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive", "rc"], optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1.6" }
system-configuration = { loaf = "crates-io/system-configuration", version = "^0.7", optional = true, target = "cfg(target_vendor = \"apple\")" }
thiserror = { loaf = "crates-io/thiserror", version = "^2", default-features = false }
tokio = { loaf = "crates-io/tokio", version = "^1.36", optional = true }
tokio-rustls = { loaf = "crates-io/tokio-rustls", version = "^0.26", default-features = false, optional = true }
toml = { loaf = "crates-io/toml", version = "^1.0.1", optional = true }
tracing = { loaf = "crates-io/tracing", version = "^0.1.30", default-features = false }
webpki-roots = { loaf = "crates-io/webpki-roots", version = "^1", optional = true }
