# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-smithy-runtime"
version = "1.16.0"

[project.features]
client = ["aws-smithy-runtime-api/client", "aws-smithy-types/http-body-1-x"]
connector-hyper-0-14-x = ["dep:aws-smithy-http-client", "aws-smithy-http-client?/hyper-014", "aws-smithy-types/http-body-0-4-x"]
default-https-client = ["dep:aws-smithy-http-client", "aws-smithy-http-client?/rustls-aws-lc"]
http-02x = ["dep:http-02x", "dep:http-body-04x", "aws-smithy-types/http-body-0-4-x", "aws-smithy-runtime-api/http-02x"]
http-auth = ["aws-smithy-runtime-api/http-auth"]
legacy-test-util = ["test-util", "connector-hyper-0-14-x", "dep:aws-smithy-http-client", "aws-smithy-http-client/legacy-test-util", "http-02x"]
rt-tokio = ["tokio/rt"]
test-util = ["aws-smithy-runtime-api/test-util", "dep:tracing-subscriber", "dep:aws-smithy-http-client", "aws-smithy-http-client/test-util"]
tls-rustls = ["dep:aws-smithy-http-client", "aws-smithy-http-client?/legacy-rustls-ring", "connector-hyper-0-14-x", "aws-smithy-runtime-api/legacy-client"]
wire-mock = ["legacy-test-util", "dep:aws-smithy-http-client", "aws-smithy-http-client/wire-mock"]

[rust]
name = "aws_smithy_runtime"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
aws-smithy-async = { loaf = "crates-io/aws-smithy-async", version = "^1.3.0" }
aws-smithy-http = { loaf = "crates-io/aws-smithy-http", version = "^0.64.1" }
aws-smithy-http-client = { loaf = "crates-io/aws-smithy-http-client", version = "^1.5.0", optional = true }
aws-smithy-observability = { loaf = "crates-io/aws-smithy-observability", version = "^0.3.0" }
aws-smithy-runtime-api = { loaf = "crates-io/aws-smithy-runtime-api", version = "^1.19.0" }
aws-smithy-schema = { loaf = "crates-io/aws-smithy-schema", version = "^0.2.1" }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.8.1" }
bytes = { loaf = "crates-io/bytes", version = "^1.11.1" }
fastrand = { loaf = "crates-io/fastrand", version = "^2.3.0" }
http-02x = { loaf = "crates-io/http", version = "^0.2.12", optional = true }
http-1x = { loaf = "crates-io/http", version = "^1.3.1" }
http-body-04x = { loaf = "crates-io/http-body", version = "^0.4.6", optional = true }
http-body-1x = { loaf = "crates-io/http-body", version = "^1.0.1" }
http-body-util = { loaf = "crates-io/http-body-util", version = "^0.1.3" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.14" }
pin-utils = { loaf = "crates-io/pin-utils", version = "^0.1.0" }
tokio = { loaf = "crates-io/tokio", version = "^1.49.0" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.44" }
tracing-subscriber = { loaf = "crates-io/tracing-subscriber", version = "^0.3.22", features = ["env-filter", "fmt", "json"], optional = true }
