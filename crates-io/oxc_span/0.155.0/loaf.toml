# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/oxc_span"
version = "0.155.0"

[project.features]
default = []
schemars = ["dep:schemars", "oxc_str/schemars"]
serialize = ["compact_str/serde", "dep:serde", "oxc_estree/serialize", "oxc_str/serialize"]

[rust]
name = "oxc_span"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
compact_str = { loaf = "crates-io/compact_str", version = "^0.10.0" }
oxc_allocator = { loaf = "crates-io/oxc_allocator", version = "^0.155.0" }
oxc_ast_macros = { loaf = "crates-io/oxc_ast_macros", version = "^0.155.0" }
oxc_estree = { loaf = "crates-io/oxc_estree", version = "^0.155.0" }
oxc_str = { loaf = "crates-io/oxc_str", version = "^0.155.0" }
schemars = { loaf = "crates-io/oxc-schemars", version = "^0.9.1", optional = true }
serde = { loaf = "crates-io/serde", version = "^1", optional = true }
