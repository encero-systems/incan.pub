# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/salsa-macros"
version = "0.25.2"

[project.features]
default = []
persistence = []

[rust]
name = "salsa_macros"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^2.0.104", features = ["full", "visit-mut"] }
synstructure = { loaf = "crates-io/synstructure", version = "^0.13.2" }
