# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/argon2"
version = "0.6.0"

[project.features]
alloc = ["password-hash?/alloc"]
default = ["alloc", "getrandom", "password-hash"]
getrandom = ["dep:password-hash", "password-hash/getrandom"]
kdf = ["alloc", "dep:kdf"]
parallel = ["dep:rayon"]
password-hash = ["dep:password-hash"]
rand_core = ["dep:password-hash", "password-hash/rand_core"]
zeroize = ["dep:zeroize"]

[rust]
name = "argon2"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
base64ct = { loaf = "crates-io/base64ct", version = "^1.7" }
blake2 = { loaf = "crates-io/blake2", version = "^0.11", default-features = false }
cpufeatures = { loaf = "crates-io/cpufeatures", version = "^0.3", target = "cfg(any(target_arch = \"x86\", target_arch = \"x86_64\"))" }
kdf = { loaf = "crates-io/kdf", version = "^0.1", optional = true }
password-hash = { loaf = "crates-io/password-hash", version = "^0.6", features = ["phc"], optional = true }
rayon = { loaf = "crates-io/rayon", version = "^1.7", optional = true }
zeroize = { loaf = "crates-io/zeroize", version = "^1", default-features = false, optional = true }
