# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tonic"
version = "0.14.6"

[project.features]
_tls-any = ["dep:tokio", "tokio?/rt", "tokio?/macros", "tls-connect-info"]
channel = ["dep:hyper", "hyper?/client", "dep:hyper-util", "hyper-util?/client-legacy", "dep:tower", "tower?/balance", "tower?/buffer", "tower?/discover", "tower?/limit", "tower?/load-shed", "tower?/util", "dep:tokio", "tokio?/time", "dep:hyper-timeout"]
codegen = ["dep:async-trait"]
default = ["router", "transport", "codegen"]
deflate = ["dep:flate2"]
gzip = ["dep:flate2"]
router = ["dep:axum", "dep:tower", "tower?/util"]
server = ["dep:h2", "dep:hyper", "hyper?/server", "dep:hyper-util", "hyper-util?/service", "hyper-util?/server-auto", "dep:socket2", "dep:tokio", "tokio?/macros", "tokio?/net", "tokio?/time", "tokio-stream/net", "dep:tower", "tower?/util", "tower?/limit", "tower?/load-shed"]
tls-aws-lc = ["_tls-any", "dep:tokio-rustls", "tokio-rustls/aws-lc-rs"]
tls-connect-info = ["dep:tokio-rustls"]
tls-native-roots = ["_tls-any", "channel", "dep:rustls-native-certs"]
tls-ring = ["_tls-any", "dep:tokio-rustls", "tokio-rustls/ring"]
tls-webpki-roots = ["_tls-any", "channel", "dep:webpki-roots"]
transport = ["server", "channel"]
zstd = ["dep:zstd"]

[rust]
name = "tonic"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
async-trait = { loaf = "crates-io/async-trait", version = "^0.1.13", optional = true }
axum = { loaf = "crates-io/axum", version = "^0.8", default-features = false, optional = true }
base64 = { loaf = "crates-io/base64", version = "^0.22" }
bytes = { loaf = "crates-io/bytes", version = "^1.0" }
flate2 = { loaf = "crates-io/flate2", version = "^1.0", optional = true }
h2 = { loaf = "crates-io/h2", version = "^0.4", optional = true }
http = { loaf = "crates-io/http", version = "^1.1.0" }
http-body = { loaf = "crates-io/http-body", version = "^1" }
http-body-util = { loaf = "crates-io/http-body-util", version = "^0.1" }
hyper = { loaf = "crates-io/hyper", version = "^1", features = ["http1", "http2"], optional = true }
hyper-timeout = { loaf = "crates-io/hyper-timeout", version = "^0.5", optional = true }
hyper-util = { loaf = "crates-io/hyper-util", version = "^0.1.11", features = ["tokio"], optional = true }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.1" }
pin-project = { loaf = "crates-io/pin-project", version = "^1.0.11" }
rustls-native-certs = { loaf = "crates-io/rustls-native-certs", version = "^0.8", optional = true }
socket2 = { loaf = "crates-io/socket2", version = "^0.6", features = ["all"], optional = true }
sync_wrapper = { loaf = "crates-io/sync_wrapper", version = "^1.0.2" }
tokio = { loaf = "crates-io/tokio", version = "^1", default-features = false, optional = true }
tokio-rustls = { loaf = "crates-io/tokio-rustls", version = "^0.26.1", features = ["logging", "tls12"], default-features = false, optional = true }
tokio-stream = { loaf = "crates-io/tokio-stream", version = "^0.1.16", default-features = false }
tower = { loaf = "crates-io/tower", version = "^0.5", default-features = false, optional = true }
tower-layer = { loaf = "crates-io/tower-layer", version = "^0.3" }
tower-service = { loaf = "crates-io/tower-service", version = "^0.3" }
tracing = { loaf = "crates-io/tracing", version = "^0.1" }
webpki-roots = { loaf = "crates-io/webpki-roots", version = "^1", optional = true }
zstd = { loaf = "crates-io/zstd", version = "^0.13.0", optional = true }
