# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/crossbeam-queue"
version = "0.3.14"

[project.features]
alloc = []
default = ["std"]
nightly = ["crossbeam-utils/nightly"]
std = ["alloc", "crossbeam-utils/std"]

[rust]
name = "crossbeam_queue"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
crossbeam-utils = { loaf = "crates-io/crossbeam-utils", version = "^0.8.18", default-features = false }
