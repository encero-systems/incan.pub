# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/widestring"
version = "1.2.1"

[project.features]
alloc = []
debugger_visualizer = ["alloc"]
default = ["std"]
std = ["alloc"]

[rust]
name = "widestring"
type = "lib"
edition = "2021"
build-script = false
