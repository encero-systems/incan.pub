# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cranelift-control"
version = "0.123.17"

[project.features]
chaos = ["fuzz"]
default = ["fuzz"]
fuzz = ["dep:arbitrary"]

[rust]
name = "cranelift_control"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.4.0", optional = true }
