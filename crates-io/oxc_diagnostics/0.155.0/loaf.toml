# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/oxc_diagnostics"
version = "0.155.0"

[rust]
name = "oxc_diagnostics"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bytecount = { loaf = "crates-io/bytecount", version = "^0.6.9" }
cow-utils = { loaf = "crates-io/cow-utils", version = "^0.1.3" }
itoa = { loaf = "crates-io/itoa", version = "^1.0.18" }
memchr = { loaf = "crates-io/memchr", version = "^2.8.2" }
oxc_span = { loaf = "crates-io/oxc_span", version = "^0.155.0" }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.3.2" }
smallvec = { loaf = "crates-io/smallvec", version = "^1.15.2", features = ["serde", "union"] }
textwrap = { loaf = "crates-io/textwrap", version = "^0.16.2" }
unicode-segmentation = { loaf = "crates-io/unicode-segmentation", version = "^1.13.3" }
unicode-width = { loaf = "crates-io/unicode-width", version = "^0.2" }
