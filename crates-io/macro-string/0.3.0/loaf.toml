# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/macro-string"
version = "0.3.0"

[rust]
name = "macro_string"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1", default-features = false }
quote = { loaf = "crates-io/quote", version = "^1", default-features = false }
syn = { loaf = "crates-io/syn", version = "^3", features = ["clone-impls", "parsing", "printing"], default-features = false }
