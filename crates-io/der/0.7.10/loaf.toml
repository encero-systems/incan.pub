# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/der"
version = "0.7.10"

[project.features]
alloc = ["zeroize?/alloc"]
arbitrary = ["dep:arbitrary", "const-oid?/arbitrary", "std"]
bytes = ["dep:bytes", "alloc"]
derive = ["dep:der_derive"]
flagset = ["dep:flagset"]
oid = ["dep:const-oid"]
pem = ["dep:pem-rfc7468", "alloc", "zeroize"]
real = []
std = ["alloc"]
time = ["dep:time"]
zeroize = ["dep:zeroize"]

[rust]
name = "der"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.3", features = ["derive"], optional = true }
bytes = { loaf = "crates-io/bytes", version = "^1", default-features = false, optional = true }
const-oid = { loaf = "crates-io/const-oid", version = "^0.9.2", optional = true }
der_derive = { loaf = "crates-io/der_derive", version = "^0.7.2", optional = true }
flagset = { loaf = "crates-io/flagset", version = "^0.4.3", optional = true }
pem-rfc7468 = { loaf = "crates-io/pem-rfc7468", version = "^0.7", features = ["alloc"], optional = true }
time = { loaf = "crates-io/time", version = "^0.3.4", default-features = false, optional = true }
zeroize = { loaf = "crates-io/zeroize", version = "^1.5", default-features = false, optional = true }
