# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/oxc_ast_visit"
version = "0.155.0"

[project.features]
conformance = []
default = []
serialize = ["oxc_allocator/serialize", "oxc_ast/serialize", "oxc_span/serialize", "oxc_syntax/serialize"]

[rust]
name = "oxc_ast_visit"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
oxc_allocator = { loaf = "crates-io/oxc_allocator", version = "^0.155.0" }
oxc_ast = { loaf = "crates-io/oxc_ast", version = "^0.155.0" }
oxc_span = { loaf = "crates-io/oxc_span", version = "^0.155.0" }
oxc_syntax = { loaf = "crates-io/oxc_syntax", version = "^0.155.0" }
