# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasm-bindgen-backend"
version = "0.2.104"

[project.features]
extra-traits = ["syn/extra-traits"]

[rust]
name = "wasm_bindgen_backend"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bumpalo = { loaf = "crates-io/bumpalo", version = "^3.0.0" }
log = { loaf = "crates-io/log", version = "^0.4" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^2.0", features = ["full"] }
wasm-bindgen-shared = { loaf = "crates-io/wasm-bindgen-shared", version = "=0.2.104" }
