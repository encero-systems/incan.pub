# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/system-interface"
version = "0.27.3"

[project.features]
async-std = ["dep:async-std"]
cap-async-std = ["dep:cap-async-std"]
cap-std = ["dep:cap-std"]
cap_async_std_impls = ["async-std", "cap-async-std", "io-lifetimes/async-std"]
cap_async_std_impls_fs_utf8 = ["async-std", "dep:cap-async-std", "cap-async-std/fs_utf8"]
cap_std_impls = ["cap-std"]
cap_std_impls_fs_utf8 = ["dep:cap-std", "cap-std/fs_utf8"]
char-device = ["dep:char-device"]
default = []
os_pipe = ["dep:os_pipe"]
socketpair = ["dep:socketpair"]
ssh2 = ["dep:ssh2"]
use_os_pipe = ["os_pipe", "io-lifetimes/os_pipe"]

[rust]
name = "system_interface"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
async-std = { loaf = "crates-io/async-std", version = "^1.13.0", features = ["io_safety"], optional = true }
bitflags = { loaf = "crates-io/bitflags", version = "^2.2.3" }
cap-async-std = { loaf = "crates-io/cap-async-std", version = "^3.0.0", optional = true }
cap-fs-ext = { loaf = "crates-io/cap-fs-ext", version = "^3.0.0", target = "cfg(windows)" }
cap-std = [{ loaf = "crates-io/cap-std", version = "^3.0.0", target = "cfg(windows)" }, { loaf = "crates-io/cap-std", version = "^3.0.0", optional = true }]
char-device = { loaf = "crates-io/char-device", version = "^0.16.0", optional = true }
fd-lock = { loaf = "crates-io/fd-lock", version = "^4.0.0", target = "cfg(windows)" }
io-lifetimes = { loaf = "crates-io/io-lifetimes", version = "^2.0.0", default-features = false }
os_pipe = { loaf = "crates-io/os_pipe", version = "^1.0.0", features = ["io_safety"], optional = true }
rustix = { loaf = "crates-io/rustix", version = "^0.38.0", features = ["fs", "net"], target = "cfg(not(windows))" }
socketpair = { loaf = "crates-io/socketpair", version = "^0.19.0", optional = true }
ssh2 = { loaf = "crates-io/ssh2", version = "^0.9.1", optional = true }
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.52, <=0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Pipes"], target = "cfg(windows)" }
winx = { loaf = "crates-io/winx", version = "^0.36.0", target = "cfg(windows)" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["cap-std", "cap_std_impls", "default"]
cfg = []
