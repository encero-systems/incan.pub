# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/chacha20poly1305"
version = "0.11.0"

[project.features]
alloc = ["aead/alloc"]
arrayvec = ["aead/arrayvec"]
bytes = ["aead/bytes"]
default = ["alloc", "getrandom"]
getrandom = ["aead/getrandom"]
rand_core = ["aead/rand_core"]
reduced-round = []
zeroize = ["dep:zeroize", "chacha20/zeroize"]

[rust]
name = "chacha20poly1305"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
aead = { loaf = "crates-io/aead", version = "^0.6", default-features = false }
chacha20 = { loaf = "crates-io/chacha20", version = "^0.10", features = ["xchacha"], default-features = false }
cipher = { loaf = "crates-io/cipher", version = "^0.5" }
poly1305 = { loaf = "crates-io/poly1305", version = "^0.9" }
zeroize = { loaf = "crates-io/zeroize", version = "^1.8", default-features = false, optional = true }
