# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra_ap_query-group-macro"
version = "0.0.325"

[rust]
name = "ra_ap_query_group_macro"
type = "proc-macro"
edition = "2024"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^2.0", features = ["extra-traits", "full", "visit-mut"] }
