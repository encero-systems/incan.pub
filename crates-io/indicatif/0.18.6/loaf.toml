# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/indicatif"
version = "0.18.6"

[project.features]
default = ["unicode-width", "wasmbind"]
futures = ["dep:futures-core"]
improved_unicode = ["unicode-segmentation", "unicode-width"]
in_memory = ["vt100"]
rayon = ["dep:rayon"]
tokio = ["dep:tokio"]
unicode-segmentation = ["dep:unicode-segmentation"]
unicode-width = ["dep:unicode-width", "console/unicode-width"]
vt100 = ["dep:vt100"]
wasmbind = ["dep:web-time"]

[rust]
name = "indicatif"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
console = { loaf = "crates-io/console", version = "^0.16.4", features = ["ansi-parsing", "std"], default-features = false }
futures-core = { loaf = "crates-io/futures-core", version = "^0.3", default-features = false, optional = true }
portable-atomic = { loaf = "crates-io/portable-atomic", version = "^1.12.0" }
rayon = { loaf = "crates-io/rayon", version = "^1.1", optional = true }
tokio = { loaf = "crates-io/tokio", version = "^1", features = ["io-util"], optional = true }
unicode-segmentation = { loaf = "crates-io/unicode-segmentation", version = "^1", optional = true }
unicode-width = { loaf = "crates-io/unicode-width", version = "^0.2", optional = true }
unit-prefix = { loaf = "crates-io/unit-prefix", version = "^0.5.1" }
vt100 = { loaf = "crates-io/vt100", version = "^0.16.1", optional = true }
web-time = { loaf = "crates-io/web-time", version = "^1.1.0", optional = true, target = "cfg(target_arch = \"wasm32\")" }
