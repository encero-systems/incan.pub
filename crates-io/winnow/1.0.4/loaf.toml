# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/winnow"
version = "1.0.4"

[project.features]
alloc = []
ascii = ["parser"]
binary = ["parser"]
debug = ["std", "dep:anstream", "dep:anstyle", "dep:is_terminal_polyfill", "dep:terminal_size"]
default = ["std", "ascii", "binary"]
parser = []
simd = ["dep:memchr"]
std = ["alloc", "memchr?/std"]
unstable-doc = ["alloc", "std", "ascii", "binary", "simd", "unstable-recover"]
unstable-recover = ["parser"]

[rust]
name = "winnow"
type = "lib"
edition = "2021"

[dependencies]
anstream = { loaf = "crates-io/anstream", version = "^0.6.15", optional = true }
anstyle = { loaf = "crates-io/anstyle", version = "^1.0.8", optional = true }
is_terminal_polyfill = { loaf = "crates-io/is_terminal_polyfill", version = "^1.48.1", optional = true }
memchr = { loaf = "crates-io/memchr", version = "^2.7", default-features = false, optional = true }
terminal_size = { loaf = "crates-io/terminal_size", version = "^0.4.3", optional = true }
