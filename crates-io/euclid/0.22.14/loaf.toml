# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/euclid"
version = "0.22.14"

[project.features]
arbitrary = ["dep:arbitrary"]
bytemuck = ["dep:bytemuck"]
default = ["std"]
libm = ["num-traits/libm"]
malloc_size_of = ["dep:malloc_size_of"]
mint = ["dep:mint"]
serde = ["dep:serde"]
std = ["num-traits/std"]
unstable = []

[rust]
name = "euclid"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1", optional = true }
bytemuck = { loaf = "crates-io/bytemuck", version = "^1.9", optional = true }
malloc_size_of = { loaf = "crates-io/malloc_size_of", version = "^0.1", default-features = false, optional = true }
mint = { loaf = "crates-io/mint", version = "^0.5.1", optional = true }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.15", default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["serde_derive"], default-features = false, optional = true }
