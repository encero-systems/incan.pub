# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/serial_test_derive"
version = "4.0.1"

[project.features]
async = []
default = []
file_locks = []
test_logging = []

[rust]
name = "serial_test_derive"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.60", features = ["proc-macro"], default-features = false }
quote = { loaf = "crates-io/quote", version = "^1", default-features = false }
syn = { loaf = "crates-io/syn", version = "^3", features = ["clone-impls", "full", "parsing", "printing"], default-features = false }
