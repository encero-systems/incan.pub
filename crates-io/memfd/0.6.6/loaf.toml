# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/memfd"
version = "0.6.6"

[rust]
name = "memfd"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
rustix = { loaf = "crates-io/rustix", version = "^1.0", features = ["fs"] }
