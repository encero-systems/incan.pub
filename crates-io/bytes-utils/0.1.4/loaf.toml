# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/bytes-utils"
version = "0.1.4"

[project.features]
default = ["std"]
serde = ["dep:serde", "bytes/serde"]
std = ["bytes/default"]

[rust]
name = "bytes_utils"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bytes = { loaf = "crates-io/bytes", version = "^1", default-features = false }
either = { loaf = "crates-io/either", version = "^1", default-features = false }
serde = { loaf = "crates-io/serde", version = "^1", default-features = false, optional = true }
