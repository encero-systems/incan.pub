# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tower-lsp"
version = "0.20.0"

[project.features]
async-codec-lite = ["dep:async-codec-lite"]
default = ["runtime-tokio"]
proposed = ["lsp-types/proposed"]
runtime-agnostic = ["async-codec-lite"]
runtime-tokio = ["tokio", "tokio-util"]
tokio = ["dep:tokio"]
tokio-util = ["dep:tokio-util"]

[rust]
name = "tower_lsp"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
async-codec-lite = { loaf = "crates-io/async-codec-lite", version = "^0.0", optional = true }
async-trait = { loaf = "crates-io/async-trait", version = "^0.1" }
auto_impl = { loaf = "crates-io/auto_impl", version = "^1.0" }
bytes = { loaf = "crates-io/bytes", version = "^1.0" }
dashmap = { loaf = "crates-io/dashmap", version = "^5.1" }
futures = { loaf = "crates-io/futures", version = "^0.3", features = ["async-await", "std"], default-features = false }
httparse = { loaf = "crates-io/httparse", version = "^1.8" }
lsp-types = { loaf = "crates-io/lsp-types", version = "^0.94.1" }
memchr = { loaf = "crates-io/memchr", version = "^2.5" }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive"] }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0" }
tokio = { loaf = "crates-io/tokio", version = "^1.17", optional = true }
tokio-util = { loaf = "crates-io/tokio-util", version = "^0.7", features = ["codec"], optional = true }
tower = { loaf = "crates-io/tower", version = "^0.4", features = ["util"], default-features = false }
tower-lsp-macros = { loaf = "crates-io/tower-lsp-macros", version = "^0.9" }
tracing = { loaf = "crates-io/tracing", version = "^0.1" }
