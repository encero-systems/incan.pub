# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/signature"
version = "2.2.0"

[project.features]
alloc = []
derive = ["dep:derive"]
digest = ["dep:digest"]
rand_core = ["dep:rand_core"]
std = ["alloc", "rand_core?/std"]

[rust]
name = "signature"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
derive = { loaf = "crates-io/signature_derive", version = "^2", optional = true }
digest = { loaf = "crates-io/digest", version = "^0.10.6", default-features = false, optional = true }
rand_core = { loaf = "crates-io/rand_core", version = "^0.6.4", default-features = false, optional = true }
