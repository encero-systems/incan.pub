# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/combine"
version = "4.6.8"

[project.features]
alloc = []
bytes = ["dep:bytes"]
bytes_05 = ["dep:bytes_05"]
default = ["std"]
futures-03 = ["pin-project", "std", "futures-core-03", "futures-io-03", "pin-project-lite"]
futures-core-03 = ["dep:futures-core-03"]
futures-io-03 = ["dep:futures-io-03"]
mp4 = []
pin-project = ["pin-project-lite"]
pin-project-lite = ["dep:pin-project-lite"]
regex = ["dep:regex"]
std = ["memchr/std", "bytes", "alloc"]
tokio = ["tokio-dep", "dep:tokio-util", "tokio-util/io", "futures-core-03", "pin-project-lite"]
tokio-02 = ["pin-project", "std", "tokio-02-dep", "futures-core-03", "pin-project-lite", "bytes_05"]
tokio-02-dep = ["dep:tokio-02-dep"]
tokio-03 = ["pin-project", "std", "tokio-03-dep", "futures-core-03", "pin-project-lite"]
tokio-03-dep = ["dep:tokio-03-dep"]
tokio-dep = ["dep:tokio-dep"]
tokio-util = ["dep:tokio-util"]

[rust]
name = "combine"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
bytes = { loaf = "crates-io/bytes", version = "^1", optional = true }
bytes_05 = { loaf = "crates-io/bytes", version = "^0.5", optional = true }
futures-core-03 = { loaf = "crates-io/futures-core", version = "^0.3.1", default-features = false, optional = true }
futures-io-03 = { loaf = "crates-io/futures-io", version = "^0.3.1", default-features = false, optional = true }
memchr = { loaf = "crates-io/memchr", version = "^2.3", default-features = false }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2", optional = true }
regex = { loaf = "crates-io/regex", version = "^1", optional = true }
tokio-02-dep = { loaf = "crates-io/tokio", version = "^0.2.3", features = ["io-util"], default-features = false, optional = true }
tokio-03-dep = { loaf = "crates-io/tokio", version = "^0.3", default-features = false, optional = true }
tokio-dep = { loaf = "crates-io/tokio", version = "^1", default-features = false, optional = true }
tokio-util = { loaf = "crates-io/tokio-util", version = "^0.7", features = ["codec"], default-features = false, optional = true }
