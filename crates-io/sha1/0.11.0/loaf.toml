# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/sha1"
version = "0.11.0"

[project.features]
alloc = ["digest/alloc"]
default = ["alloc", "oid"]
oid = ["digest/oid"]
zeroize = ["digest/zeroize"]

[rust]
name = "sha1"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0" }
cpufeatures = { loaf = "crates-io/cpufeatures", version = "^0.3", target = "cfg(any(target_arch = \"aarch64\", target_arch = \"x86\", target_arch = \"x86_64\"))" }
digest = { loaf = "crates-io/digest", version = "^0.11" }
