[rust]
name = "linked_hash_map"
type = "lib"
edition = "2015"
build-script = false

[dependencies]
heapsize = { loaf = "crates-io/heapsize", version = "^0.4", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
