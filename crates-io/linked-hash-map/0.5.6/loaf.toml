# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/linked-hash-map"
version = "0.5.6"

[project.features]
heapsize = ["dep:heapsize"]
heapsize_impl = ["heapsize"]
nightly = []
serde = ["dep:serde"]
