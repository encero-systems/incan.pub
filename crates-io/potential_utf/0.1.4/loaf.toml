# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/potential_utf"
version = "0.1.4"

[project.features]
alloc = ["serde_core?/alloc", "dep:writeable", "writeable/alloc", "zerovec?/alloc"]
databake = ["dep:databake"]
default = ["alloc"]
serde = ["dep:serde_core"]
writeable = ["dep:writeable"]
zerovec = ["dep:zerovec"]

[rust]
name = "potential_utf"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
databake = { loaf = "crates-io/databake", version = "^0.2.0", default-features = false, optional = true }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0.220", default-features = false, optional = true }
writeable = { loaf = "crates-io/writeable", version = "^0.6.0", default-features = false, optional = true }
zerovec = { loaf = "crates-io/zerovec", version = "^0.11.3", default-features = false, optional = true }
