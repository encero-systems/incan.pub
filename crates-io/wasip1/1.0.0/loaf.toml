# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasip1"
version = "1.0.0"

[project.features]
alloc = ["dep:alloc"]
core = ["dep:core"]
default = ["std"]
rustc-dep-of-std = ["core", "alloc"]
std = []

[rust]
name = "wasip1"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
alloc = { loaf = "crates-io/rustc-std-workspace-alloc", version = "^1.0", optional = true }
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0", optional = true }
