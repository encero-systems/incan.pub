# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-config"
version = "1.12.0"

[project.features]
allow-compilation = []
behavior-version-latest = []
client-hyper = ["aws-smithy-runtime/default-https-client"]
credentials-login = ["dep:aws-sdk-signin", "dep:sha2", "dep:zeroize", "dep:hex", "dep:base64-simd", "dep:uuid", "uuid?/v4", "dep:p256", "p256?/arithmetic", "p256?/pem", "dep:rand"]
credentials-process = ["tokio/process"]
default = ["default-https-client", "rt-tokio", "credentials-process", "sso"]
default-https-client = ["aws-smithy-runtime/default-https-client"]
legacy-client = ["aws-smithy-runtime/tls-rustls"]
rt-tokio = ["aws-smithy-async/rt-tokio", "aws-smithy-runtime/rt-tokio", "tokio/rt"]
rustls = ["client-hyper"]
sso = ["dep:aws-sdk-sso", "dep:aws-sdk-ssooidc", "dep:sha1", "dep:hex", "dep:zeroize", "aws-smithy-runtime-api/http-auth"]
test-util = ["aws-runtime/test-util"]

[rust]
name = "aws_config"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
aws-credential-types = { loaf = "crates-io/aws-credential-types", version = "^1.3.0", features = ["test-util"] }
aws-runtime = { loaf = "crates-io/aws-runtime", version = "^1.9.2" }
aws-sdk-signin = { loaf = "crates-io/aws-sdk-signin", version = "^1.22.0", default-features = false, optional = true }
aws-sdk-sso = { loaf = "crates-io/aws-sdk-sso", version = "^1.109.0", default-features = false, optional = true }
aws-sdk-ssooidc = { loaf = "crates-io/aws-sdk-ssooidc", version = "^1.111.0", default-features = false, optional = true }
aws-sdk-sts = { loaf = "crates-io/aws-sdk-sts", version = "^1.114.0", default-features = false }
aws-smithy-async = { loaf = "crates-io/aws-smithy-async", version = "^1.3.0" }
aws-smithy-http = { loaf = "crates-io/aws-smithy-http", version = "^0.64.0" }
aws-smithy-json = { loaf = "crates-io/aws-smithy-json", version = "^0.63.0" }
aws-smithy-runtime = { loaf = "crates-io/aws-smithy-runtime", version = "^1.14.0", features = ["client"] }
aws-smithy-runtime-api = { loaf = "crates-io/aws-smithy-runtime-api", version = "^1.16.0", features = ["client"] }
aws-smithy-schema = { loaf = "crates-io/aws-smithy-schema", version = "^0.2.0" }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.6.3" }
aws-types = { loaf = "crates-io/aws-types", version = "^1.6.0" }
base64-simd = { loaf = "crates-io/base64-simd", version = "^0.8.0", optional = true }
bytes = { loaf = "crates-io/bytes", version = "^1.11.1" }
fastrand = { loaf = "crates-io/fastrand", version = "^2.3.0" }
hex = { loaf = "crates-io/hex", version = "^0.4.3", optional = true }
http = { loaf = "crates-io/http", version = "^1" }
p256 = { loaf = "crates-io/p256", version = "^0.13.2", optional = true }
rand = { loaf = "crates-io/rand", version = "^0.8.5", features = ["std", "std_rng"], default-features = false, optional = true }
sha1 = { loaf = "crates-io/sha1", version = "^0.10", optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.10.9", optional = true }
time = { loaf = "crates-io/time", version = "^0.3.4", features = ["parsing"] }
tokio = { loaf = "crates-io/tokio", version = "^1.13.1", features = ["sync"] }
tracing = { loaf = "crates-io/tracing", version = "^0.1" }
url = { loaf = "crates-io/url", version = "^2.5.4" }
uuid = { loaf = "crates-io/uuid", version = "^1.18.1", optional = true }
zeroize = { loaf = "crates-io/zeroize", version = "^1", optional = true }
