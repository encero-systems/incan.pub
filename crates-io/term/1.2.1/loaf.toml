# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/term"
version = "1.2.1"

[project.features]
default = []

[rust]
name = "term"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.59, <0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage", "Win32_Storage_FileSystem", "Win32_System_Console"], target = "cfg(windows)" }
