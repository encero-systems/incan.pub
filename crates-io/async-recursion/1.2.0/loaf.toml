# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/async-recursion"
version = "1.2.0"

[rust]
name = "async_recursion"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0", default-features = false }
quote = { loaf = "crates-io/quote", version = "^1.0", default-features = false }
syn = { loaf = "crates-io/syn", version = "^3.0", features = ["clone-impls", "full", "parsing", "printing", "proc-macro", "visit-mut"], default-features = false }
