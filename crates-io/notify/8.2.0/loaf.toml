# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/notify"
version = "8.2.0"

[project.features]
crossbeam-channel = ["dep:crossbeam-channel"]
default = ["macos_fsevent"]
flume = ["dep:flume"]
fsevent-sys = ["dep:fsevent-sys"]
kqueue = ["dep:kqueue"]
macos_fsevent = ["fsevent-sys"]
macos_kqueue = ["kqueue", "mio"]
mio = ["dep:mio"]
serde = ["notify-types/serde"]
serialization-compat-6 = ["notify-types/serialization-compat-6"]

[rust]
name = "notify"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.7.0", target = "cfg(target_os = \"macos\")" }
crossbeam-channel = { loaf = "crates-io/crossbeam-channel", version = "^0.5.0", optional = true }
flume = { loaf = "crates-io/flume", version = "^0.11.1", optional = true }
fsevent-sys = { loaf = "crates-io/fsevent-sys", version = "^4.0.0", optional = true, target = "cfg(target_os = \"macos\")" }
inotify = { loaf = "crates-io/inotify", version = "^0.11.0", default-features = false, target = "cfg(any(target_os = \"linux\", target_os = \"android\"))" }
kqueue = [{ loaf = "crates-io/kqueue", version = "^1.1.1", target = "cfg(any(target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\", target_os = \"dragonflybsd\", target_os = \"ios\"))" }, { loaf = "crates-io/kqueue", version = "^1.1.1", optional = true, target = "cfg(target_os = \"macos\")" }]
libc = { loaf = "crates-io/libc", version = "^0.2.4" }
log = { loaf = "crates-io/log", version = "^0.4.17" }
mio = [{ loaf = "crates-io/mio", version = "^1.0", features = ["os-ext"], target = "cfg(any(target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\", target_os = \"dragonflybsd\", target_os = \"ios\"))" }, { loaf = "crates-io/mio", version = "^1.0", features = ["os-ext"], target = "cfg(any(target_os = \"linux\", target_os = \"android\"))" }, { loaf = "crates-io/mio", version = "^1.0", features = ["os-ext"], optional = true, target = "cfg(target_os = \"macos\")" }]
notify-types = { loaf = "crates-io/notify-types", version = "^2.0.0" }
walkdir = { loaf = "crates-io/walkdir", version = "^2.4.0" }
windows-sys = { loaf = "crates-io/windows-sys", version = "^0.60.1", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_WindowsProgramming"], target = "cfg(windows)" }
