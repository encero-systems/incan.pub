# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/logos-codegen"
version = "0.16.1"

[project.features]
debug = []
forbid_unsafe = []
state_machine_codegen = []

[rust]
name = "logos_codegen"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
fnv = { loaf = "crates-io/fnv", version = "^1.0.6" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.9" }
quote = { loaf = "crates-io/quote", version = "^1.0.3" }
regex-automata = { loaf = "crates-io/regex-automata", version = "^0.4.9" }
regex-syntax = { loaf = "crates-io/regex-syntax", version = "^0.8.5" }
syn = { loaf = "crates-io/syn", version = "^2.0.13", features = ["full"] }
