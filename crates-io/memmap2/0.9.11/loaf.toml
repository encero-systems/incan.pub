# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/memmap2"
version = "0.9.11"

[project.features]
stable_deref_trait = ["dep:stable_deref_trait"]

[rust]
name = "memmap2"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
libc = { loaf = "crates-io/libc", version = "^0.2.151", target = "cfg(unix)" }
stable_deref_trait = { loaf = "crates-io/stable_deref_trait", version = "^1.0", optional = true }
