# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ipnet"
version = "2.12.2"

[project.features]
default = ["std"]
heapless = ["dep:heapless", "serde"]
json = ["schemars08", "serde"]
schemars = ["schemars08"]
schemars08 = ["dep:schemars08"]
schemars1 = ["dep:schemars1"]
ser_as_str = ["dep:heapless"]
serde = ["dep:serde"]
std = []

[rust]
name = "ipnet"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
heapless = { loaf = "crates-io/heapless", version = "^0", optional = true }
schemars08 = { loaf = "crates-io/schemars", version = "^0.8", default-features = false, optional = true }
schemars1 = { loaf = "crates-io/schemars", version = "^1", default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1", features = ["derive"], default-features = false, optional = true }
