# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/objc2-core-video"
version = "0.3.2"

[project.features]
CVBase = ["bitflags"]
CVBuffer = ["objc2-core-foundation/CFDictionary"]
CVDisplayLink = []
CVHostTime = []
CVImageBuffer = ["objc2-core-foundation/CFCGTypes", "objc2-core-foundation/CFDictionary"]
CVMetalBuffer = []
CVMetalBufferCache = ["objc2-core-foundation/CFDictionary"]
CVMetalTexture = []
CVMetalTextureCache = ["objc2-core-foundation/CFDictionary"]
CVOpenGLBuffer = ["objc2-core-foundation/CFDictionary"]
CVOpenGLBufferPool = ["objc2-core-foundation/CFDictionary"]
CVOpenGLTexture = []
CVOpenGLTextureCache = ["objc2-core-foundation/CFDictionary"]
CVPixelBuffer = ["bitflags", "objc2-core-foundation/CFArray", "objc2-core-foundation/CFDictionary"]
CVPixelBufferIOSurface = ["objc2-core-foundation/CFDictionary"]
CVPixelBufferPool = ["bitflags", "objc2-core-foundation/CFDictionary"]
CVPixelFormatDescription = ["objc2-core-foundation/CFArray", "objc2-core-foundation/CFDictionary"]
CVReturn = []
alloc = []
bitflags = ["dep:bitflags"]
block2 = ["dep:block2"]
default = ["std", "CVBase", "CVBuffer", "CVDisplayLink", "CVHostTime", "CVImageBuffer", "CVMetalBuffer", "CVMetalBufferCache", "CVMetalTexture", "CVMetalTextureCache", "CVOpenGLBuffer", "CVOpenGLBufferPool", "CVOpenGLTexture", "CVOpenGLTextureCache", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVPixelBufferPool", "CVPixelFormatDescription", "CVReturn", "bitflags", "block2", "objc2", "objc2-core-graphics", "objc2-metal"]
objc2 = ["dep:objc2", "objc2-core-foundation/objc2", "objc2-core-graphics?/objc2", "objc2-io-surface?/objc2"]
objc2-core-graphics = ["dep:objc2-core-graphics"]
objc2-io-surface = ["dep:objc2-io-surface"]
objc2-metal = ["dep:objc2-metal"]
objc2-open-gl = ["dep:objc2-open-gl"]
std = ["alloc"]
unstable-darwin-objc = []

[rust]
name = "objc2_core_video"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.5.0", features = ["std"], default-features = false, optional = true }
block2 = { loaf = "crates-io/block2", version = ">=0.6.1, <0.8.0", features = ["alloc"], default-features = false, optional = true }
objc2 = { loaf = "crates-io/objc2", version = ">=0.6.2, <0.8.0", features = ["std"], default-features = false, optional = true }
objc2-core-foundation = { loaf = "crates-io/objc2-core-foundation", version = "^0.3.2", default-features = false }
objc2-core-graphics = { loaf = "crates-io/objc2-core-graphics", version = "^0.3.2", features = ["CGColorSpace", "CGDirectDisplay"], default-features = false, optional = true }
objc2-io-surface = { loaf = "crates-io/objc2-io-surface", version = "^0.3.2", features = ["IOSurfaceRef"], default-features = false, optional = true, target = "cfg(not(target_os = \"watchos\"))" }
objc2-metal = { loaf = "crates-io/objc2-metal", version = "^0.3.2", features = ["MTLAllocation", "MTLBuffer", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture"], default-features = false, optional = true, target = "cfg(not(target_os = \"watchos\"))" }
objc2-open-gl = { loaf = "crates-io/objc2-open-gl", version = "^0.3.2", features = ["CGLTypes"], default-features = false, optional = true, target = "cfg(target_os = \"macos\")" }
