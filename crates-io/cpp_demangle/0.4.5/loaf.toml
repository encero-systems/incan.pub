# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cpp_demangle"
version = "0.4.5"

[project.features]
afl = ["dep:afl"]
alloc = []
default = ["std"]
fuzz = ["afl"]
logging = ["std"]
run_libiberty_tests = []
std = ["alloc"]

[rust]
name = "cpp_demangle"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
afl = { loaf = "crates-io/afl", version = "^0.15", optional = true }
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.0" }
