# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/jni"
version = "0.22.4"

[project.features]
_cfg_test = []
default = []
invocation = ["dep:java-locator", "dep:libloading"]

[rust]
name = "jni"
type = "lib"
edition = "2024"
build-script = true

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.0" }
combine = { loaf = "crates-io/combine", version = "^4.1.0" }
java-locator = { loaf = "crates-io/java-locator", version = "^0.1.3", optional = true, target = "cfg(not(target_os = \"android\"))" }
jni-macros = { loaf = "crates-io/jni-macros", version = "=0.22.4" }
jni-sys = { loaf = "crates-io/jni-sys", version = "^0.4.1" }
libloading = { loaf = "crates-io/libloading", version = "^0.8", optional = true, target = "cfg(not(target_os = \"android\"))" }
log = { loaf = "crates-io/log", version = "^0.4.4" }
simd_cesu8 = { loaf = "crates-io/simd_cesu8", version = "^1.1.1" }
thiserror = { loaf = "crates-io/thiserror", version = "^2" }
windows-link = { loaf = "crates-io/windows-link", version = "^0.2", target = "cfg(windows)" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default"]
cfg = ["use_tls_attach_guard"]
