# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tower"
version = "0.4.13"

[project.features]
__common = ["futures-core", "pin-project-lite"]
balance = ["discover", "load", "ready-cache", "make", "rand", "slab"]
buffer = ["__common", "dep:tokio", "tokio/sync", "tokio/rt", "tokio-util", "tracing"]
default = ["log"]
discover = ["__common"]
filter = ["__common", "futures-util"]
full = ["balance", "buffer", "discover", "filter", "hedge", "limit", "load", "load-shed", "make", "ready-cache", "reconnect", "retry", "spawn-ready", "steer", "timeout", "util"]
futures-core = ["dep:futures-core"]
futures-util = ["dep:futures-util"]
hdrhistogram = ["dep:hdrhistogram"]
hedge = ["util", "filter", "futures-util", "hdrhistogram", "dep:tokio", "tokio/time", "tracing"]
indexmap = ["dep:indexmap"]
limit = ["__common", "dep:tokio", "tokio/time", "tokio/sync", "tokio-util", "tracing"]
load = ["__common", "dep:tokio", "tokio/time", "tracing"]
load-shed = ["__common"]
log = ["dep:tracing", "tracing/log"]
make = ["futures-util", "pin-project-lite", "dep:tokio", "tokio/io-std"]
pin-project = ["dep:pin-project"]
pin-project-lite = ["dep:pin-project-lite"]
rand = ["dep:rand"]
ready-cache = ["futures-core", "futures-util", "indexmap", "dep:tokio", "tokio/sync", "tracing", "pin-project-lite"]
reconnect = ["make", "dep:tokio", "tokio/io-std", "tracing"]
retry = ["__common", "dep:tokio", "tokio/time"]
slab = ["dep:slab"]
spawn-ready = ["__common", "futures-util", "dep:tokio", "tokio/sync", "tokio/rt", "util", "tracing"]
steer = []
timeout = ["pin-project-lite", "dep:tokio", "tokio/time"]
tokio = ["dep:tokio"]
tokio-stream = ["dep:tokio-stream"]
tokio-util = ["dep:tokio-util"]
tracing = ["dep:tracing"]
util = ["__common", "futures-util", "pin-project"]

[rust]
name = "tower"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
futures-core = { loaf = "crates-io/futures-core", version = "^0.3", optional = true }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3", features = ["alloc"], default-features = false, optional = true }
hdrhistogram = { loaf = "crates-io/hdrhistogram", version = "^7.0", default-features = false, optional = true }
indexmap = { loaf = "crates-io/indexmap", version = "^1.0.2", optional = true }
pin-project = { loaf = "crates-io/pin-project", version = "^1", optional = true }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.7", optional = true }
rand = { loaf = "crates-io/rand", version = "^0.8", features = ["small_rng"], optional = true }
slab = { loaf = "crates-io/slab", version = "^0.4", optional = true }
tokio = { loaf = "crates-io/tokio", version = "^1.6", features = ["sync"], optional = true }
tokio-stream = { loaf = "crates-io/tokio-stream", version = "^0.1.0", optional = true }
tokio-util = { loaf = "crates-io/tokio-util", version = "^0.7.0", default-features = false, optional = true }
tower-layer = { loaf = "crates-io/tower-layer", version = "^0.3.1" }
tower-service = { loaf = "crates-io/tower-service", version = "^0.3.1" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.2", features = ["std"], default-features = false, optional = true }
