# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rust-argon2"
version = "0.8.3"

[project.features]
crossbeam-utils = ["dep:crossbeam-utils"]
default = ["crossbeam-utils"]
serde = ["dep:serde"]

[rust]
name = "argon2"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
base64 = { loaf = "crates-io/base64", version = ">=0.13.0, <0.14.0" }
blake2b_simd = { loaf = "crates-io/blake2b_simd", version = ">=0.5.0, <0.6.0" }
constant_time_eq = { loaf = "crates-io/constant_time_eq", version = ">=0.1.4, <0.2.0" }
crossbeam-utils = { loaf = "crates-io/crossbeam-utils", version = ">=0.8.0, <0.9.0", optional = true }
serde = { loaf = "crates-io/serde", version = ">=1.0.116, <2.0.0", features = ["derive"], optional = true }
