# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-sigv4"
version = "1.6.0"

[project.features]
default = ["sign-http", "http1"]
http0-compat = ["dep:http0"]
http1 = ["dep:http"]
sign-eventstream = ["dep:aws-smithy-eventstream"]
sign-http = ["dep:percent-encoding", "dep:form_urlencoded"]
sigv4a = ["dep:p256", "dep:crypto-bigint", "dep:subtle", "dep:zeroize"]

[rust]
name = "aws_sigv4"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
aws-credential-types = { loaf = "crates-io/aws-credential-types", version = "^1.3.0" }
aws-smithy-eventstream = { loaf = "crates-io/aws-smithy-eventstream", version = "^0.61.4", optional = true }
aws-smithy-http = { loaf = "crates-io/aws-smithy-http", version = "^0.64.0" }
aws-smithy-runtime-api = { loaf = "crates-io/aws-smithy-runtime-api", version = "^1.17.0", features = ["client"] }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.8.0" }
bytes = { loaf = "crates-io/bytes", version = "^1.11.1" }
crypto-bigint = { loaf = "crates-io/crypto-bigint", version = "^0.5.4", optional = true }
form_urlencoded = { loaf = "crates-io/form_urlencoded", version = "^1.2.1", optional = true }
hex = { loaf = "crates-io/hex", version = "^0.4.3" }
hmac = { loaf = "crates-io/hmac", version = "^0.13" }
http = { loaf = "crates-io/http", version = "^1.3.1", optional = true }
http0 = { loaf = "crates-io/http", version = "^0.2.12", optional = true }
p256 = { loaf = "crates-io/p256", version = "^0.13.2", features = ["ecdsa"], optional = true }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.3.1", optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.11" }
subtle = { loaf = "crates-io/subtle", version = "^2.5.0", optional = true }
time = { loaf = "crates-io/time", version = "^0.3.35" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.44" }
zeroize = { loaf = "crates-io/zeroize", version = "^1.7.0", optional = true }
