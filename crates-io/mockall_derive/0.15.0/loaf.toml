# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/mockall_derive"
version = "0.15.0"

[project.features]
nightly_derive = ["proc-macro2/nightly"]

[rust]
name = "mockall_derive"
type = "proc-macro"
edition = "2021"
build-script = true

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.75" }
quote = { loaf = "crates-io/quote", version = "^1.0.35" }
syn = { loaf = "crates-io/syn", version = "^2.0.52", features = ["extra-traits", "full"] }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = []
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = []
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = []
cfg = []
