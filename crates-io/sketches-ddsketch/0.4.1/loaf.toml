# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/sketches-ddsketch"
version = "0.4.1"

[project.features]
serde = ["dep:serde"]
use_serde = ["serde", "dep:serde", "serde/derive"]

[rust]
name = "sketches_ddsketch"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive", "serde_derive"], optional = true }
