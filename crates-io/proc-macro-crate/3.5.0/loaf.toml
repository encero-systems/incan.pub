# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/proc-macro-crate"
version = "3.5.0"

[rust]
name = "proc_macro_crate"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
toml_edit = { loaf = "crates-io/toml_edit", version = "^0.25.0", features = ["parse"], default-features = false }
