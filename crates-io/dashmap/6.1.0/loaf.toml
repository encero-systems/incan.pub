# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/dashmap"
version = "6.1.0"

[project.features]
arbitrary = ["dep:arbitrary"]
inline = ["hashbrown/inline-more"]
raw-api = []
rayon = ["dep:rayon"]
serde = ["dep:serde"]
typesize = ["dep:typesize"]

[rust]
name = "dashmap"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.3.0", optional = true }
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.0" }
crossbeam-utils = { loaf = "crates-io/crossbeam-utils", version = "^0.8" }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.14.0", features = ["raw"], default-features = false }
lock_api = { loaf = "crates-io/lock_api", version = "^0.4.10" }
once_cell = { loaf = "crates-io/once_cell", version = "^1.18.0" }
parking_lot_core = { loaf = "crates-io/parking_lot_core", version = "^0.9.8" }
rayon = { loaf = "crates-io/rayon", version = "^1.7.0", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.188", features = ["derive"], optional = true }
typesize = { loaf = "crates-io/typesize", version = "^0.1.8", default-features = false, optional = true }
