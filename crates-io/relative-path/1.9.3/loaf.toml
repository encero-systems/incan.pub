# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/relative-path"
version = "1.9.3"

[project.features]
default = []
serde = ["dep:serde"]

[rust]
name = "relative_path"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0.160", optional = true }
