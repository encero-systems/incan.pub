# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/relative-path"
version = "2.0.2"

[project.features]
alloc = ["serde?/alloc"]
default = ["std", "alloc"]
serde = ["dep:serde"]
std = []

[rust]
name = "relative_path"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0.160", default-features = false, optional = true }
