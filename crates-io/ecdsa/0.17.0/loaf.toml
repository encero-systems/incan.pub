# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ecdsa"
version = "0.17.0"

[project.features]
algorithm = ["dep:rfc6979", "digest", "elliptic-curve/arithmetic"]
alloc = ["elliptic-curve/alloc", "signature/alloc", "dep:spki", "spki/alloc"]
default = ["digest"]
der = ["dep:der"]
dev = ["algorithm", "dep:digest", "digest/dev", "elliptic-curve/dev"]
digest = ["dep:digest", "elliptic-curve/digest", "signature/digest"]
getrandom = ["elliptic-curve/getrandom"]
pem = ["elliptic-curve/pem", "pkcs8"]
pkcs8 = ["der", "digest", "elliptic-curve/pkcs8"]
serde = ["dep:serdect", "elliptic-curve/serde", "pkcs8"]
sha2 = ["dep:sha2"]
spki = ["dep:spki"]
std = ["alloc", "elliptic-curve/std"]

[rust]
name = "ecdsa"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
der = { loaf = "crates-io/der", version = "^0.8", optional = true }
digest = { loaf = "crates-io/digest", version = "^0.11", features = ["oid"], default-features = false, optional = true }
elliptic-curve = { loaf = "crates-io/elliptic-curve", version = "^0.14", features = ["sec1"], default-features = false }
rfc6979 = { loaf = "crates-io/rfc6979", version = "^0.6", optional = true }
serdect = { loaf = "crates-io/serdect", version = "^0.4", features = ["alloc"], default-features = false, optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.11", features = ["oid"], default-features = false, optional = true }
signature = { loaf = "crates-io/signature", version = "^3", features = ["rand_core"], default-features = false }
spki = { loaf = "crates-io/spki", version = "^0.8", default-features = false, optional = true }
zeroize = { loaf = "crates-io/zeroize", version = "^1.5", default-features = false }
