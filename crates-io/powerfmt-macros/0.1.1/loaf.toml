# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/powerfmt-macros"
version = "0.1.1"

[rust]
name = "powerfmt_macros"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.67" }
quote = { loaf = "crates-io/quote", version = "^1.0.33" }
syn = { loaf = "crates-io/syn", version = "^3.0.6", features = ["full"] }
