# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/nu-ansi-term"
version = "0.50.3"

[project.features]
default = ["std"]
derive_serde_style = ["serde"]
gnu_legacy = []
serde = ["dep:serde"]
std = []

[rust]
name = "nu_ansi_term"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0.152", features = ["derive"], optional = true }
windows = { loaf = "crates-io/windows-sys", version = ">=0.59, <=0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"], target = "cfg(windows)" }
