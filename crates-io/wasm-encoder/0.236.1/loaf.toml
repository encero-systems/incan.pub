# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasm-encoder"
version = "0.236.1"

[project.features]
component-model = ["wasmparser?/component-model"]
default = ["std", "component-model"]
std = ["wasmparser?/std"]
wasmparser = ["dep:wasmparser"]

[rust]
name = "wasm_encoder"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
leb128fmt = { loaf = "crates-io/leb128fmt", version = "^0.1.0", default-features = false }
wasmparser = { loaf = "crates-io/wasmparser", version = "^0.236.1", features = ["simd"], default-features = false, optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["component-model", "default", "std"]
cfg = ["core_error"]
