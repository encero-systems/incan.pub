# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/jiff-static"
version = "0.2.37"

[project.features]
default = []
perf-inline = []
tz-fat = []
tzdb = ["dep:jiff-tzdb"]

[rust]
name = "jiff_static"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
jcore = { loaf = "crates-io/jiff-core", version = "^0.1" }
jiff-tzdb = { loaf = "crates-io/jiff-tzdb", version = "^0.1.6", optional = true }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.93" }
quote = { loaf = "crates-io/quote", version = "^1.0.38" }
syn = { loaf = "crates-io/syn", version = "^2.0.98" }
