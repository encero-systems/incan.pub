# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/servo_arc"
version = "0.5.0"

[project.features]
default = ["track_alloc_size"]
gecko_refcount_logging = []
serde = ["dep:serde"]
servo = ["serde", "track_alloc_size"]
track_alloc_size = []

[rust]
name = "servo_arc"
type = "lib"
edition = "2024"
build-script = false

[rust.source]
root = "lib.rs"

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
stable_deref_trait = { loaf = "crates-io/stable_deref_trait", version = "^1.0.0" }
