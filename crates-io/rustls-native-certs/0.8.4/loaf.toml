# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rustls-native-certs"
version = "0.8.4"

[rust]
name = "rustls_native_certs"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
openssl-probe = { loaf = "crates-io/openssl-probe", version = "^0.2", target = "cfg(all(unix, not(target_os = \"macos\")))" }
pki-types = { loaf = "crates-io/rustls-pki-types", version = "^1.10", features = ["std"] }
schannel = { loaf = "crates-io/schannel", version = "^0.1", target = "cfg(windows)" }
security-framework = { loaf = "crates-io/security-framework", version = "^3", target = "cfg(target_os = \"macos\")" }
