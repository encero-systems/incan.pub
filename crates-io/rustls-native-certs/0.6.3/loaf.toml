# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rustls-native-certs"
version = "0.6.3"

[rust]
name = "rustls_native_certs"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
openssl-probe = { loaf = "crates-io/openssl-probe", version = "^0.1.2", target = "cfg(all(unix, not(target_os = \"macos\")))" }
rustls-pemfile = { loaf = "crates-io/rustls-pemfile", version = "^1" }
schannel = { loaf = "crates-io/schannel", version = "^0.1.15", target = "cfg(windows)" }
security-framework = { loaf = "crates-io/security-framework", version = "^2.0.0", target = "cfg(target_os = \"macos\")" }
