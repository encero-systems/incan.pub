# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/arrow-array"
version = "60.0.0"

[project.features]
async = ["dep:futures"]
chrono-tz = ["dep:chrono-tz"]
ffi = ["arrow-schema/ffi", "arrow-data/ffi", "dep:libc"]
force_validate = ["arrow-data/force_validate"]
pool = ["arrow-buffer/pool", "arrow-data/pool"]

[rust]
name = "arrow_array"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
ahash = [{ loaf = "crates-io/ahash", version = "^0.8", features = ["compile-time-rng"], default-features = false, target = "cfg(target_arch = \"wasm32\")" }, { loaf = "crates-io/ahash", version = "^0.8", features = ["runtime-rng"], default-features = false, target = "cfg(not(target_arch = \"wasm32\"))" }]
arrow-buffer = { loaf = "crates-io/arrow-buffer", version = "^60.0.0" }
arrow-data = { loaf = "crates-io/arrow-data", version = "^60.0.0" }
arrow-schema = { loaf = "crates-io/arrow-schema", version = "^60.0.0" }
chrono = { loaf = "crates-io/chrono", version = "^0.4.40", features = ["clock"], default-features = false }
chrono-tz = { loaf = "crates-io/chrono-tz", version = "^0.10", optional = true }
futures = { loaf = "crates-io/futures", version = "^0.3", optional = true }
half = { loaf = "crates-io/half", version = "^2.1", features = ["num-traits"], default-features = false }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.17.0", default-features = false }
libc = { loaf = "crates-io/libc", version = "^0.2", default-features = false, optional = true, target = "cfg(not(all(target_family = \"wasm\", target_os = \"unknown\")))" }
num-complex = { loaf = "crates-io/num-complex", version = "^0.4.6", features = ["std"], default-features = false }
num-integer = { loaf = "crates-io/num-integer", version = "^0.1.46", features = ["std"], default-features = false }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.19", features = ["std"], default-features = false }
