# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/line-index"
version = "0.1.2"

[rust]
name = "line_index"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
nohash-hasher = { loaf = "crates-io/nohash-hasher", version = "^0.2.0" }
text-size = { loaf = "crates-io/text-size", version = "^1.1.1" }
