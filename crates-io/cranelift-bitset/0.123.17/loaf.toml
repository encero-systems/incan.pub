# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cranelift-bitset"
version = "0.123.17"

[project.features]
arbitrary = ["dep:arbitrary"]
enable-serde = ["dep:serde", "dep:serde_derive"]

[rust]
name = "cranelift_bitset"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.4.0", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.215", features = ["alloc"], default-features = false, optional = true }
serde_derive = { loaf = "crates-io/serde_derive", version = "^1.0.188", optional = true }
