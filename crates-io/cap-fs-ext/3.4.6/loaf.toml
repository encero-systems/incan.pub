# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cap-fs-ext"
version = "3.4.6"

[project.features]
arf-strings = ["dep:arf-strings"]
arf_strings = ["dep:cap-std", "cap-std/arf_strings", "fs_utf8", "arf-strings"]
async-std = ["dep:async-std"]
async-trait = ["dep:async-trait"]
async_std = ["cap-async-std", "async-std", "io-lifetimes/async-std", "async-trait"]
async_std_arf_strings = ["dep:cap-async-std", "cap-async-std/arf_strings", "async_std_fs_utf8", "arf-strings"]
async_std_fs_utf8 = ["dep:cap-async-std", "cap-async-std/fs_utf8", "camino"]
camino = ["dep:camino"]
cap-async-std = ["dep:cap-async-std"]
cap-std = ["dep:cap-std"]
default = ["std"]
fs_utf8 = ["dep:cap-std", "cap-std/fs_utf8", "camino"]
std = ["cap-std"]

[rust]
name = "cap_fs_ext"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
arf-strings = { loaf = "crates-io/arf-strings", version = "^0.7.0", optional = true }
async-std = { loaf = "crates-io/async-std", version = "^1.13.0", features = ["attributes", "io_safety"], optional = true }
async-trait = { loaf = "crates-io/async-trait", version = "^0.1.42", optional = true }
camino = { loaf = "crates-io/camino", version = "^1.0.5", optional = true }
cap-async-std = { loaf = "crates-io/cap-async-std", version = "^3.4.6", optional = true }
cap-primitives = { loaf = "crates-io/cap-primitives", version = "^3.4.6" }
cap-std = { loaf = "crates-io/cap-std", version = "^3.4.6", optional = true }
io-lifetimes = { loaf = "crates-io/io-lifetimes", version = "^2.0.0", default-features = false }
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.52, <=0.59", features = ["Win32_Storage_FileSystem"], target = "cfg(windows)" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["cap-std", "default", "std"]
cfg = []
