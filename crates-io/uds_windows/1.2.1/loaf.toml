# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/uds_windows"
version = "1.2.1"

[rust]
name = "uds_windows"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
memoffset = { loaf = "crates-io/memoffset", version = "^0.9.0" }
tempfile = { loaf = "crates-io/tempfile", version = "^3", target = "cfg(windows)" }
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.60, <0.62", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Threading"], target = "cfg(windows)" }
