# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/toml_parser"
version = "1.1.3+spec-1.1.0"

[project.features]
alloc = []
debug = ["std", "dep:anstream", "dep:anstyle"]
default = ["std"]
simd = ["winnow/simd"]
std = ["alloc"]
unsafe = []

[rust]
name = "toml_parser"
type = "lib"
edition = "2024"

[dependencies]
anstream = { loaf = "crates-io/anstream", version = "^1.0.0", optional = true }
anstyle = { loaf = "crates-io/anstyle", version = "^1.0.14", optional = true }
winnow = { loaf = "crates-io/winnow", version = "^1.0.0", default-features = false }
