# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ordermap"
version = "1.2.2"

[project.features]
arbitrary = ["dep:arbitrary", "indexmap/arbitrary"]
borsh = ["dep:borsh", "borsh/indexmap"]
default = ["std"]
quickcheck = ["dep:quickcheck", "indexmap/quickcheck"]
rayon = ["dep:rayon", "indexmap/rayon"]
serde = ["dep:serde_core", "dep:serde", "indexmap/serde"]
std = ["indexmap/std"]
sval = ["dep:sval", "indexmap/sval"]

[rust]
name = "ordermap"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.0", default-features = false, optional = true }
borsh = { loaf = "crates-io/borsh", version = "^1.5.6", default-features = false, optional = true }
indexmap = { loaf = "crates-io/indexmap", version = "^2.14.2", default-features = false }
quickcheck = { loaf = "crates-io/quickcheck", version = "^1.0", default-features = false, optional = true }
rayon = { loaf = "crates-io/rayon", version = "^1.9", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.220", default-features = false, optional = true, target = "cfg(any())" }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0.220", default-features = false, optional = true }
sval = { loaf = "crates-io/sval", version = "^2", default-features = false, optional = true }
