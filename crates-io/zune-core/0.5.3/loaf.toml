# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/zune-core"
version = "0.5.3"

[project.features]
log = ["dep:log"]
serde = ["dep:serde"]
std = []

[rust]
name = "zune_core"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
log = { loaf = "crates-io/log", version = "^0.4", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
