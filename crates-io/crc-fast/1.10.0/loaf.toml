# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/crc-fast"
version = "1.10.0"

[project.features]
alloc = ["digest"]
cache = ["alloc", "hashbrown", "spin"]
cli = ["std"]
default = ["std", "panic-handler", "ffi"]
digest = ["dep:digest"]
ffi = []
hashbrown = ["dep:hashbrown"]
optimize_crc32_auto = []
optimize_crc32_avx512_v4s3x3 = []
optimize_crc32_avx512_vpclmulqdq_v3x2 = []
optimize_crc32_neon_blended = []
optimize_crc32_neon_eor3_v9s3x2e_s3 = []
optimize_crc32_neon_v12e_v1 = []
optimize_crc32_neon_v3s4x2e_v2 = []
optimize_crc32_sse_v4s3x3 = []
panic-handler = []
spin = ["dep:spin"]
std = ["alloc"]
vpclmulqdq = []

[rust]
name = "crc_fast"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
digest = { loaf = "crates-io/digest", version = "^0.10", features = ["alloc"], default-features = false, optional = true }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.16.0", optional = true }
spin = [{ loaf = "crates-io/spin", version = "^0.10.0", features = ["mutex", "once", "rwlock", "spin_mutex"], default-features = false, target = "cfg(target_arch = \"aarch64\")" }, { loaf = "crates-io/spin", version = "^0.10.0", features = ["mutex", "once", "rwlock", "spin_mutex"], default-features = false, target = "cfg(target_arch = \"x86\")" }, { loaf = "crates-io/spin", version = "^0.10.0", features = ["mutex", "once", "rwlock", "spin_mutex"], default-features = false, target = "cfg(target_arch = \"x86_64\")" }, { loaf = "crates-io/spin", version = "^0.10.0", features = ["mutex", "once", "rwlock", "spin_mutex"], default-features = false, optional = true }]
