# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tiff"
version = "0.9.1"

[rust]
name = "tiff"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
flate2 = { loaf = "crates-io/flate2", version = "^1.0.20" }
jpeg = { loaf = "crates-io/jpeg-decoder", version = "^0.3.0", default-features = false }
weezl = { loaf = "crates-io/weezl", version = "^0.1.0" }
