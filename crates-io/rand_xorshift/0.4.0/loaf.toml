# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rand_xorshift"
version = "0.4.0"

[project.features]
serde = ["dep:serde"]

[rust]
name = "rand_xorshift"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
rand_core = { loaf = "crates-io/rand_core", version = "^0.9.0" }
serde = { loaf = "crates-io/serde", version = "^1.0.118", features = ["derive"], default-features = false, optional = true }
