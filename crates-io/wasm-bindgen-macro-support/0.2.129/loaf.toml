# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasm-bindgen-macro-support"
version = "0.2.129"

[project.features]
extra-traits = ["syn/extra-traits"]
strict-macro = []

[rust]
name = "wasm_bindgen_macro_support"
type = "lib"
edition = "2021"

[dependencies]
bumpalo = { loaf = "crates-io/bumpalo", version = "^3.0.0" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^3.0", features = ["extra-traits", "full", "visit", "visit-mut"] }
wasm-bindgen-shared = { loaf = "crates-io/wasm-bindgen-shared", version = "=0.2.129" }
