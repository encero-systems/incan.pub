# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-smithy-query"
version = "0.62.1"

[rust]
name = "aws_smithy_query"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
aws-smithy-runtime-api = { loaf = "crates-io/aws-smithy-runtime-api", version = "^1.16.2", features = ["client", "http-1x"] }
aws-smithy-schema = { loaf = "crates-io/aws-smithy-schema", version = "^0.2.1" }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.6.4", features = ["http-body-1-x"] }
aws-smithy-xml = { loaf = "crates-io/aws-smithy-xml", version = "^0.62.1" }
urlencoding = { loaf = "crates-io/urlencoding", version = "^2.1" }
