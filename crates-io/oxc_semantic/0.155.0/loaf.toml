# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/oxc_semantic"
version = "0.155.0"

[project.features]
cfg = ["dep:oxc_cfg"]
default = []
jsdoc = ["dep:oxc_jsdoc"]
linter = ["jsdoc"]
serialize = ["oxc_span/serialize", "oxc_syntax/serialize"]

[rust]
name = "oxc_semantic"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
itertools = { loaf = "crates-io/itertools", version = "^0.15.0" }
memchr = { loaf = "crates-io/memchr", version = "^2.8.2" }
oxc_allocator = { loaf = "crates-io/oxc_allocator", version = "^0.155.0", features = ["bitset"] }
oxc_ast = { loaf = "crates-io/oxc_ast", version = "^0.155.0" }
oxc_ast_visit = { loaf = "crates-io/oxc_ast_visit", version = "^0.155.0" }
oxc_cfg = { loaf = "crates-io/oxc_cfg", version = "^0.155.0", optional = true }
oxc_data_structures = { loaf = "crates-io/oxc_data_structures", version = "^0.155.0" }
oxc_diagnostics = { loaf = "crates-io/oxc_diagnostics", version = "^0.155.0" }
oxc_ecmascript = { loaf = "crates-io/oxc_ecmascript", version = "^0.155.0" }
oxc_index = { loaf = "crates-io/oxc_index", version = "^5.0.0", features = ["nonmax", "serde"] }
oxc_jsdoc = { loaf = "crates-io/oxc_jsdoc", version = "^0.155.0", optional = true }
oxc_span = { loaf = "crates-io/oxc_span", version = "^0.155.0" }
oxc_str = { loaf = "crates-io/oxc_str", version = "^0.155.0" }
oxc_syntax = { loaf = "crates-io/oxc_syntax", version = "^0.155.0", features = ["to_js_string"] }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2" }
self_cell = { loaf = "crates-io/self_cell", version = "^1.2.2" }
smallvec = { loaf = "crates-io/smallvec", version = "^1.15.2", features = ["serde", "union"] }
