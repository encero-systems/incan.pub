# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/profiling-procmacros"
version = "1.0.18"

[project.features]
profile-with-optick = []
profile-with-puffin = []
profile-with-superluminal = []
profile-with-tracing = []
profile-with-tracy = []

[rust]
name = "profiling_procmacros"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
quote = { loaf = "crates-io/quote", version = "^1.0", default-features = false }
syn = { loaf = "crates-io/syn", version = "^2.0", features = ["full"] }
