# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/multer"
version = "3.1.0"

[project.features]
all = ["json"]
default = []
json = ["serde", "serde_json"]
log = ["dep:log"]
serde = ["dep:serde"]
serde_json = ["dep:serde_json"]
tokio = ["dep:tokio"]
tokio-io = ["tokio", "tokio-util"]
tokio-util = ["dep:tokio-util"]

[rust]
name = "multer"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
bytes = { loaf = "crates-io/bytes", version = "^1.0" }
encoding_rs = { loaf = "crates-io/encoding_rs", version = "^0.8.20" }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3", default-features = false }
http = { loaf = "crates-io/http", version = "^1.0" }
httparse = { loaf = "crates-io/httparse", version = "^1.3" }
log = { loaf = "crates-io/log", version = "^0.4.15", optional = true }
memchr = { loaf = "crates-io/memchr", version = "^2.4" }
mime = { loaf = "crates-io/mime", version = "^0.3.10" }
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0", optional = true }
spin = { loaf = "crates-io/spin", version = "^0.9", features = ["spin_mutex"], default-features = false }
tokio = { loaf = "crates-io/tokio", version = "^1.0", optional = true }
tokio-util = { loaf = "crates-io/tokio-util", version = "^0.7", features = ["io"], optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["default"]
cfg = []
