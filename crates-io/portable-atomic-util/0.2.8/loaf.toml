# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/portable-atomic-util"
version = "0.2.8"

[project.features]
alloc = []
default = []
serde = ["dep:serde"]
std = ["alloc"]

[rust]
name = "portable_atomic_util"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
portable-atomic = { loaf = "crates-io/portable-atomic", version = "^1.5.1", features = ["require-cas"], default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0.60", default-features = false, optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["default"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "release"
features = ["default"]
cfg = []
