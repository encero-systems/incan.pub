# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/equator-macro"
version = "0.4.2"

[rust]
name = "equator_macro"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.86" }
quote = { loaf = "crates-io/quote", version = "^1.0.36" }
syn = { loaf = "crates-io/syn", version = "^2.0.72", features = ["full"] }
