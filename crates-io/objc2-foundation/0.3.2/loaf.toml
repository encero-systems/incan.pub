[rust]
name = "objc2_foundation"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.5.0", features = ["std"], default-features = false, optional = true }
block2 = { loaf = "crates-io/block2", version = ">=0.6.1, <0.8.0", features = ["alloc"], default-features = false, optional = true }
libc = { loaf = "crates-io/libc", version = "^0.2.80", default-features = false, optional = true }
objc2 = { loaf = "crates-io/objc2", version = ">=0.6.2, <0.8.0", features = ["std"], default-features = false }
objc2-core-foundation = { loaf = "crates-io/objc2-core-foundation", version = "^0.3.2", features = ["CFArray", "CFAttributedString", "CFCGTypes", "CFCalendar", "CFCharacterSet", "CFData", "CFDate", "CFDictionary", "CFError", "CFFileSecurity", "CFLocale", "CFMachPort", "CFMessagePort", "CFRunLoop", "CFSet", "CFStream", "CFURL", "objc2"], default-features = false, optional = true }
objc2-core-services = { loaf = "crates-io/objc2-core-services", version = "^0.3.2", features = ["AE", "AEDataModel", "objc2"], default-features = false, optional = true, target = "cfg(target_vendor = \"apple\")" }
