# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cfb"
version = "0.15.0"

[rust]
name = "cfb"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
fnv = { loaf = "crates-io/fnv", version = "^1.0" }
uuid = { loaf = "crates-io/uuid", version = "^1" }
web-time = { loaf = "crates-io/web-time", version = "^1" }
