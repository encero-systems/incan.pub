# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ring"
version = "0.17.14"

[project.features]
alloc = []
default = ["alloc", "dev_urandom_fallback"]
dev_urandom_fallback = []
less-safe-getrandom-custom-or-rdrand = []
less-safe-getrandom-espidf = []
slow_tests = []
std = ["alloc"]
test_logging = []
unstable-testing-arm-no-hw = []
unstable-testing-arm-no-neon = []
wasm32_unknown_unknown_js = ["getrandom/js"]

[rust]
name = "ring"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.0", default-features = false }
getrandom = { loaf = "crates-io/getrandom", version = "^0.2.10" }
libc = [{ loaf = "crates-io/libc", version = "^0.2.148", default-features = false, target = "cfg(all(any(all(target_arch = \"aarch64\", target_endian = \"little\"), all(target_arch = \"arm\", target_endian = \"little\")), any(target_os = \"android\", target_os = \"linux\")))" }, { loaf = "crates-io/libc", version = "^0.2.155", default-features = false, target = "cfg(all(all(target_arch = \"aarch64\", target_endian = \"little\"), target_vendor = \"apple\", any(target_os = \"ios\", target_os = \"macos\", target_os = \"tvos\", target_os = \"visionos\", target_os = \"watchos\")))" }]
untrusted = { loaf = "crates-io/untrusted", version = "^0.9" }
windows-sys = { loaf = "crates-io/windows-sys", version = "^0.52", features = ["Win32_Foundation", "Win32_System_Threading"], target = "cfg(all(all(target_arch = \"aarch64\", target_endian = \"little\"), target_os = \"windows\"))" }
