# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tiny-keccak"
version = "2.0.2"

[project.features]
cshake = []
default = []
fips202 = ["keccak", "shake", "sha3"]
k12 = []
keccak = []
kmac = ["cshake"]
parallel_hash = ["cshake"]
sha3 = []
shake = []
sp800 = ["cshake", "kmac", "tuple_hash"]
tuple_hash = ["cshake"]

[rust]
name = "tiny_keccak"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
crunchy = { loaf = "crates-io/crunchy", version = "^0.2.2" }
