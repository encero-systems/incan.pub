# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rkyv_derive"
version = "0.8.18"

[project.features]
bytecheck = []
default = []

[rust]
name = "rkyv_derive"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1", features = ["proc-macro"], default-features = false }
quote = { loaf = "crates-io/quote", version = "^1", features = ["proc-macro"], default-features = false }
syn = { loaf = "crates-io/syn", version = "^3.0", features = ["clone-impls", "derive", "parsing", "printing", "proc-macro"], default-features = false }
