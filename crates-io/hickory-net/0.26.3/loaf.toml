# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/hickory-net"
version = "0.26.3"

[project.features]
__dnssec = ["dep:bitflags", "dep:rustls-pki-types", "dep:time", "dep:lru-cache", "dep:parking_lot"]
__h3 = ["dep:h3", "dep:h3-quinn", "dep:http"]
__https = ["dep:bytes", "dep:h2", "dep:http"]
__quic = ["dep:bytes", "dep:pin-project-lite", "dep:quinn"]
__tls = ["dep:bytes", "dep:rustls", "dep:tokio-rustls", "tokio"]
default = ["tokio"]
dnssec-aws-lc-rs = ["dep:aws-lc-rs", "aws-lc-rs/aws-lc-sys", "aws-lc-rs/ring-io", "hickory-proto/dnssec-aws-lc-rs", "__dnssec"]
dnssec-ring = ["dep:ring", "hickory-proto/dnssec-ring", "__dnssec"]
h3-aws-lc-rs = ["quic-aws-lc-rs", "__h3"]
h3-ring = ["quic-ring", "__h3"]
https-aws-lc-rs = ["tls-aws-lc-rs", "__https"]
https-ring = ["tls-ring", "__https"]
mdns = ["dep:socket2", "socket2/all"]
quic-aws-lc-rs = ["dep:quinn", "quinn/rustls-aws-lc-rs", "tls-aws-lc-rs", "__quic"]
quic-ring = ["dep:quinn", "quinn/rustls-ring", "tls-ring", "__quic"]
rustls-platform-verifier = ["dep:rustls-platform-verifier"]
serde = ["dep:serde", "url/serde"]
socket2 = ["dep:socket2"]
tls-aws-lc-rs = ["dep:tokio-rustls", "tokio-rustls/aws-lc-rs", "__tls"]
tls-ring = ["dep:tokio-rustls", "tokio-rustls/ring", "__tls"]
tokio = ["dep:tokio", "tokio/net", "tokio/rt", "tokio/time", "tokio/rt-multi-thread"]
webpki-roots = ["dep:webpki-roots"]

[rust]
name = "hickory_net"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
async-trait = { loaf = "crates-io/async-trait", version = "^0.1.43" }
aws-lc-rs = { loaf = "crates-io/aws-lc-rs", version = "^1.12.3", features = ["prebuilt-nasm"], default-features = false, optional = true }
bitflags = { loaf = "crates-io/bitflags", version = "^2.4.1", optional = true }
bytes = { loaf = "crates-io/bytes", version = "^1", optional = true }
cfg-if = { loaf = "crates-io/cfg-if", version = "^1" }
data-encoding = { loaf = "crates-io/data-encoding", version = "^2.2.0", features = ["alloc"], default-features = false }
futures-channel = { loaf = "crates-io/futures-channel", version = "^0.3.5", features = ["alloc", "std"], default-features = false }
futures-io = { loaf = "crates-io/futures-io", version = "^0.3.5", features = ["std"], default-features = false }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3.5", features = ["alloc", "async-await-macro", "std"], default-features = false }
h2 = { loaf = "crates-io/h2", version = "^0.4.0", features = ["stream"], optional = true }
h3 = { loaf = "crates-io/h3", version = "^0.0.8", optional = true }
h3-quinn = { loaf = "crates-io/h3-quinn", version = "^0.0.10", optional = true }
hickory-proto = { loaf = "crates-io/hickory-proto", version = "^0.26.3", features = ["std"], default-features = false }
http = { loaf = "crates-io/http", version = "^1.1", optional = true }
idna = { loaf = "crates-io/idna", version = "^1.0.3", features = ["alloc", "compiled_data"], default-features = false }
ipnet = { loaf = "crates-io/ipnet", version = "^2.11.0", default-features = false }
jni = { loaf = "crates-io/jni", version = "^0.22.1", target = "cfg(target_os = \"android\")" }
lru-cache = { loaf = "crates-io/lru-cache", version = "^0.1.2", optional = true }
parking_lot = { loaf = "crates-io/parking_lot", version = "^0.12", optional = true }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2", optional = true }
quinn = { loaf = "crates-io/quinn", version = "^0.11.2", features = ["log", "runtime-tokio"], default-features = false, optional = true }
rand = { loaf = "crates-io/rand", version = "^0.10.0", features = ["alloc", "std_rng"], default-features = false }
ring = { loaf = "crates-io/ring", version = "^0.17", features = ["std"], optional = true }
rustls = { loaf = "crates-io/rustls", version = "^0.23.23", features = ["logging", "std", "tls12"], default-features = false, optional = true }
rustls-pki-types = { loaf = "crates-io/rustls-pki-types", version = "^1.10", optional = true }
rustls-platform-verifier = { loaf = "crates-io/rustls-platform-verifier", version = "^0.7", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive"], optional = true }
socket2 = { loaf = "crates-io/socket2", version = "^0.6", optional = true }
thiserror = { loaf = "crates-io/thiserror", version = "^2", default-features = false }
time = { loaf = "crates-io/time", version = "^0.3", optional = true }
tinyvec = { loaf = "crates-io/tinyvec", version = "^1.1.1", features = ["alloc"] }
tokio = { loaf = "crates-io/tokio", version = "^1.36", features = ["io-util", "macros"], optional = true }
tokio-rustls = { loaf = "crates-io/tokio-rustls", version = "^0.26", features = ["early-data"], default-features = false, optional = true }
tracing = { loaf = "crates-io/tracing", version = "^0.1.30", default-features = false }
url = { loaf = "crates-io/url", version = "^2.5.4", default-features = false }
webpki-roots = { loaf = "crates-io/webpki-roots", version = "^1", optional = true }
