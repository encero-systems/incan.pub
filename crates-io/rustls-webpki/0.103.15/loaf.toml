# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rustls-webpki"
version = "0.103.15"

[project.features]
alloc = ["ring?/alloc", "pki-types/alloc"]
aws-lc-rs = ["dep:aws-lc-rs", "aws-lc-rs/aws-lc-sys", "aws-lc-rs/prebuilt-nasm"]
aws-lc-rs-fips = ["dep:aws-lc-rs", "aws-lc-rs/fips"]
aws-lc-rs-unstable = ["aws-lc-rs"]
default = ["std"]
ring = ["dep:ring"]
std = ["alloc", "pki-types/std"]

[rust]
name = "webpki"
type = "lib"
edition = "2021"

[dependencies]
aws-lc-rs = { loaf = "crates-io/aws-lc-rs", version = "^1.18", default-features = false, optional = true }
pki-types = { loaf = "crates-io/rustls-pki-types", version = "^1.12", default-features = false }
ring = { loaf = "crates-io/ring", version = "^0.17", default-features = false, optional = true }
untrusted = { loaf = "crates-io/untrusted", version = "^0.9" }
