# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/rustls-webpki"
version = "0.101.7"

[project.features]
alloc = ["ring/alloc"]
default = ["std"]
std = ["alloc"]

[rust]
name = "webpki"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
ring = { loaf = "crates-io/ring", version = "^0.17", default-features = false }
untrusted = { loaf = "crates-io/untrusted", version = "^0.9" }
