# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rowan"
version = "0.15.17"

[project.features]
serde = ["dep:serde"]
serde1 = ["serde", "text-size/serde"]

[rust]
name = "rowan"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
countme = { loaf = "crates-io/countme", version = "^3.0.0" }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.14.3", features = ["inline-more"], default-features = false }
memoffset = { loaf = "crates-io/memoffset", version = "^0.9" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^1.0.1" }
serde = { loaf = "crates-io/serde", version = "^1.0.89", default-features = false, optional = true }
text-size = { loaf = "crates-io/text-size", version = "^1.1.0" }
