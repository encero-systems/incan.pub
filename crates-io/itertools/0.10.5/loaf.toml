# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/itertools"
version = "0.10.5"

[project.features]
default = ["use_std"]
use_alloc = []
use_std = ["use_alloc", "either/use_std"]

[rust]
name = "itertools"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
either = { loaf = "crates-io/either", version = "^1.0", default-features = false }
