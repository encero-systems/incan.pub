# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/windows-registry"
version = "0.6.1"

[project.features]
default = ["std"]
std = ["windows-result/std", "windows-strings/std"]

[rust]
name = "windows_registry"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
windows-link = { loaf = "crates-io/windows-link", version = "^0.2.1", default-features = false }
windows-result = { loaf = "crates-io/windows-result", version = "^0.4.1", default-features = false }
windows-strings = { loaf = "crates-io/windows-strings", version = "^0.5.1", default-features = false }
