# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/gimli"
version = "0.32.3"

[project.features]
default = ["read-all", "write"]
endian-reader = ["read", "dep:stable_deref_trait"]
fallible-iterator = ["dep:fallible-iterator"]
read = ["read-core"]
read-all = ["read", "std", "fallible-iterator", "endian-reader"]
read-core = []
rustc-dep-of-std = ["dep:core", "dep:alloc"]
std = ["fallible-iterator?/std", "stable_deref_trait?/std"]
write = ["dep:indexmap"]

[rust]
name = "gimli"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
alloc = { loaf = "crates-io/rustc-std-workspace-alloc", version = "^1.0.0", optional = true }
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0.0", optional = true }
fallible-iterator = { loaf = "crates-io/fallible-iterator", version = "^0.3.0", default-features = false, optional = true }
indexmap = { loaf = "crates-io/indexmap", version = "^2.0.0", optional = true }
stable_deref_trait = { loaf = "crates-io/stable_deref_trait", version = "^1.1.0", default-features = false, optional = true }
