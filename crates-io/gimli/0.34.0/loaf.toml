# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/gimli"
version = "0.34.0"

[project.features]
default = ["read-all", "write"]
endian-reader = ["read", "dep:stable_deref_trait"]
fallible-iterator = ["dep:fallible-iterator"]
read = ["read-core"]
read-all = ["read", "std", "endian-reader"]
read-core = []
rustc-dep-of-std = ["dep:core", "dep:alloc"]
std = ["stable_deref_trait?/std"]
write = ["dep:fnv", "dep:hashbrown", "dep:indexmap"]

[rust]
name = "gimli"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
alloc = { loaf = "crates-io/rustc-std-workspace-alloc", version = "^1.0.0", optional = true }
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0.0", optional = true }
fallible-iterator = { loaf = "crates-io/fallible-iterator", version = "^0.3.0", default-features = false, optional = true }
fnv = { loaf = "crates-io/fnv", version = "^1.0.7", default-features = false, optional = true }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.17.0", default-features = false, optional = true }
indexmap = { loaf = "crates-io/indexmap", version = "^2.0.0", default-features = false, optional = true }
stable_deref_trait = { loaf = "crates-io/stable_deref_trait", version = "^1.1.0", default-features = false, optional = true }
