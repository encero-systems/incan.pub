# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/bstr"
version = "1.12.1"

[project.features]
alloc = ["memchr/alloc", "serde?/alloc"]
default = ["std", "unicode"]
serde = ["dep:serde"]
std = ["alloc", "memchr/std", "serde?/std"]
unicode = ["dep:regex-automata"]

[rust]
name = "bstr"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
memchr = { loaf = "crates-io/memchr", version = "^2.7.1", default-features = false }
regex-automata = { loaf = "crates-io/regex-automata", version = "^0.4.1", features = ["dfa-search"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.85", default-features = false, optional = true }
