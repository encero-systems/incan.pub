# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/anyhow"
version = "1.0.102"

[project.features]
backtrace = []
default = ["std"]
std = []

[rust]
name = "anyhow"
type = "lib"
edition = "2021"
build-script = true

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default", "std"]
cfg = []
