# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/valuable"
version = "0.1.1"

[project.features]
alloc = []
default = ["std"]
derive = ["valuable-derive"]
std = ["alloc"]
valuable-derive = ["dep:valuable-derive"]

[rust]
name = "valuable"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
valuable-derive = { loaf = "crates-io/valuable-derive", version = "=0.1.1", optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["alloc", "default", "std"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["alloc", "default", "std"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["alloc", "default", "std"]
cfg = []
