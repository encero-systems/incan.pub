# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/dirs-sys"
version = "0.5.0"

[rust]
name = "dirs_sys"
type = "lib"
edition = "2015"
build-script = false

[dependencies]
libc = { loaf = "crates-io/libc", version = "^0.2", target = "cfg(unix)" }
option-ext = { loaf = "crates-io/option-ext", version = "^0.2.0" }
redox_users = { loaf = "crates-io/redox_users", version = "^0.5", default-features = false, target = "cfg(target_os = \"redox\")" }
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.59.0", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_UI_Shell"], target = "cfg(windows)" }
