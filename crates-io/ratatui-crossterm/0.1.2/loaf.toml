# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ratatui-crossterm"
version = "0.1.2"

[project.features]
crossterm_0_28 = ["dep:crossterm_0_28"]
crossterm_0_29 = ["dep:crossterm_0_29"]
default = ["crossterm_0_29", "underline-color"]
document-features = ["dep:document-features"]
scrolling-regions = ["ratatui-core/scrolling-regions"]
serde = ["crossterm_0_28?/serde", "crossterm_0_29?/serde"]
underline-color = ["ratatui-core/underline-color"]
unstable = ["unstable-backend-writer"]
unstable-backend-writer = []

[rust]
name = "ratatui_crossterm"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.1" }
crossterm_0_28 = { loaf = "crates-io/crossterm", version = "^0.28", optional = true }
crossterm_0_29 = { loaf = "crates-io/crossterm", version = "^0.29", optional = true }
document-features = { loaf = "crates-io/document-features", version = "^0.2", optional = true }
instability = { loaf = "crates-io/instability", version = "^0.3" }
ratatui-core = { loaf = "crates-io/ratatui-core", version = "^0.1.2" }
