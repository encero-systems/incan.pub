# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasm-metadata"
version = "0.247.0"

[project.features]
clap = ["dep:clap"]
default = ["oci", "serde"]
oci = ["dep:auditable-serde", "dep:flate2", "dep:url", "dep:spdx", "dep:serde_json", "serde"]
serde = ["dep:serde_derive", "dep:serde"]

[rust]
name = "wasm_metadata"
type = "lib"
edition = "2021"

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.58", default-features = false }
auditable-serde = { loaf = "crates-io/auditable-serde", version = "^0.9.0", optional = true }
clap = { loaf = "crates-io/clap", version = "^4.0.0", features = ["derive"], optional = true }
flate2 = { loaf = "crates-io/flate2", version = "^1.1.0", optional = true }
indexmap = { loaf = "crates-io/indexmap", version = "^2.14.0", features = ["serde", "std"], default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0.166", features = ["alloc"], default-features = false, optional = true }
serde_derive = { loaf = "crates-io/serde_derive", version = "^1.0.166", optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1", optional = true }
spdx = { loaf = "crates-io/spdx", version = "^0.13.4", optional = true }
url = { loaf = "crates-io/url", version = "^2.0.0", optional = true }
wasm-encoder = { loaf = "crates-io/wasm-encoder", version = "^0.247.0", features = ["component-model", "std"], default-features = false }
wasmparser = { loaf = "crates-io/wasmparser", version = "^0.247.0", features = ["component-model", "hash-collections", "simd", "std"], default-features = false }
