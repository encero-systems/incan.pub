# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/auditable-serde"
version = "0.8.0"

[project.features]
default = []
schema = ["schemars"]
schemars = ["dep:schemars"]

[rust]
name = "auditable_serde"
type = "lib"
edition = "2018"

[dependencies]
schemars = { loaf = "crates-io/schemars", version = "^0.8.10", optional = true }
semver = { loaf = "crates-io/semver", version = "^1.0", features = ["serde"] }
serde = { loaf = "crates-io/serde", version = "^1", features = ["serde_derive"] }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.57" }
topological-sort = { loaf = "crates-io/topological-sort", version = "^0.2.2" }
