# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/num_enum_derive"
version = "0.7.6"

[project.features]
complex-expressions = ["syn/full"]
default = ["std"]
external_doc = []
proc-macro-crate = ["dep:proc-macro-crate"]
std = ["proc-macro-crate"]

[rust]
name = "num_enum_derive"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro-crate = { loaf = "crates-io/proc-macro-crate", version = ">=1, <=3", optional = true }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.60" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^2", features = ["derive", "extra-traits", "parsing"] }
