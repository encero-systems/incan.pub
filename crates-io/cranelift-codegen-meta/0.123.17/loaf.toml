# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cranelift-codegen-meta"
version = "0.123.17"

[project.features]
pulley = ["dep:pulley-interpreter"]

[rust]
name = "cranelift_codegen_meta"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
cranelift-assembler-x64-meta = { loaf = "crates-io/cranelift-assembler-x64-meta", version = "^0.123.17" }
cranelift-codegen-shared = { loaf = "crates-io/cranelift-codegen-shared", version = "^0.123.17" }
cranelift-srcgen = { loaf = "crates-io/cranelift-srcgen", version = "^0.123.17" }
heck = { loaf = "crates-io/heck", version = "^0.5.0" }
pulley-interpreter = { loaf = "crates-io/pulley-interpreter", version = "=36.0.17", optional = true }
