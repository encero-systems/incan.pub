# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tinystr"
version = "0.8.2"

[project.features]
alloc = ["serde_core?/alloc", "zerovec?/alloc"]
databake = ["dep:databake"]
default = ["alloc"]
serde = ["dep:serde_core"]
std = []
zerovec = ["dep:zerovec"]

[rust]
name = "tinystr"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
databake = { loaf = "crates-io/databake", version = "^0.2.0", default-features = false, optional = true }
displaydoc = { loaf = "crates-io/displaydoc", version = "^0.2.3", default-features = false }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0.220", default-features = false, optional = true }
zerovec = { loaf = "crates-io/zerovec", version = "^0.11.3", default-features = false, optional = true }
