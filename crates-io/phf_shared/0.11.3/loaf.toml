# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/phf_shared"
version = "0.11.3"

[project.features]
default = ["std"]
std = []
uncased = ["dep:uncased"]
unicase = ["dep:unicase"]

[rust]
name = "phf_shared"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
siphasher = { loaf = "crates-io/siphasher", version = "^1.0" }
uncased = { loaf = "crates-io/uncased", version = "^0.9.9", default-features = false, optional = true }
unicase = { loaf = "crates-io/unicase", version = "^2.4.0", optional = true }
