# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/prefix-trie"
version = "0.8.4"

[project.features]
cidr = ["dep:cidr"]
default = ["ipnet"]
ipnet = ["dep:ipnet"]
ipnetwork = ["dep:ipnetwork"]
serde = ["dep:serde", "dep:ipnet", "ipnet/serde", "dep:ipnetwork", "ipnetwork/serde", "dep:cidr", "cidr/serde"]

[rust]
name = "prefix_trie"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
cidr = { loaf = "crates-io/cidr", version = "^0.3", optional = true }
either = { loaf = "crates-io/either", version = "^1" }
ipnet = { loaf = "crates-io/ipnet", version = "^2.3.0", optional = true }
ipnetwork = { loaf = "crates-io/ipnetwork", version = "^0.20", optional = true }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.4" }
serde = { loaf = "crates-io/serde", version = "^1", optional = true }
