# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/filetime"
version = "0.2.29"

[rust]
name = "filetime"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.0" }
libc = { loaf = "crates-io/libc", version = "^0.2.27", target = "cfg(unix)" }
