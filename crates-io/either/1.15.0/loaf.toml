# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/either"
version = "1.15.0"

[project.features]
default = ["std"]
serde = ["dep:serde"]
std = []
use_std = ["std"]

[rust]
name = "either"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0.95", features = ["alloc", "derive"], default-features = false, optional = true }
