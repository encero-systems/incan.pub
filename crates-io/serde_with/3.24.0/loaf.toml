# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/serde_with"
version = "3.24.0"

[project.features]
alloc = ["serde_core/alloc", "base64?/alloc", "bs58?/alloc", "chrono_0_4?/alloc", "hex?/alloc", "jiff_0_2?/alloc", "serde_json?/alloc", "time_0_3?/alloc"]
base58 = ["dep:bs58", "alloc"]
base64 = ["dep:base64", "alloc"]
chrono = ["chrono_0_4"]
chrono_0_4 = ["dep:chrono_0_4"]
default = ["std", "macros"]
guide = ["dep:document-features", "macros", "std"]
hashbrown_0_14 = ["dep:hashbrown_0_14", "alloc"]
hashbrown_0_15 = ["dep:hashbrown_0_15", "alloc"]
hashbrown_0_16 = ["dep:hashbrown_0_16", "alloc"]
hashbrown_0_17 = ["dep:hashbrown_0_17", "alloc"]
hex = ["dep:hex", "alloc"]
indexmap = ["indexmap_1"]
indexmap_1 = ["dep:indexmap_1", "alloc"]
indexmap_2 = ["dep:indexmap_2", "alloc"]
jiff_0_2 = ["dep:jiff_0_2"]
json = ["dep:serde_json", "alloc"]
macros = ["dep:serde_with_macros"]
schemars_0_8 = ["dep:schemars_0_8", "std", "serde_with_macros?/schemars_0_8", "dep:serde_json"]
schemars_0_9 = ["dep:schemars_0_9", "alloc", "serde_with_macros?/schemars_0_9", "dep:serde_json"]
schemars_1 = ["dep:schemars_1", "alloc", "serde_with_macros?/schemars_1", "dep:serde_json"]
smallvec_1 = ["dep:smallvec_1"]
std = ["alloc", "bs58?/std", "serde_core/std", "chrono_0_4?/clock", "chrono_0_4?/std", "indexmap_1?/std", "indexmap_2?/std", "jiff_0_2?/std", "jiff_0_2?/tz-system", "jiff_0_2?/tzdb-bundle-platform", "jiff_0_2?/tzdb-concatenated", "jiff_0_2?/tzdb-zoneinfo", "time_0_3?/serde-well-known", "time_0_3?/std", "schemars_0_9?/std", "schemars_1?/std"]
time_0_3 = ["dep:time_0_3"]

[rust]
name = "serde_with"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
base64 = { loaf = "crates-io/base64", version = "^0.23.1", default-features = false, optional = true }
bs58 = { loaf = "crates-io/bs58", version = "^0.5.1", default-features = false, optional = true }
chrono_0_4 = { loaf = "crates-io/chrono", version = "^0.4.20", features = ["serde"], default-features = false, optional = true }
document-features = { loaf = "crates-io/document-features", version = "^0.2.12", optional = true }
hashbrown_0_14 = { loaf = "crates-io/hashbrown", version = "^0.14.0", features = ["serde"], default-features = false, optional = true }
hashbrown_0_15 = { loaf = "crates-io/hashbrown", version = "^0.15.0", features = ["serde"], default-features = false, optional = true }
hashbrown_0_16 = { loaf = "crates-io/hashbrown", version = "^0.16.0", features = ["serde"], default-features = false, optional = true }
hashbrown_0_17 = { loaf = "crates-io/hashbrown", version = "^0.17.0", features = ["serde"], default-features = false, optional = true }
hex = { loaf = "crates-io/hex", version = "^0.4.3", default-features = false, optional = true }
indexmap_1 = { loaf = "crates-io/indexmap", version = "^1.8", features = ["serde-1"], default-features = false, optional = true }
indexmap_2 = { loaf = "crates-io/indexmap", version = "^2.0", features = ["serde"], default-features = false, optional = true }
jiff_0_2 = { loaf = "crates-io/jiff", version = "^0.2.0", default-features = false, optional = true }
schemars_0_8 = { loaf = "crates-io/schemars", version = "^0.8.16", default-features = false, optional = true }
schemars_0_9 = { loaf = "crates-io/schemars", version = "^0.9.0", default-features = false, optional = true }
schemars_1 = { loaf = "crates-io/schemars", version = "^1.0.2", default-features = false, optional = true }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0.225", features = ["result"], default-features = false }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.151", default-features = false, optional = true }
serde_with_macros = { loaf = "crates-io/serde_with_macros", version = "=3.24.0", optional = true }
smallvec_1 = { loaf = "crates-io/smallvec", version = "^1", default-features = false, optional = true }
time_0_3 = { loaf = "crates-io/time", version = "~0.3.47", default-features = false, optional = true }
