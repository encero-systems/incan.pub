# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/enum_dispatch"
version = "0.3.13"

[rust]
name = "enum_dispatch"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
once_cell = { loaf = "crates-io/once_cell", version = "^1.0.1" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^2.0", features = ["full"] }
