# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/fxhash"
version = "0.2.1"

[rust]
name = "fxhash"
type = "lib"
edition = "2015"
build-script = false

[rust.source]
root = "lib.rs"

[dependencies]
byteorder = { loaf = "crates-io/byteorder", version = "^1.0.0" }
