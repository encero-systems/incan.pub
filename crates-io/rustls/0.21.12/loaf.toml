# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rustls"
version = "0.21.12"

[project.features]
dangerous_configuration = []
default = ["logging", "tls12"]
log = ["dep:log"]
logging = ["log"]
quic = []
read_buf = ["rustversion"]
rustversion = []
secret_extraction = []
tls12 = []

[rust]
name = "rustls"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
log = { loaf = "crates-io/log", version = "^0.4.4", optional = true }
ring = { loaf = "crates-io/ring", version = "^0.17" }
sct = { loaf = "crates-io/sct", version = "^0.7.0" }
webpki = { loaf = "crates-io/rustls-webpki", version = "^0.101.7", features = ["alloc", "std"] }
