# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/arrow-cast"
version = "60.0.0"

[project.features]
comfy-table = ["dep:comfy-table"]
prettyprint = ["comfy-table"]

[rust]
name = "arrow_cast"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arrow-array = { loaf = "crates-io/arrow-array", version = "^60.0.0" }
arrow-buffer = { loaf = "crates-io/arrow-buffer", version = "^60.0.0" }
arrow-data = { loaf = "crates-io/arrow-data", version = "^60.0.0" }
arrow-ord = { loaf = "crates-io/arrow-ord", version = "^60.0.0" }
arrow-schema = { loaf = "crates-io/arrow-schema", version = "^60.0.0" }
arrow-select = { loaf = "crates-io/arrow-select", version = "^60.0.0" }
atoi = { loaf = "crates-io/atoi", version = "^3.1.0" }
base64 = { loaf = "crates-io/base64", version = "^0.23" }
chrono = { loaf = "crates-io/chrono", version = "^0.4.40", features = ["clock"], default-features = false }
comfy-table = { loaf = "crates-io/comfy-table", version = "^8", default-features = false, optional = true }
half = { loaf = "crates-io/half", version = "^2.1", default-features = false }
lexical-core = { loaf = "crates-io/lexical-core", version = "^1.0", features = ["parse-floats", "parse-integers", "write-floats", "write-integers"], default-features = false }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.19", features = ["std"], default-features = false }
ryu = { loaf = "crates-io/ryu", version = "^1.0.16" }
