# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/similar"
version = "3.2.0"

[project.features]
bstr = ["dep:bstr"]
bytes = ["bstr", "text"]
default = ["std", "text"]
hashbrown = ["dep:hashbrown"]
inline = ["text"]
serde = ["dep:serde"]
std = ["bstr?/std"]
text = []
unicode = ["text", "unicode-segmentation", "bstr?/unicode"]
unicode-segmentation = ["dep:unicode-segmentation"]
wasm32_web_time = ["web-time"]
web-time = ["dep:web-time"]

[rust]
name = "similar"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bstr = { loaf = "crates-io/bstr", version = "^1.5.0", default-features = false, optional = true }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.15", features = ["default-hasher"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.130", features = ["alloc", "derive"], default-features = false, optional = true }
unicode-segmentation = { loaf = "crates-io/unicode-segmentation", version = "^1.7.1", optional = true }
web-time = { loaf = "crates-io/web-time", version = "^1.1", optional = true }
