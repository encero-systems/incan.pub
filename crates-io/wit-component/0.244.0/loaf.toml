# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wit-component"
version = "0.244.0"

[project.features]
dummy-module = ["dep:wat"]
semver-check = ["dummy-module"]
wat = ["dep:wast", "dep:wat"]

[rust]
name = "wit_component"
type = "lib"
edition = "2021"

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.58" }
bitflags = { loaf = "crates-io/bitflags", version = "^2.3.3" }
indexmap = { loaf = "crates-io/indexmap", version = "^2.7.0", default-features = false }
log = { loaf = "crates-io/log", version = "^0.4.17" }
serde = { loaf = "crates-io/serde", version = "^1.0.166", features = ["alloc"], default-features = false }
serde_derive = { loaf = "crates-io/serde_derive", version = "^1.0.166" }
serde_json = { loaf = "crates-io/serde_json", version = "^1" }
wasm-encoder = { loaf = "crates-io/wasm-encoder", version = "^0.244.0", features = ["std", "wasmparser"], default-features = false }
wasm-metadata = { loaf = "crates-io/wasm-metadata", version = "^0.244.0", default-features = false }
wasmparser = { loaf = "crates-io/wasmparser", version = "^0.244.0", features = ["component-model", "simd", "std"], default-features = false }
wast = { loaf = "crates-io/wast", version = "^244.0.0", default-features = false, optional = true }
wat = { loaf = "crates-io/wat", version = "^1.244.0", default-features = false, optional = true }
wit-parser = { loaf = "crates-io/wit-parser", version = "^0.244.0", features = ["decoding", "serde"] }
