# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/spki"
version = "0.8.1"

[project.features]
alloc = ["base64ct?/alloc", "der/alloc"]
arbitrary = ["std", "dep:arbitrary", "der/arbitrary"]
base64 = ["dep:base64ct"]
digest = ["dep:digest"]
fingerprint = ["digest", "sha2"]
pem = ["alloc", "der/pem"]
sha2 = ["dep:sha2"]
std = ["der/std", "alloc"]

[rust]
name = "spki"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.4", features = ["derive"], optional = true }
base64ct = { loaf = "crates-io/base64ct", version = "^1", default-features = false, optional = true }
der = { loaf = "crates-io/der", version = "^0.8.2", features = ["oid"] }
digest = { loaf = "crates-io/digest", version = "^0.11", default-features = false, optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.11", default-features = false, optional = true }
