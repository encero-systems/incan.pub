# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/idna_adapter"
version = "1.2.1"

[project.features]
compiled_data = ["icu_normalizer/compiled_data", "icu_properties/compiled_data"]

[rust]
name = "idna_adapter"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
icu_normalizer = { loaf = "crates-io/icu_normalizer", version = "^2", default-features = false }
icu_properties = { loaf = "crates-io/icu_properties", version = "^2", default-features = false }
