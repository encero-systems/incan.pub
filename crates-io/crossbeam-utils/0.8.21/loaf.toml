# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/crossbeam-utils"
version = "0.8.21"

[project.features]
default = ["std"]
loom = ["dep:loom"]
nightly = []
std = []

[rust]
name = "crossbeam_utils"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
loom = { loaf = "crates-io/loom", version = "^0.7.1", optional = true, target = "cfg(crossbeam_loom)" }
