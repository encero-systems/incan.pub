# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/crossbeam-utils"
version = "0.8.21"

[project.features]
default = ["std"]
loom = ["dep:loom"]
nightly = []
std = []

[rust]
name = "crossbeam_utils"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
loom = { loaf = "crates-io/loom", version = "^0.7.1", optional = true, target = "cfg(crossbeam_loom)" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default", "std"]
cfg = []
