# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/scroll"
version = "0.13.0"

[project.features]
default = ["std"]
derive = ["dep:scroll_derive"]
std = []

[rust]
name = "scroll"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
scroll_derive = { loaf = "crates-io/scroll_derive", version = "^0.13", optional = true }
