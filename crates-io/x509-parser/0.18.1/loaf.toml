# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/x509-parser"
version = "0.18.1"

[project.features]
aws-lc-rs = ["dep:aws-lc-rs"]
default = []
ring = ["dep:ring"]
validate = []
verify = ["ring"]
verify-aws = ["aws-lc-rs"]

[rust]
name = "x509_parser"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
asn1-rs = { loaf = "crates-io/asn1-rs", version = "^0.7.0", features = ["datetime"] }
aws-lc-rs = { loaf = "crates-io/aws-lc-rs", version = "^1.0", optional = true }
data-encoding = { loaf = "crates-io/data-encoding", version = "^2.2.1" }
der-parser = { loaf = "crates-io/der-parser", version = "^10.0", features = ["bigint"] }
lazy_static = { loaf = "crates-io/lazy_static", version = "^1.4" }
nom = { loaf = "crates-io/nom", version = "^7.0" }
oid-registry = { loaf = "crates-io/oid-registry", version = "^0.8.1", features = ["crypto", "x509", "x962"] }
ring = { loaf = "crates-io/ring", version = "^0.17.12", optional = true }
rusticata-macros = { loaf = "crates-io/rusticata-macros", version = "^4.0" }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0" }
time = { loaf = "crates-io/time", version = "^0.3.35", features = ["formatting"] }
