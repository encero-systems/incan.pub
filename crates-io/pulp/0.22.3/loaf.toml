# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/pulp"
version = "0.22.3"

[project.features]
default = ["std", "x86-v3", "relaxed-simd"]
macro = ["dep:pulp-macro"]
nightly = ["bytemuck/nightly_stdsimd"]
relaxed-simd = ["pulp-wasm-simd-flag/relaxed-simd"]
std = []
x86-v3 = []
x86-v4 = ["bytemuck/avx512_simd"]

[rust]
name = "pulp"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
bytemuck = { loaf = "crates-io/bytemuck", version = "^1.15", features = ["aarch64_simd", "wasm_simd"] }
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.0" }
libm = { loaf = "crates-io/libm", version = "^0.2", default-features = false }
num-complex = { loaf = "crates-io/num-complex", version = "^0.4.4", features = ["bytemuck"], default-features = false }
paste = { loaf = "crates-io/paste", version = "^1" }
pulp-macro = { loaf = "crates-io/pulp-macro", version = "^0.1.1", optional = true }
pulp-wasm-simd-flag = { loaf = "crates-io/pulp-wasm-simd-flag", version = "^0.1.1", default-features = false }
raw-cpuid = { loaf = "crates-io/raw-cpuid", version = "^11.5.0", default-features = false, target = "cfg(any(target_arch = \"x86\", target_arch = \"x86_64\"))" }
reborrow = { loaf = "crates-io/reborrow", version = "^0.5" }
