# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/thin-vec"
version = "0.2.16"

[project.features]
const_new = []
default = ["std"]
gecko-ffi = []
malloc_size_of = ["dep:malloc_size_of"]
serde = ["dep:serde"]
std = []
unstable = []

[rust]
name = "thin_vec"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
malloc_size_of = { loaf = "crates-io/malloc_size_of", version = "^0.1", default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
