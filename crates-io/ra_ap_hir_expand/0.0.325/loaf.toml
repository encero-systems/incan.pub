# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra_ap_hir_expand"
version = "0.0.325"

[project.features]
in-rust-tree = ["syntax/in-rust-tree"]

[rust]
name = "ra_ap_hir_expand"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arrayvec = { loaf = "crates-io/arrayvec", version = "^0.7.6" }
base-db = { loaf = "crates-io/ra_ap_base_db", version = "=0.0.325" }
cfg = { loaf = "crates-io/ra_ap_cfg", version = "=0.0.325", features = ["syntax", "tt"] }
cov-mark = { loaf = "crates-io/cov-mark", version = "^2.0.0" }
either = { loaf = "crates-io/either", version = "^1.15.0" }
intern = { loaf = "crates-io/ra_ap_intern", version = "=0.0.325" }
itertools = { loaf = "crates-io/itertools", version = "^0.14.0" }
mbe = { loaf = "crates-io/ra_ap_mbe", version = "=0.0.325" }
parser = { loaf = "crates-io/ra_ap_parser", version = "=0.0.325" }
query-group = { loaf = "crates-io/ra_ap_query-group-macro", version = "=0.0.325" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.1.1" }
salsa = { loaf = "crates-io/salsa", version = "^0.25.2", features = ["inventory", "macros", "rayon", "salsa_unstable"], default-features = false }
salsa-macros = { loaf = "crates-io/salsa-macros", version = "^0.25.2" }
smallvec = { loaf = "crates-io/smallvec", version = "^1.15.1", features = ["const_generics", "const_new", "union"] }
span = { loaf = "crates-io/ra_ap_span", version = "=0.0.325" }
stdx = { loaf = "crates-io/ra_ap_stdx", version = "=0.0.325" }
syntax = { loaf = "crates-io/ra_ap_syntax", version = "=0.0.325" }
syntax-bridge = { loaf = "crates-io/ra_ap_syntax-bridge", version = "=0.0.325" }
thin-vec = { loaf = "crates-io/thin-vec", version = "^0.2.14" }
tracing = { loaf = "crates-io/tracing", version = "^0.1.41", features = ["std"], default-features = false }
triomphe = { loaf = "crates-io/triomphe", version = "^0.1.14", features = ["std"], default-features = false }
tt = { loaf = "crates-io/ra_ap_tt", version = "=0.0.325" }
