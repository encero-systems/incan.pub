# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/mio"
version = "1.2.4"

[project.features]
default = ["log"]
log = ["dep:log"]
net = []
os-ext = ["os-poll", "windows-sys/Win32_System_Pipes", "windows-sys/Win32_Security"]
os-poll = []

[rust]
name = "mio"
type = "lib"
edition = "2021"

[dependencies]
libc = { loaf = "crates-io/libc", version = "^0.2.183", target = "cfg(any(unix, target_os = \"hermit\", target_os = \"wasi\"))" }
log = { loaf = "crates-io/log", version = "^0.4.8", optional = true }
wasi = { loaf = "crates-io/wasi", version = "^0.11.0", target = "cfg(target_os = \"wasi\")" }
windows-sys = { loaf = "crates-io/windows-sys", version = "^0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_IO", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_WindowsProgramming"], target = "cfg(windows)" }
