# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/objc2-core-foundation"
version = "0.3.2"

[project.features]
CFArray = []
CFAttributedString = []
CFAvailability = []
CFBag = []
CFBase = []
CFBinaryHeap = []
CFBitVector = []
CFBundle = []
CFByteOrder = []
CFCGTypes = []
CFCalendar = ["bitflags"]
CFCharacterSet = []
CFData = ["bitflags"]
CFDate = ["bitflags"]
CFDateFormatter = ["bitflags"]
CFDictionary = []
CFError = []
CFFileDescriptor = []
CFFileSecurity = ["bitflags"]
CFLocale = []
CFMachPort = []
CFMessagePort = []
CFNotificationCenter = []
CFNumber = []
CFNumberFormatter = ["bitflags"]
CFPlugIn = []
CFPlugInCOM = []
CFPreferences = []
CFPropertyList = ["bitflags"]
CFRunLoop = ["bitflags"]
CFSet = []
CFSocket = ["bitflags"]
CFStream = ["bitflags"]
CFString = ["bitflags"]
CFStringEncodingExt = []
CFStringTokenizer = ["bitflags"]
CFTimeZone = []
CFTree = []
CFURL = ["bitflags"]
CFURLAccess = []
CFURLEnumerator = ["bitflags"]
CFUUID = []
CFUserNotification = []
CFUtilities = []
CFXMLNode = []
CFXMLParser = ["bitflags"]
alloc = []
bitflags = ["dep:bitflags"]
block2 = ["dep:block2"]
default = ["std", "CFArray", "CFAttributedString", "CFAvailability", "CFBag", "CFBinaryHeap", "CFBitVector", "CFBundle", "CFByteOrder", "CFCGTypes", "CFCalendar", "CFCharacterSet", "CFData", "CFDate", "CFDateFormatter", "CFDictionary", "CFError", "CFFileDescriptor", "CFFileSecurity", "CFLocale", "CFMachPort", "CFMessagePort", "CFNotificationCenter", "CFNumber", "CFNumberFormatter", "CFPlugIn", "CFPlugInCOM", "CFPreferences", "CFPropertyList", "CFRunLoop", "CFSet", "CFSocket", "CFStream", "CFString", "CFStringEncodingExt", "CFStringTokenizer", "CFTimeZone", "CFTree", "CFURL", "CFURLAccess", "CFURLEnumerator", "CFUUID", "CFUserNotification", "CFUtilities", "CFXMLNode", "CFXMLParser", "bitflags", "block2", "dispatch2", "libc", "objc2"]
dispatch2 = ["dep:dispatch2"]
libc = ["dep:libc"]
objc2 = ["dep:objc2", "dispatch2?/objc2"]
std = ["alloc"]
unstable-coerce-pointee = []
unstable-darwin-objc = []

[rust]
name = "objc2_core_foundation"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.5.0", features = ["std"], default-features = false, optional = true }
block2 = { loaf = "crates-io/block2", version = ">=0.6.1, <0.8.0", features = ["alloc"], default-features = false, optional = true }
dispatch2 = { loaf = "crates-io/dispatch2", version = ">=0.3.0, <0.5.0", features = ["alloc"], default-features = false, optional = true }
libc = { loaf = "crates-io/libc", version = "^0.2.80", default-features = false, optional = true }
objc2 = { loaf = "crates-io/objc2", version = ">=0.6.2, <0.8.0", features = ["std"], default-features = false, optional = true }
