# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/kqueue-sys"
version = "1.1.2"

[rust]
name = "kqueue_sys"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.11.0", default-features = false }
libc = { loaf = "crates-io/libc", version = "^0.2.74" }
