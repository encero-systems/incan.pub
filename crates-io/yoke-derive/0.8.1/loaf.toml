# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/yoke-derive"
version = "0.8.1"

[rust]
name = "yoke_derive"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.61" }
quote = { loaf = "crates-io/quote", version = "^1.0.28" }
syn = { loaf = "crates-io/syn", version = "^2.0.21", features = ["fold"] }
synstructure = { loaf = "crates-io/synstructure", version = "^0.13.0" }
