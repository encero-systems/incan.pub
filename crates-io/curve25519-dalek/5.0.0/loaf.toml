# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/curve25519-dalek"
version = "5.0.0"

[project.features]
alloc = ["zeroize?/alloc"]
default = ["alloc", "precomputed-tables", "zeroize"]
digest = ["dep:digest"]
ff = ["dep:ff"]
group = ["dep:group", "rand_core"]
legacy_compatibility = []
lizard = ["digest"]
precomputed-tables = []
rand_core = ["dep:rand_core", "dep:digest", "digest/rand_core"]
serde = ["dep:serde"]
zeroize = ["dep:zeroize"]

[rust]
name = "curve25519_dalek"
type = "lib"
edition = "2024"
build-script = true

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1" }
cpufeatures = { loaf = "crates-io/cpufeatures", version = "^0.3", target = "cfg(target_arch = \"x86_64\")" }
curve25519-dalek-derive = { loaf = "crates-io/curve25519-dalek-derive", version = "^0.1", target = "cfg(all(not(curve25519_dalek_backend = \"fiat\"), not(curve25519_dalek_backend = \"serial\"), target_arch = \"x86_64\"))" }
digest = { loaf = "crates-io/digest", version = "^0.11", features = ["block-api"], default-features = false, optional = true }
ff = { loaf = "crates-io/ff", version = "^0.14", default-features = false, optional = true }
fiat-crypto = { loaf = "crates-io/fiat-crypto", version = "^0.3.0", default-features = false, target = "cfg(curve25519_dalek_backend = \"fiat\")" }
group = { loaf = "crates-io/group", version = "^0.14", default-features = false, optional = true }
rand_core = { loaf = "crates-io/rand_core", version = "^0.10", default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive"], default-features = false, optional = true }
subtle = { loaf = "crates-io/subtle", version = "^2.6.0", features = ["const-generics"], default-features = false }
zeroize = { loaf = "crates-io/zeroize", version = "^1", default-features = false, optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["alloc", "default", "precomputed-tables", "zeroize"]
cfg = ["curve25519_dalek_backend=\"serial\"", "curve25519_dalek_bits=\"64\""]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["digest", "precomputed-tables", "zeroize"]
