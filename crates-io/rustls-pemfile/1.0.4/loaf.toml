# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rustls-pemfile"
version = "1.0.4"

[rust]
name = "rustls_pemfile"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
base64 = { loaf = "crates-io/base64", version = "^0.21" }
