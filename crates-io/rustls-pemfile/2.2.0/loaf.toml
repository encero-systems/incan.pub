# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rustls-pemfile"
version = "2.2.0"

[project.features]
default = ["std"]
std = ["pki-types/std"]

[rust]
name = "rustls_pemfile"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
pki-types = { loaf = "crates-io/rustls-pki-types", version = "^1.9" }
