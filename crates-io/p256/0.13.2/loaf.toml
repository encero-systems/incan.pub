# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/p256"
version = "0.13.2"

[project.features]
alloc = ["ecdsa-core?/alloc", "elliptic-curve/alloc"]
arithmetic = ["dep:primeorder", "elliptic-curve/arithmetic"]
bits = ["arithmetic", "elliptic-curve/bits"]
default = ["arithmetic", "ecdsa", "pem", "std"]
digest = ["dep:ecdsa-core", "ecdsa-core/digest", "ecdsa-core/hazmat"]
ecdh = ["arithmetic", "elliptic-curve/ecdh"]
ecdsa = ["arithmetic", "dep:ecdsa-core", "ecdsa-core/signing", "ecdsa-core/verifying", "sha256"]
ecdsa-core = ["dep:ecdsa-core"]
expose-field = ["arithmetic"]
hash2curve = ["arithmetic", "elliptic-curve/hash2curve"]
jwk = ["elliptic-curve/jwk"]
pem = ["elliptic-curve/pem", "dep:ecdsa-core", "ecdsa-core/pem", "pkcs8"]
pkcs8 = ["ecdsa-core?/pkcs8", "elliptic-curve/pkcs8"]
serde = ["ecdsa-core?/serde", "elliptic-curve/serde", "primeorder?/serde", "serdect"]
serdect = ["dep:serdect"]
sha2 = ["dep:sha2"]
sha256 = ["digest", "sha2"]
std = ["alloc", "ecdsa-core?/std", "elliptic-curve/std"]
test-vectors = ["dep:hex-literal"]
voprf = ["elliptic-curve/voprf", "sha2"]

[rust]
name = "p256"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
ecdsa-core = { loaf = "crates-io/ecdsa", version = "^0.16", features = ["der"], default-features = false, optional = true }
elliptic-curve = { loaf = "crates-io/elliptic-curve", version = "^0.13.1", features = ["hazmat", "sec1"], default-features = false }
hex-literal = { loaf = "crates-io/hex-literal", version = "^0.4", optional = true }
primeorder = { loaf = "crates-io/primeorder", version = "^0.13", optional = true }
serdect = { loaf = "crates-io/serdect", version = "^0.2", default-features = false, optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.10", default-features = false, optional = true }
