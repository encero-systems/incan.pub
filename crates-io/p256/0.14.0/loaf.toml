# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/p256"
version = "0.14.0"

[project.features]
alloc = ["ecdsa-core?/alloc", "elliptic-curve/alloc", "primeorder?/alloc"]
arithmetic = ["dep:primefield", "dep:primeorder", "elliptic-curve/arithmetic"]
default = ["arithmetic", "ecdsa", "pem", "precomputed-tables", "std"]
digest = ["dep:ecdsa-core", "ecdsa-core/digest"]
ecdh = ["arithmetic", "elliptic-curve/ecdh"]
ecdsa = ["arithmetic", "dep:ecdsa-core", "ecdsa-core/algorithm", "sha256"]
ecdsa-core = ["dep:ecdsa-core"]
getrandom = ["elliptic-curve/getrandom"]
group-digest = ["hash2curve", "sha2"]
hash2curve = ["arithmetic", "dep:hash2curve", "dep:primeorder", "primeorder/hash2curve"]
oprf = ["group-digest"]
pem = ["elliptic-curve/pem", "dep:ecdsa-core", "ecdsa-core/pem", "pkcs8"]
pkcs8 = ["ecdsa-core?/pkcs8", "elliptic-curve/pkcs8"]
precomputed-tables = ["arithmetic", "dep:primeorder", "primeorder/basepoint-table"]
serde = ["ecdsa-core?/serde", "elliptic-curve/serde", "primeorder?/serde", "serdect"]
serdect = ["dep:serdect"]
sha2 = ["dep:sha2"]
sha256 = ["digest", "sha2"]
std = ["alloc", "ecdsa-core?/std", "elliptic-curve/std", "getrandom", "primeorder?/std"]
test-vectors = ["dep:hex-literal"]

[rust]
name = "p256"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
ecdsa-core = { loaf = "crates-io/ecdsa", version = "^0.17", features = ["der"], default-features = false, optional = true }
elliptic-curve = { loaf = "crates-io/elliptic-curve", version = "^0.14.1", features = ["sec1"], default-features = false }
hash2curve = { loaf = "crates-io/hash2curve", version = "^0.14", optional = true }
hex-literal = { loaf = "crates-io/hex-literal", version = "^1", optional = true }
primefield = { loaf = "crates-io/primefield", version = "^0.14", optional = true }
primeorder = { loaf = "crates-io/primeorder", version = "^0.14", optional = true }
serdect = { loaf = "crates-io/serdect", version = "^0.4", default-features = false, optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.11", default-features = false, optional = true }
