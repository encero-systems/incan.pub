# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/oxc_syntax"
version = "0.155.0"

[project.features]
default = []
serialize = ["bitflags/serde", "dep:serde", "oxc_estree/serialize"]
to_js_string = ["dep:dragonbox_ecma"]

[rust]
name = "oxc_syntax"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.13.0" }
cow-utils = { loaf = "crates-io/cow-utils", version = "^0.1.3" }
dragonbox_ecma = { loaf = "crates-io/dragonbox_ecma", version = "^0.1.12", optional = true }
nonmax = { loaf = "crates-io/nonmax", version = "^0.5.5" }
oxc_allocator = { loaf = "crates-io/oxc_allocator", version = "^0.155.0" }
oxc_ast_macros = { loaf = "crates-io/oxc_ast_macros", version = "^0.155.0" }
oxc_estree = { loaf = "crates-io/oxc_estree", version = "^0.155.0" }
oxc_index = { loaf = "crates-io/oxc_index", version = "^5.0.0", features = ["nonmax", "serde"] }
oxc_span = { loaf = "crates-io/oxc_span", version = "^0.155.0" }
oxc_str = { loaf = "crates-io/oxc_str", version = "^0.155.0" }
phf = { loaf = "crates-io/phf", version = "^0.14.0", features = ["macros"] }
serde = { loaf = "crates-io/serde", version = "^1", features = ["derive"], optional = true }
unicode-id-start = { loaf = "crates-io/unicode-id-start", version = "^1" }
