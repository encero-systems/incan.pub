# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasip3"
version = "0.9.0+wasi-0.3.0"

[project.features]
alloc = ["dep:alloc"]
async-spawn = ["wit-bindgen/async-spawn"]
bitflags = ["wit-bindgen/bitflags"]
core = ["dep:core"]
default = ["std", "bitflags"]
http-compat = ["dep:bytes", "dep:http-body", "dep:http", "dep:thiserror", "async-spawn"]
rustc-dep-of-std = ["core", "alloc", "wit-bindgen/rustc-dep-of-std"]
std = []
wit-bindgen-macros = ["wit-bindgen/macros"]

[rust]
name = "wasip3"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
alloc = { loaf = "crates-io/rustc-std-workspace-alloc", version = "^1.0", optional = true }
bytes = { loaf = "crates-io/bytes", version = "^1.10.1", optional = true }
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0", optional = true }
http = { loaf = "crates-io/http", version = "^1.3.1", optional = true }
http-body = { loaf = "crates-io/http-body", version = "^1.0.1", optional = true }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.17", optional = true }
wit-bindgen = { loaf = "crates-io/wit-bindgen", version = "^0.62.0", features = ["async"], default-features = false }
