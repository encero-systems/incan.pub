# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasip3"
version = "0.4.0+wasi-0.3.0-rc-2026-01-06"

[project.features]
http-compat = ["dep:bytes", "dep:http-body", "dep:http", "dep:thiserror", "wit-bindgen/async-spawn"]

[rust]
name = "wasip3"
type = "lib"
edition = "2021"

[dependencies]
bytes = { loaf = "crates-io/bytes", version = "^1.10.1", optional = true }
http = { loaf = "crates-io/http", version = "^1.3.1", optional = true }
http-body = { loaf = "crates-io/http-body", version = "^1.0.1", optional = true }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.17", optional = true }
wit-bindgen = { loaf = "crates-io/wit-bindgen", version = "^0.51.0", features = ["async"], default-features = false }
