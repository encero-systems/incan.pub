# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/pkcs8"
version = "0.11.0"

[project.features]
3des = ["encryption", "dep:pkcs5", "pkcs5/3des"]
alloc = ["der/alloc", "der/zeroize", "spki/alloc"]
ctutils = ["dep:ctutils"]
des-insecure = ["encryption", "dep:pkcs5", "pkcs5/des-insecure"]
encryption = ["alloc", "dep:pkcs5", "pkcs5/alloc", "pkcs5/pbes2", "dep:rand_core"]
getrandom = ["encryption", "dep:pkcs5", "pkcs5/getrandom", "dep:getrandom"]
pem = ["alloc", "der/pem", "spki/pem"]
pkcs5 = ["dep:pkcs5"]
sha1-insecure = ["encryption", "dep:pkcs5", "pkcs5/sha1-insecure"]
std = ["alloc", "der/std", "spki/std"]

[rust]
name = "pkcs8"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
ctutils = { loaf = "crates-io/ctutils", version = "^0.4", optional = true }
der = { loaf = "crates-io/der", version = "^0.8.0-rc.12", features = ["oid"] }
getrandom = { loaf = "crates-io/getrandom", version = "^0.4", features = ["sys_rng"], optional = true }
pkcs5 = { loaf = "crates-io/pkcs5", version = "^0.8", features = ["rand_core"], optional = true }
rand_core = { loaf = "crates-io/rand_core", version = "^0.10", default-features = false, optional = true }
spki = { loaf = "crates-io/spki", version = "^0.8" }
