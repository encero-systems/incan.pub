# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/reqwest"
version = "0.13.5"

[project.features]
__native-tls = ["dep:hyper-tls", "dep:native-tls-crate", "__tls", "dep:tokio-native-tls"]
__native-tls-alpn = ["native-tls-crate?/alpn", "hyper-tls?/alpn"]
__rustls = ["dep:hyper-rustls", "dep:tokio-rustls", "dep:rustls", "__tls"]
__rustls-aws-lc-rs = ["hyper-rustls?/aws-lc-rs", "tokio-rustls?/aws-lc-rs", "rustls?/aws-lc-rs", "quinn?/rustls-aws-lc-rs"]
__tls = ["dep:rustls-pki-types", "tokio/io-util"]
blocking = ["dep:futures-channel", "futures-channel?/sink", "dep:futures-util", "futures-util?/io", "futures-util?/sink", "tokio/sync"]
brotli = ["tower-http/decompression-br"]
charset = ["dep:encoding_rs", "dep:mime"]
cookies = ["dep:cookie_crate", "dep:cookie_store"]
default = ["default-tls", "charset", "http2", "system-proxy"]
default-tls = ["rustls"]
deflate = ["tower-http/decompression-deflate"]
form = ["dep:serde", "dep:serde_urlencoded"]
gzip = ["tower-http/decompression-gzip"]
hickory-dns = ["dep:hickory-resolver", "dep:once_cell"]
http2 = ["dep:h2", "hyper/http2", "hyper-util/http2", "hyper-rustls?/http2"]
http3 = ["rustls", "dep:h3", "dep:h3-quinn", "dep:quinn", "tokio/macros"]
json = ["dep:serde", "dep:serde_json"]
multipart = ["dep:mime_guess", "dep:futures-util"]
native-tls = ["__native-tls", "__native-tls-alpn"]
native-tls-no-alpn = ["__native-tls"]
native-tls-vendored = ["__native-tls", "native-tls-crate?/vendored", "__native-tls-alpn"]
native-tls-vendored-no-alpn = ["__native-tls", "native-tls-crate?/vendored"]
query = ["dep:serde", "dep:serde_urlencoded"]
rustls = ["__rustls-aws-lc-rs", "dep:rustls-platform-verifier", "__rustls"]
rustls-no-provider = ["dep:rustls-platform-verifier", "__rustls"]
socks = []
stream = ["tokio/fs", "dep:futures-util", "dep:tokio-util", "dep:wasm-streams"]
system-proxy = ["hyper-util/client-proxy-system"]
zstd = ["tower-http/decompression-zstd"]

[rust]
name = "reqwest"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
base64 = { loaf = "crates-io/base64", version = "^0.23" }
bytes = { loaf = "crates-io/bytes", version = "^1.2" }
cookie_crate = { loaf = "crates-io/cookie", version = "^0.18.0", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
cookie_store = { loaf = "crates-io/cookie_store", version = "^0.22.0", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
encoding_rs = { loaf = "crates-io/encoding_rs", version = "^0.8", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
futures-channel = { loaf = "crates-io/futures-channel", version = "^0.3", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
futures-core = { loaf = "crates-io/futures-core", version = "^0.3.28", default-features = false }
futures-util = { loaf = "crates-io/futures-util", version = "^0.3.28", default-features = false, optional = true }
h2 = { loaf = "crates-io/h2", version = "^0.4", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
h3 = { loaf = "crates-io/h3", version = "^0.0.8", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
h3-quinn = { loaf = "crates-io/h3-quinn", version = "^0.0.10", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
hickory-resolver = { loaf = "crates-io/hickory-resolver", version = "^0.26", features = ["tokio"], optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
http = { loaf = "crates-io/http", version = "^1.1" }
http-body = { loaf = "crates-io/http-body", version = "^1", target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
http-body-util = { loaf = "crates-io/http-body-util", version = "^0.1.2", target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
hyper = { loaf = "crates-io/hyper", version = "^1.1", features = ["client", "http1"], target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
hyper-rustls = { loaf = "crates-io/hyper-rustls", version = "^0.27.0", features = ["http1", "tls12"], default-features = false, optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
hyper-tls = { loaf = "crates-io/hyper-tls", version = "^0.6", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
hyper-util = { loaf = "crates-io/hyper-util", version = "^0.1.12", features = ["client", "client-legacy", "client-proxy", "http1", "tokio"], target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
js-sys = { loaf = "crates-io/js-sys", version = "^0.3.77", target = "cfg(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\")))" }
log = { loaf = "crates-io/log", version = "^0.4.17", target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
mime = { loaf = "crates-io/mime", version = "^0.3.16", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
mime_guess = { loaf = "crates-io/mime_guess", version = "^2.0", default-features = false, optional = true }
native-tls-crate = { loaf = "crates-io/native-tls", version = "^0.2.16", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
once_cell = { loaf = "crates-io/once_cell", version = "^1.18", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.3", target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.11", target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
quinn = { loaf = "crates-io/quinn", version = "^0.11.1", features = ["runtime-tokio"], default-features = false, optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
rustls = { loaf = "crates-io/rustls", version = "^0.23.4", features = ["std", "tls12"], default-features = false, optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
rustls-pki-types = { loaf = "crates-io/rustls-pki-types", version = "^1.9.0", features = ["std"], optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
rustls-platform-verifier = { loaf = "crates-io/rustls-platform-verifier", version = ">=0.6.0, <0.8.0", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0", optional = true }
serde_urlencoded = { loaf = "crates-io/serde_urlencoded", version = "^0.7.1", optional = true }
sync_wrapper = { loaf = "crates-io/sync_wrapper", version = "^1.0", features = ["futures"] }
tokio = { loaf = "crates-io/tokio", version = "^1.0", features = ["net", "time"], default-features = false, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
tokio-native-tls = { loaf = "crates-io/tokio-native-tls", version = "^0.3.0", optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
tokio-rustls = { loaf = "crates-io/tokio-rustls", version = "^0.26", features = ["tls12"], default-features = false, optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
tokio-util = { loaf = "crates-io/tokio-util", version = "^0.7.9", features = ["io"], default-features = false, optional = true, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
tower = { loaf = "crates-io/tower", version = "^0.5.2", features = ["retry", "timeout", "util"], default-features = false, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
tower-http = { loaf = "crates-io/tower-http", version = "^0.6.8", features = ["follow-redirect"], default-features = false, target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
tower-service = { loaf = "crates-io/tower-service", version = "^0.3", target = "cfg(not(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\"))))" }
url = { loaf = "crates-io/url", version = "^2.4" }
wasm-bindgen = { loaf = "crates-io/wasm-bindgen", version = "^0.2.89", target = "cfg(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\")))" }
wasm-bindgen-futures = { loaf = "crates-io/wasm-bindgen-futures", version = "^0.4.18", target = "cfg(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\")))" }
wasm-streams = { loaf = "crates-io/wasm-streams", version = "^0.5", optional = true, target = "cfg(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\")))" }
web-sys = { loaf = "crates-io/web-sys", version = "^0.3.28", features = ["AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "File", "FormData", "Headers", "ReadableStream", "ReferrerPolicy", "Request", "RequestCache", "RequestCredentials", "RequestInit", "RequestMode", "Response", "ServiceWorkerGlobalScope", "Window"], target = "cfg(all(target_arch = \"wasm32\", any(target_os = \"unknown\", target_os = \"none\")))" }
