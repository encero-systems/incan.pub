# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/zvariant_derive"
version = "5.15.0"

[project.features]
default = []
gvariant = ["zvariant_utils/gvariant"]

[rust]
name = "zvariant_derive"
type = "proc-macro"
edition = "2024"
build-script = false

[dependencies]
proc-macro-crate = { loaf = "crates-io/proc-macro-crate", version = "^3.2.0" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.81" }
quote = { loaf = "crates-io/quote", version = "^1.0.36" }
syn = { loaf = "crates-io/syn", version = "^3.0", features = ["extra-traits", "full"] }
zvariant_utils = { loaf = "crates-io/zvariant_utils", version = "^4.2.0" }
