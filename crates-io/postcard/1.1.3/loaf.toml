# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/postcard"
version = "1.1.3"

[project.features]
alloc = ["serde/alloc", "embedded-io-04?/alloc", "embedded-io-06?/alloc"]
core-num-saturating = []
crc = ["dep:crc"]
default = ["heapless-cas"]
defmt = ["dep:defmt"]
embedded-io = ["dep:embedded-io-04"]
embedded-io-04 = ["dep:embedded-io-04"]
embedded-io-06 = ["dep:embedded-io-06"]
experimental-derive = ["postcard-derive"]
heapless = ["dep:heapless"]
heapless-cas = ["heapless", "dep:heapless", "heapless/cas"]
nalgebra-v0_33 = ["nalgebra_v0_33"]
nalgebra_v0_33 = ["dep:nalgebra_v0_33"]
paste = []
postcard-derive = ["dep:postcard-derive"]
use-crc = ["crc"]
use-defmt = ["defmt"]
use-std = ["serde/std", "alloc"]

[rust]
name = "postcard"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
cobs = { loaf = "crates-io/cobs", version = "^0.3.0", default-features = false }
crc = { loaf = "crates-io/crc", version = "^3.0.1", optional = true }
defmt = { loaf = "crates-io/defmt", version = "^1", optional = true }
embedded-io-04 = { loaf = "crates-io/embedded-io", version = "^0.4", optional = true }
embedded-io-06 = { loaf = "crates-io/embedded-io", version = "^0.6", optional = true }
heapless = { loaf = "crates-io/heapless", version = "^0.7.0", features = ["serde"], default-features = false, optional = true }
nalgebra_v0_33 = { loaf = "crates-io/nalgebra", version = "^0.33.0", default-features = false, optional = true }
postcard-derive = { loaf = "crates-io/postcard-derive", version = "^0.2.0", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.100", features = ["derive"], default-features = false }
