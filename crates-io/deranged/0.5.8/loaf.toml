# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/deranged"
version = "0.5.8"

[project.features]
alloc = []
default = []
macros = ["dep:deranged-macros"]
num = ["dep:num-traits"]
powerfmt = ["dep:powerfmt"]
quickcheck = ["dep:quickcheck", "alloc"]
rand = ["rand08", "rand09", "rand010"]
rand010 = ["dep:rand010"]
rand08 = ["dep:rand08"]
rand09 = ["dep:rand09"]
serde = ["dep:serde_core"]

[rust]
name = "deranged"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
deranged-macros = { loaf = "crates-io/deranged-macros", version = "=0.3.0", optional = true }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.15", default-features = false, optional = true }
powerfmt = { loaf = "crates-io/powerfmt", version = "^0.2.0", default-features = false, optional = true }
quickcheck = { loaf = "crates-io/quickcheck", version = "^1.0.3", default-features = false, optional = true }
rand010 = { loaf = "crates-io/rand", version = "^0.10.0", default-features = false, optional = true }
rand08 = { loaf = "crates-io/rand", version = "^0.8.4", default-features = false, optional = true }
rand09 = { loaf = "crates-io/rand", version = "^0.9.0", default-features = false, optional = true }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0.220", default-features = false, optional = true }
