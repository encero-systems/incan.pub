# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/kube"
version = "4.2.0"

[project.features]
admission = ["kube-core/admission"]
aws-lc-rs = ["kube-client?/aws-lc-rs"]
cel = ["kube-core/cel"]
client = ["dep:kube-client", "kube-client/client", "config"]
config = ["dep:kube-client", "kube-client/config"]
default = ["client", "rustls-tls", "ring"]
derive = ["kube-derive", "kube-core/schema"]
gzip = ["dep:kube-client", "kube-client/gzip", "client"]
http-proxy = ["dep:kube-client", "kube-client/http-proxy", "client"]
hyper-util-tracing = ["dep:kube-client", "kube-client/hyper-util-tracing", "client"]
jsonpatch = ["kube-core/jsonpatch"]
kube-client = ["dep:kube-client"]
kube-derive = ["dep:kube-derive"]
kube-runtime = ["dep:kube-runtime"]
kubelet-debug = ["dep:kube-client", "kube-client/kubelet-debug", "kube-core/kubelet-debug"]
oauth = ["dep:kube-client", "kube-client/oauth", "client"]
oidc = ["dep:kube-client", "kube-client/oidc", "client"]
openssl-tls = ["dep:kube-client", "kube-client/openssl-tls", "client"]
ring = ["kube-client?/ring"]
runtime = ["kube-runtime"]
rustls-tls = ["dep:kube-client", "kube-client/rustls-tls", "client"]
socks5 = ["dep:kube-client", "kube-client/socks5", "client"]
unstable-client = ["dep:kube-client", "kube-client/unstable-client", "client"]
unstable-runtime = ["dep:kube-runtime", "kube-runtime/unstable-runtime", "runtime"]
webpki-roots = ["dep:kube-client", "kube-client/webpki-roots", "client"]
ws = ["dep:kube-client", "kube-client/ws", "kube-core/ws"]

[rust]
name = "kube"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
k8s-openapi = { loaf = "crates-io/k8s-openapi", version = "^0.28.0", default-features = false }
kube-client = { loaf = "crates-io/kube-client", version = "=4.2.0", default-features = false, optional = true }
kube-core = { loaf = "crates-io/kube-core", version = "=4.2.0" }
kube-derive = { loaf = "crates-io/kube-derive", version = "=4.2.0", optional = true }
kube-runtime = { loaf = "crates-io/kube-runtime", version = "=4.2.0", optional = true }
