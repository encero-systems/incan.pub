# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wit-parser"
version = "0.261.0"

[project.features]
decoding = ["std", "wasmparser/std"]
default = ["std", "serde", "decoding"]
serde = ["dep:serde", "dep:serde_derive", "indexmap/serde", "serde_json"]
serde_json = ["dep:serde_json"]
std = ["semver/std"]
wat = ["decoding", "dep:wat"]

[rust]
name = "wit_parser"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.58", default-features = false }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.17.0", features = ["default-hasher"], default-features = false }
id-arena = { loaf = "crates-io/id-arena", version = "^2.3.0", default-features = false }
indexmap = { loaf = "crates-io/indexmap", version = "^2.14.0", default-features = false }
log = { loaf = "crates-io/log", version = "^0.4.17" }
semver = { loaf = "crates-io/semver", version = "^1.0.0", default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0.166", features = ["alloc"], default-features = false, optional = true }
serde_derive = { loaf = "crates-io/serde_derive", version = "^1.0.166", optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1", optional = true }
unicode-ident = { loaf = "crates-io/unicode-ident", version = "^1.0.24" }
wasmparser = { loaf = "crates-io/wasmparser", version = "^0.261.0", features = ["component-model", "features", "simd", "validate"], default-features = false }
wat = { loaf = "crates-io/wat", version = "^1.261.0", features = ["component-model"], default-features = false, optional = true }
