# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/hermit-abi"
version = "0.5.3"

[project.features]
alloc = ["dep:alloc"]
core = ["dep:core"]
default = []
rustc-dep-of-std = ["core", "alloc"]

[rust]
name = "hermit_abi"
type = "lib"
edition = "2021"

[dependencies]
alloc = { loaf = "crates-io/rustc-std-workspace-alloc", version = "^1.0.0", optional = true }
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0.0", optional = true }
