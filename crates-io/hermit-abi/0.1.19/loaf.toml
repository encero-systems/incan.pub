# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/hermit-abi"
version = "0.1.19"

[project.features]
compiler_builtins = ["dep:compiler_builtins"]
core = ["dep:core"]
default = []
docs = []
rustc-dep-of-std = ["core", "dep:compiler_builtins", "compiler_builtins/rustc-dep-of-std", "libc/rustc-dep-of-std"]

[rust]
name = "hermit_abi"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
compiler_builtins = { loaf = "crates-io/compiler_builtins", version = "^0.1", optional = true }
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0.0", optional = true }
libc = { loaf = "crates-io/libc", version = "^0.2.51", default-features = false }
