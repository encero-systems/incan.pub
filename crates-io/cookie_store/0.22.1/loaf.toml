# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cookie_store"
version = "0.22.1"

[project.features]
default = ["public_suffix", "serde_json"]
log_secure_cookie_values = []
preserve_order = ["dep:indexmap"]
public_suffix = ["dep:publicsuffix"]
serde = ["dep:serde", "dep:serde_derive"]
serde_json = ["serde", "dep:serde_json"]
serde_ron = ["serde", "dep:ron"]
wasm-bindgen = ["time/wasm-bindgen"]

[rust]
name = "cookie_store"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
cookie = { loaf = "crates-io/cookie", version = "^0.18.0", features = ["percent-encode"] }
document-features = { loaf = "crates-io/document-features", version = "^0.2.10" }
idna = { loaf = "crates-io/idna", version = "^1.0" }
indexmap = { loaf = "crates-io/indexmap", version = "^2.6.0", optional = true }
log = { loaf = "crates-io/log", version = "^0.4.17" }
publicsuffix = { loaf = "crates-io/publicsuffix", version = "^2.2.3", optional = true }
ron = { loaf = "crates-io/ron", version = "^0.10.1", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.147", optional = true }
serde_derive = { loaf = "crates-io/serde_derive", version = "^1.0.147", optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.87", optional = true }
time = { loaf = "crates-io/time", version = "^0.3.47" }
url = { loaf = "crates-io/url", version = "^2.3.1" }
