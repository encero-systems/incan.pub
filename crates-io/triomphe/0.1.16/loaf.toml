# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/triomphe"
version = "0.1.16"

[project.features]
arc-swap = ["dep:arc-swap"]
default = ["serde", "stable_deref_trait", "std"]
serde = ["dep:serde"]
stable_deref_trait = ["dep:stable_deref_trait"]
std = []
unsize = ["dep:unsize"]
unstable_dropck_eyepatch = []

[rust]
name = "triomphe"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
arc-swap = { loaf = "crates-io/arc-swap", version = "^1.3.0", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0", default-features = false, optional = true }
stable_deref_trait = { loaf = "crates-io/stable_deref_trait", version = "^1.1.1", default-features = false, optional = true }
unsize = { loaf = "crates-io/unsize", version = "^1.1", optional = true }
