# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rstest_macros"
version = "0.27.0"

[project.features]
async-timeout = []
crate-name = ["dep:proc-macro-crate"]
default = ["async-timeout", "crate-name"]

[rust]
name = "rstest_macros"
type = "proc-macro"
edition = "2021"
build-script = true

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.0" }
glob = { loaf = "crates-io/glob", version = "^0.3.1" }
proc-macro-crate = { loaf = "crates-io/proc-macro-crate", version = "^3.4.0", optional = true }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.86" }
quote = { loaf = "crates-io/quote", version = "^1.0.37" }
regex = { loaf = "crates-io/regex", version = "^1.10.6" }
relative-path = { loaf = "crates-io/relative-path", version = "^1.9.3" }
syn = { loaf = "crates-io/syn", version = "^2.0.79", features = ["extra-traits", "full", "parsing", "visit", "visit-mut"] }
unicode-ident = { loaf = "crates-io/unicode-ident", version = "^1.0.13" }
