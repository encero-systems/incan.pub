# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/munge_macro"
version = "0.4.7"

[rust]
name = "munge_macro"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1", default-features = false }
quote = { loaf = "crates-io/quote", version = "^1", default-features = false }
syn = { loaf = "crates-io/syn", version = "^2", features = ["clone-impls", "full", "parsing", "printing", "proc-macro"], default-features = false }
