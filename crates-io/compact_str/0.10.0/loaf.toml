# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/compact_str"
version = "0.10.0"

[project.features]
arbitrary = ["dep:arbitrary"]
bevy-reflect = ["dep:bevy_reflect", "serde"]
borsh = ["dep:borsh"]
bytes = ["dep:bytes"]
default = ["std"]
defmt = ["dep:defmt"]
diesel = ["dep:diesel"]
garde = ["dep:garde"]
markup = ["dep:markup"]
proptest = ["dep:proptest"]
pyo3 = ["dep:pyo3"]
quickcheck = ["dep:quickcheck"]
rkyv = ["dep:rkyv"]
schemars = ["dep:schemars"]
serde = ["dep:serde"]
smallvec = ["dep:smallvec"]
sqlx = ["dep:sqlx", "std"]
sqlx-mysql = ["sqlx", "dep:sqlx", "sqlx/mysql"]
sqlx-postgres = ["sqlx", "dep:sqlx", "sqlx/postgres"]
sqlx-sqlite = ["sqlx", "dep:sqlx", "sqlx/sqlite"]
std = []
utoipa = ["dep:utoipa", "std"]
valuable = ["dep:valuable"]
zeroize = ["dep:zeroize"]

[rust]
name = "compact_str"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
arbitrary = { loaf = "crates-io/arbitrary", version = "^1", default-features = false, optional = true }
bevy_reflect = { loaf = "crates-io/bevy_reflect", version = "^0.19", optional = true }
borsh = { loaf = "crates-io/borsh", version = "^1", optional = true }
bytes = { loaf = "crates-io/bytes", version = "^1", optional = true }
castaway = { loaf = "crates-io/castaway", version = "^0.2.3", features = ["alloc"], default-features = false }
cfg-if = { loaf = "crates-io/cfg-if", version = "^1" }
defmt = { loaf = "crates-io/defmt", version = "^1", optional = true, target = "cfg(not(target_os = \"windows\"))" }
diesel = { loaf = "crates-io/diesel", version = "^2", default-features = false, optional = true }
garde = { loaf = "crates-io/garde", version = "^0.23", features = ["derive"], default-features = false, optional = true }
itoa = { loaf = "crates-io/itoa", version = "^1" }
markup = { loaf = "crates-io/markup", version = "^0.16", default-features = false, optional = true }
proptest = { loaf = "crates-io/proptest", version = "^1", features = ["std"], default-features = false, optional = true }
pyo3 = { loaf = "crates-io/pyo3", version = "^0.29", default-features = false, optional = true }
quickcheck = { loaf = "crates-io/quickcheck", version = "^1", default-features = false, optional = true }
rkyv = { loaf = "crates-io/rkyv", version = "^0.8", default-features = false, optional = true }
schemars = { loaf = "crates-io/schemars", version = "^1", default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1", features = ["alloc", "derive"], default-features = false, optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1", features = ["union"], optional = true }
sqlx = { loaf = "crates-io/sqlx", version = "^0.9", default-features = false, optional = true }
static_assertions = { loaf = "crates-io/static_assertions", version = "^1" }
utoipa = { loaf = "crates-io/utoipa", version = "^5", optional = true }
valuable = { loaf = "crates-io/valuable", version = "^0.1.1", default-features = false, optional = true }
zeroize = { loaf = "crates-io/zeroize", version = "^1", default-features = false, optional = true }
zmij = { loaf = "crates-io/zmij", version = "^1" }
