# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/zerocopy-derive"
version = "0.8.60"

[rust]
name = "zerocopy_derive"
type = "proc-macro"
edition = "2021"

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.1" }
quote = { loaf = "crates-io/quote", version = "^1.0.40" }
syn = { loaf = "crates-io/syn", version = "^2.0.46", features = ["full"] }
