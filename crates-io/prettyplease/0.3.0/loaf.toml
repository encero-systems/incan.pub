# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/prettyplease"
version = "0.3.0"

[project.features]
verbatim = ["syn/parsing"]

[rust]
name = "prettyplease"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.80", default-features = false }
syn = { loaf = "crates-io/syn", version = "^3", features = ["full"], default-features = false }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = []
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["verbatim"]
cfg = []
