# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/anstyle-parse"
version = "1.0.0"

[project.features]
core = ["dep:arrayvec"]
default = ["utf8"]
utf8 = ["dep:utf8parse"]

[rust]
name = "anstyle_parse"
type = "lib"
edition = "2021"

[dependencies]
arrayvec = { loaf = "crates-io/arrayvec", version = "^0.7.6", default-features = false, optional = true }
utf8parse = { loaf = "crates-io/utf8parse", version = "^0.2.2", optional = true }
