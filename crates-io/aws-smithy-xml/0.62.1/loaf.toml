# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-smithy-xml"
version = "0.62.1"

[rust]
name = "aws_smithy_xml"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
aws-smithy-runtime-api = { loaf = "crates-io/aws-smithy-runtime-api", version = "^1.16.2", features = ["client"] }
aws-smithy-schema = { loaf = "crates-io/aws-smithy-schema", version = "^0.2.1" }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.6.4" }
xmlparser = { loaf = "crates-io/xmlparser", version = "^0.13.5" }
