# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/winapi-util"
version = "0.1.11"

[rust]
name = "winapi_util"
type = "lib"
edition = "2021"

[dependencies]
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.48.0, <=0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation"], target = "cfg(windows)" }
