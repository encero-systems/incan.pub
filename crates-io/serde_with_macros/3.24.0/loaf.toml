# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/serde_with_macros"
version = "3.24.0"

[project.features]
schemars_0_8 = []
schemars_0_9 = []
schemars_1 = []

[rust]
name = "serde_with_macros"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
darling = { loaf = "crates-io/darling", version = "^0.24.0" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.1" }
quote = { loaf = "crates-io/quote", version = "^1.0.0" }
syn = { loaf = "crates-io/syn", version = "^3.0.3", features = ["extra-traits", "full", "parsing"] }
