# External-source record for the crates.io package `libm` 0.2.16.
#
# `build.rs` probes the opt-level, the enabled Cargo features and the target architecture, then emits
# `rustc-cfg` answers. Under a frozen toolchain those answers are constants; each `[[rust.facts]]` record
# below states them for one exact selection. The script also reemits `CFG_CARGO_FEATURES`, `CFG_OPT_LEVEL`
# and `CFG_TARGET_FEATURES` through `rustc-env` for its own test logging; no compilation of the library
# observes them, so they are not facts and do not appear here.
#
# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/libm"
version = "0.2.16"

[project.features]
arch = []
default = ["arch"]
force-soft-floats = []
unstable = ["unstable-intrinsics", "unstable-float"]
unstable-float = []
unstable-intrinsics = []
unstable-public-internals = []

[rust]
name = "libm"
type = "lib"
edition = "2021"
build-script = true

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = []
cfg = []
environment = [{ name = "CFG_CARGO_FEATURES", literal = "[]" }, { name = "CFG_OPT_LEVEL", literal = "0" }, { name = "CFG_TARGET_FEATURES", literal = "[\"aes\", \"crc\", \"dit\", \"dotprod\", \"dpb\", \"dpb2\", \"fcma\", \"fhm\", \"flagm\", \"fp16\", \"frintts\", \"jsconv\", \"lor\", \"lse\", \"neon\", \"paca\", \"pacg\", \"pan\", \"pmuv3\", \"ras\", \"rcpc\", \"rcpc2\", \"rdm\", \"sb\", \"sha2\", \"sha3\", \"ssbs\", \"vh\"]" }]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["arch", "default"]
cfg = ["arch_enabled"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = []
cfg = ["optimizations_enabled"]
environment = [{ name = "CFG_CARGO_FEATURES", literal = "[]" }, { name = "CFG_OPT_LEVEL", literal = "3" }, { name = "CFG_TARGET_FEATURES", literal = "[\"aes\", \"crc\", \"dit\", \"dotprod\", \"dpb\", \"dpb2\", \"fcma\", \"fhm\", \"flagm\", \"fp16\", \"frintts\", \"jsconv\", \"lor\", \"lse\", \"neon\", \"paca\", \"pacg\", \"pan\", \"pmuv3\", \"ras\", \"rcpc\", \"rcpc2\", \"rdm\", \"sb\", \"sha2\", \"sha3\", \"ssbs\", \"vh\"]" }]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["arch", "default"]
cfg = ["arch_enabled", "optimizations_enabled"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = []
cfg = []
environment = [{ name = "CFG_CARGO_FEATURES", literal = "[]" }, { name = "CFG_OPT_LEVEL", literal = "0" }, { name = "CFG_TARGET_FEATURES", literal = "[\"fxsr\", \"sse\", \"sse2\"]" }]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["arch", "default"]
cfg = ["arch_enabled"]
environment = [{ name = "CFG_CARGO_FEATURES", literal = "[\"arch\", \"default\"]" }, { name = "CFG_OPT_LEVEL", literal = "0" }, { name = "CFG_TARGET_FEATURES", literal = "[\"fxsr\", \"sse\", \"sse2\"]" }]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "release"
features = []
cfg = ["optimizations_enabled"]
environment = [{ name = "CFG_CARGO_FEATURES", literal = "[]" }, { name = "CFG_OPT_LEVEL", literal = "3" }, { name = "CFG_TARGET_FEATURES", literal = "[\"fxsr\", \"sse\", \"sse2\"]" }]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "release"
