environment = [{ name = "CFG_CARGO_FEATURES", literal = "[\"arch\", \"default\"]" }, { name = "CFG_OPT_LEVEL", literal = "3" }, { name = "CFG_TARGET_FEATURES", literal = "[\"fxsr\", \"sse\", \"sse2\"]" }]
