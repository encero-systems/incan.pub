# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/perf-event"
version = "0.4.7"

[rust]
name = "perf_event"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
libc = { loaf = "crates-io/libc", version = "^0.2" }
perf-event-open-sys = { loaf = "crates-io/perf-event-open-sys", version = "^1.0" }
