# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/fxprof-processed-profile"
version = "0.6.0"

[rust]
name = "fxprof_processed_profile"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.0" }
debugid = { loaf = "crates-io/debugid", version = "^0.8.0" }
fxhash = { loaf = "crates-io/fxhash", version = "^0.2.1" }
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["derive"] }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0" }
