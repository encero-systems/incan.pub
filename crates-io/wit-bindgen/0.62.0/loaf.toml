# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wit-bindgen"
version = "0.62.0"

[project.features]
async = []
async-spawn = ["async", "dep:futures"]
bitflags = ["dep:bitflags"]
default = ["macros", "realloc", "async", "std", "bitflags", "macro-string"]
futures-stream = ["async", "dep:futures"]
inter-task-wakeup = ["async"]
macro-string = ["wit-bindgen-rust-macro?/macro-string"]
macros = ["dep:wit-bindgen-rust-macro"]
realloc = []
rustc-dep-of-std = ["dep:core", "dep:alloc"]
std = []

[rust]
name = "wit_bindgen"
type = "lib"
edition = "2024"
build-script = true

[dependencies]
alloc = { loaf = "crates-io/rustc-std-workspace-alloc", version = "^1.0", optional = true }
bitflags = { loaf = "crates-io/bitflags", version = "^2.11.1", optional = true }
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0", optional = true }
futures = { loaf = "crates-io/futures", version = "^0.3.30", features = ["alloc"], default-features = false, optional = true }
wit-bindgen-rust-macro = { loaf = "crates-io/wit-bindgen-rust-macro", version = "^0.62.0", default-features = false, optional = true }
