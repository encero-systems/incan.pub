# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/anstyle-wincon"
version = "3.0.11"

[rust]
name = "anstyle_wincon"
type = "lib"
edition = "2021"

[dependencies]
anstyle = { loaf = "crates-io/anstyle", version = "^1.0.0" }
once_cell_polyfill = { loaf = "crates-io/once_cell_polyfill", version = "^1.56.1", target = "cfg(windows)" }
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.60.2, <0.62", features = ["Win32_Foundation", "Win32_System_Console"], target = "cfg(windows)" }
