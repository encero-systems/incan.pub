# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/futures-timer"
version = "3.0.4"

[project.features]
gloo-timers = ["dep:gloo-timers"]
send_wrapper = ["dep:send_wrapper"]
wasm-bindgen = ["gloo-timers", "send_wrapper"]

[rust]
name = "futures_timer"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
gloo-timers = { loaf = "crates-io/gloo-timers", version = "^0.4.0", features = ["futures"], optional = true, target = "cfg(target_arch = \"wasm32\")" }
send_wrapper = { loaf = "crates-io/send_wrapper", version = "^0.6.0", optional = true, target = "cfg(target_arch = \"wasm32\")" }
