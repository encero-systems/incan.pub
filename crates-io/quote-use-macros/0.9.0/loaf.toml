# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/quote-use-macros"
version = "0.9.0"

[rust]
name = "quote_use_macros"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro-utils = { loaf = "crates-io/proc-macro-utils", version = "^0.10" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^3", features = ["clone-impls", "extra-traits", "parsing", "printing"], default-features = false }
