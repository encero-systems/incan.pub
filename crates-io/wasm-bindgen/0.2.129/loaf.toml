# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasm-bindgen"
version = "0.2.129"

[project.features]
default = ["std"]
enable-interning = ["std"]
gg-alloc = []
msrv = []
rustversion = []
serde = ["dep:serde"]
serde-serialize = ["serde", "serde_json", "std"]
serde_json = ["dep:serde_json"]
spans = []
std = []
strict-macro = ["wasm-bindgen-macro/strict-macro"]
xxx_debug_only_print_generated_code = []

[rust]
name = "wasm_bindgen"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0.0" }
once_cell = { loaf = "crates-io/once_cell", version = "^1.12", default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0", optional = true }
wasm-bindgen-macro = { loaf = "crates-io/wasm-bindgen-macro", version = "=0.2.129" }
wasm-bindgen-shared = { loaf = "crates-io/wasm-bindgen-shared", version = "=0.2.129" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default", "std"]
cfg = ["wbg_diagnostic"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["std"]
cfg = ["wbg_diagnostic"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default", "std"]
cfg = ["wbg_diagnostic"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["std"]
cfg = ["wbg_diagnostic"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["default", "std"]
cfg = ["wbg_diagnostic"]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["std"]
cfg = ["wbg_diagnostic"]
