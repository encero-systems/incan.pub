# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/miow"
version = "0.6.1"

[rust]
name = "miow"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
windows-sys = { loaf = "crates-io/windows-sys", version = ">=0.60, <=0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
