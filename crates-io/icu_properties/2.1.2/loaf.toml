# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/icu_properties"
version = "2.1.2"

[project.features]
alloc = ["zerovec/alloc", "icu_collections/alloc", "serde?/alloc"]
compiled_data = ["dep:icu_properties_data", "icu_provider/baked"]
datagen = ["serde", "dep:databake", "zerovec/databake", "icu_collections/databake", "icu_locale_core/databake", "zerotrie/databake", "icu_provider/export"]
default = ["compiled_data"]
serde = ["dep:serde", "icu_locale_core/serde", "zerovec/serde", "icu_collections/serde", "icu_provider/serde", "zerotrie/serde"]
unicode_bidi = ["dep:unicode-bidi"]

[rust]
name = "icu_properties"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
databake = { loaf = "crates-io/databake", version = "^0.2.0", features = ["derive"], default-features = false, optional = true }
icu_collections = { loaf = "crates-io/icu_collections", version = "~2.1.1", default-features = false }
icu_locale_core = { loaf = "crates-io/icu_locale_core", version = "^2.1.1", features = ["zerovec"], default-features = false }
icu_properties_data = { loaf = "crates-io/icu_properties_data", version = "~2.1.2", default-features = false, optional = true }
icu_provider = { loaf = "crates-io/icu_provider", version = "^2.1.1", default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0.220", features = ["derive"], default-features = false, optional = true }
unicode-bidi = { loaf = "crates-io/unicode-bidi", version = "^0.3.11", default-features = false, optional = true }
zerotrie = { loaf = "crates-io/zerotrie", version = "^0.2.0", features = ["yoke", "zerofrom"], default-features = false }
zerovec = { loaf = "crates-io/zerovec", version = "^0.11.3", features = ["derive", "yoke"], default-features = false }
