# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cookie"
version = "0.18.2"

[project.features]
aes-gcm = ["dep:aes-gcm"]
base64 = ["dep:base64"]
hkdf = ["dep:hkdf"]
hmac = ["dep:hmac"]
key-expansion = ["sha2", "hkdf"]
percent-encode = ["percent-encoding"]
percent-encoding = ["dep:percent-encoding"]
private = ["aes-gcm", "base64", "rand", "subtle"]
rand = ["dep:rand"]
secure = ["private", "signed", "key-expansion"]
sha2 = ["dep:sha2"]
signed = ["hmac", "sha2", "base64", "rand", "subtle"]
subtle = ["dep:subtle"]

[rust]
name = "cookie"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
aes-gcm = { loaf = "crates-io/aes-gcm", version = "^0.10.0", optional = true }
base64 = { loaf = "crates-io/base64", version = "^0.22", optional = true }
hkdf = { loaf = "crates-io/hkdf", version = "^0.12.0", optional = true }
hmac = { loaf = "crates-io/hmac", version = "^0.12.0", optional = true }
percent-encoding = { loaf = "crates-io/percent-encoding", version = "^2.0", optional = true }
rand = { loaf = "crates-io/rand", version = "^0.8", optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.10.0", optional = true }
subtle = { loaf = "crates-io/subtle", version = "^2.3", optional = true }
time = { loaf = "crates-io/time", version = "^0.3.9", features = ["formatting", "macros", "parsing", "std"], default-features = false }
