# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/globset"
version = "0.4.20"

[project.features]
arbitrary = ["dep:arbitrary"]
default = ["log"]
log = ["dep:log"]
serde = ["dep:serde"]
serde1 = ["serde"]
simd-accel = []

[rust]
name = "globset"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
aho-corasick = { loaf = "crates-io/aho-corasick", version = "^1.1.1" }
arbitrary = { loaf = "crates-io/arbitrary", version = "^1.3.2", features = ["derive"], optional = true }
bstr = { loaf = "crates-io/bstr", version = "^1.6.2", features = ["std"], default-features = false }
log = { loaf = "crates-io/log", version = "^0.4.20", optional = true }
regex-automata = { loaf = "crates-io/regex-automata", version = "^0.4.18", features = ["hybrid", "meta", "nfa", "perf", "std", "syntax"], default-features = false }
regex-syntax = { loaf = "crates-io/regex-syntax", version = "^0.8.0", features = ["std"], default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0.188", optional = true }
