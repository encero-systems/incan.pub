# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rend"
version = "0.5.4"

[project.features]
bytecheck = ["dep:bytecheck"]
bytemuck-1 = ["dep:bytemuck-1"]
default = []
zerocopy-0_8 = ["dep:zerocopy", "dep:zerocopy-derive"]

[rust]
name = "rend"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bytecheck = { loaf = "crates-io/bytecheck", version = "^0.8", default-features = false, optional = true }
bytemuck-1 = { loaf = "crates-io/bytemuck", version = "^1", default-features = false, optional = true }
zerocopy = { loaf = "crates-io/zerocopy", version = "^0.8", default-features = false, optional = true }
zerocopy-derive = { loaf = "crates-io/zerocopy-derive", version = "^0.8", default-features = false, optional = true }
