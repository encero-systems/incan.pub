# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tungstenite"
version = "0.30.0"

[project.features]
__rustls-tls = ["rustls", "rustls-pki-types"]
data-encoding = ["dep:data-encoding"]
default = ["handshake"]
handshake = ["data-encoding", "http", "httparse", "sha1"]
http = ["dep:http"]
httparse = ["dep:httparse"]
native-tls = ["native-tls-crate"]
native-tls-crate = ["dep:native-tls-crate"]
native-tls-vendored = ["native-tls", "dep:native-tls-crate", "native-tls-crate/vendored"]
rustls = ["dep:rustls"]
rustls-native-certs = ["dep:rustls-native-certs"]
rustls-pki-types = ["dep:rustls-pki-types"]
rustls-tls-native-roots = ["__rustls-tls", "rustls-native-certs"]
rustls-tls-webpki-roots = ["__rustls-tls", "webpki-roots"]
sha1 = ["dep:sha1"]
url = ["dep:url"]
webpki-roots = ["dep:webpki-roots"]

[rust]
name = "tungstenite"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
bytes = { loaf = "crates-io/bytes", version = "^1.9.0" }
data-encoding = { loaf = "crates-io/data-encoding", version = "^2", optional = true }
http = { loaf = "crates-io/http", version = "^1.0", optional = true }
httparse = { loaf = "crates-io/httparse", version = "^1.3.4", optional = true }
log = { loaf = "crates-io/log", version = "^0.4.8" }
native-tls-crate = { loaf = "crates-io/native-tls", version = "^0.2.3", optional = true }
rand = { loaf = "crates-io/rand", version = "^0.10.2" }
rustls = { loaf = "crates-io/rustls", version = "^0.23.0", features = ["std"], default-features = false, optional = true }
rustls-native-certs = { loaf = "crates-io/rustls-native-certs", version = "^0.8.0", optional = true }
rustls-pki-types = { loaf = "crates-io/rustls-pki-types", version = "^1.0", optional = true }
sha1 = { loaf = "crates-io/sha1", version = "^0.11.0", optional = true }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.7" }
url = { loaf = "crates-io/url", version = "^2.1.0", optional = true }
webpki-roots = { loaf = "crates-io/webpki-roots", version = "^0.26", optional = true }
