# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/oxc_ast"
version = "0.155.0"

[project.features]
default = []
serialize = ["oxc_allocator/serialize", "oxc_span/serialize", "oxc_syntax/serialize", "oxc_estree/serialize"]

[rust]
name = "oxc_ast"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.13.0" }
oxc_allocator = { loaf = "crates-io/oxc_allocator", version = "^0.155.0" }
oxc_ast_macros = { loaf = "crates-io/oxc_ast_macros", version = "^0.155.0" }
oxc_data_structures = { loaf = "crates-io/oxc_data_structures", version = "^0.155.0", features = ["inline_string"] }
oxc_diagnostics = { loaf = "crates-io/oxc_diagnostics", version = "^0.155.0" }
oxc_estree = { loaf = "crates-io/oxc_estree", version = "^0.155.0" }
oxc_regular_expression = { loaf = "crates-io/oxc_regular_expression", version = "^0.155.0" }
oxc_span = { loaf = "crates-io/oxc_span", version = "^0.155.0" }
oxc_str = { loaf = "crates-io/oxc_str", version = "^0.155.0" }
oxc_syntax = { loaf = "crates-io/oxc_syntax", version = "^0.155.0" }
