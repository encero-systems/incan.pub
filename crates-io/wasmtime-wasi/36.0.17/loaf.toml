# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/wasmtime-wasi"
version = "36.0.17"

[project.features]
default = ["preview1"]
p3 = ["wasmtime/component-model-async", "wasmtime/component-model-async-bytes"]
preview1 = ["dep:wiggle"]

[rust]
name = "wasmtime_wasi"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.93", default-features = false }
async-trait = { loaf = "crates-io/async-trait", version = "^0.1.71" }
bitflags = { loaf = "crates-io/bitflags", version = "^2.0" }
bytes = { loaf = "crates-io/bytes", version = "^1.4", default-features = false }
cap-fs-ext = { loaf = "crates-io/cap-fs-ext", version = "^3.4.6" }
cap-net-ext = { loaf = "crates-io/cap-net-ext", version = "^3.4.6" }
cap-rand = { loaf = "crates-io/cap-rand", version = "^3.4.6", features = ["small_rng"] }
cap-std = { loaf = "crates-io/cap-std", version = "^3.4.6" }
cap-time-ext = { loaf = "crates-io/cap-time-ext", version = "^3.4.6" }
fs-set-times = { loaf = "crates-io/fs-set-times", version = "^0.20.1" }
futures = { loaf = "crates-io/futures", version = "^0.3.27", default-features = false }
io-extras = { loaf = "crates-io/io-extras", version = "^0.18.1", target = "cfg(windows)" }
io-lifetimes = { loaf = "crates-io/io-lifetimes", version = "^2.0.3", default-features = false }
rustix = [{ loaf = "crates-io/rustix", version = "^1.0.3", features = ["event", "fs", "net"], target = "cfg(unix)" }, { loaf = "crates-io/rustix", version = "^1.0.3", features = ["event", "net"], target = "cfg(windows)" }]
rustix-linux-procfs = { loaf = "crates-io/rustix-linux-procfs", version = "^0.1.1", target = "cfg(unix)" }
system-interface = { loaf = "crates-io/system-interface", version = "^0.27.1", features = ["cap_std_impls"] }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0.12" }
tokio = { loaf = "crates-io/tokio", version = "^1.43.0", features = ["io-std", "io-util", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { loaf = "crates-io/tracing", version = "^0.1.26" }
url = { loaf = "crates-io/url", version = "^2.3.1" }
wasmtime = { loaf = "crates-io/wasmtime", version = "^36.0.17", features = ["async", "component-model", "runtime", "std"], default-features = false }
wasmtime-wasi-io = { loaf = "crates-io/wasmtime-wasi-io", version = "^36.0.17", features = ["std"], default-features = false }
wiggle = { loaf = "crates-io/wiggle", version = "=36.0.17", features = ["wasmtime"], default-features = false, optional = true }
windows-sys = { loaf = "crates-io/windows-sys", version = "^0.60.0", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Performance", "Win32_System_SystemServices", "Win32_System_WindowsProgramming"], target = "cfg(windows)" }
winx = { loaf = "crates-io/winx", version = "^0.36.0", target = "cfg(windows)" }
