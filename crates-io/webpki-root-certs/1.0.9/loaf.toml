# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/webpki-root-certs"
version = "1.0.9"

[rust]
name = "webpki_root_certs"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
pki-types = { loaf = "crates-io/rustls-pki-types", version = "^1.8", default-features = false }
