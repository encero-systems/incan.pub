# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/curve25519-dalek-derive"
version = "0.1.1"

[rust]
name = "curve25519_dalek_derive"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.66" }
quote = { loaf = "crates-io/quote", version = "^1.0.31" }
syn = { loaf = "crates-io/syn", version = "^2.0.27", features = ["full"] }
