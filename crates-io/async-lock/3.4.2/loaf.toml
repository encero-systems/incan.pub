# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/async-lock"
version = "3.4.2"

[project.features]
default = ["std"]
loom = ["event-listener/loom", "dep:loom"]
std = ["event-listener/std", "event-listener-strategy/std"]

[rust]
name = "async_lock"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
event-listener = { loaf = "crates-io/event-listener", version = "^5.0.0", default-features = false }
event-listener-strategy = { loaf = "crates-io/event-listener-strategy", version = "^0.5.0", default-features = false }
loom = { loaf = "crates-io/loom", version = "^0.7", optional = true, target = "cfg(loom)" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.11" }
