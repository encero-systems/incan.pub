# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/base64-simd"
version = "0.8.0"

[project.features]
alloc = ["vsimd/alloc"]
default = ["std", "detect"]
detect = ["vsimd/detect"]
std = ["alloc", "vsimd/std"]
unstable = ["vsimd/unstable"]

[rust]
name = "base64_simd"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
outref = { loaf = "crates-io/outref", version = "^0.5.0" }
vsimd = { loaf = "crates-io/vsimd", version = "^0.8.0" }
