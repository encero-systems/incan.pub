# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/synstructure"
version = "0.13.2"

[project.features]
default = ["proc-macro"]
proc-macro = ["proc-macro2/proc-macro", "syn/proc-macro", "quote/proc-macro"]

[rust]
name = "synstructure"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.60", default-features = false }
quote = { loaf = "crates-io/quote", version = "^1", default-features = false }
syn = { loaf = "crates-io/syn", version = "^2", features = ["clone-impls", "derive", "extra-traits", "parsing", "printing", "visit"], default-features = false }
