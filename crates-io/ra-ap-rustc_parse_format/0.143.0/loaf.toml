# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra-ap-rustc_parse_format"
version = "0.143.0"

[rust]
name = "ra_ap_rustc_parse_format"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
rustc-literal-escaper = { loaf = "crates-io/rustc-literal-escaper", version = "^0.0.5" }
rustc_lexer = { loaf = "crates-io/ra-ap-rustc_lexer", version = "^0.143.0" }
