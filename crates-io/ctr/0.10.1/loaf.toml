# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ctr"
version = "0.10.1"

[project.features]
alloc = ["cipher/alloc"]
block-padding = ["cipher/block-padding"]
zeroize = ["cipher/zeroize"]

[rust]
name = "ctr"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
cipher = { loaf = "crates-io/cipher", version = "^0.5.2", features = ["stream-wrapper"] }
