# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tonic-prost"
version = "0.14.6"

[rust]
name = "tonic_prost"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bytes = { loaf = "crates-io/bytes", version = "^1" }
prost = { loaf = "crates-io/prost", version = "^0.14" }
tonic = { loaf = "crates-io/tonic", version = "^0.14.6", default-features = false }
