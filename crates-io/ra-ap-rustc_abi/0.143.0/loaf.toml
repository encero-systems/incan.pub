# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ra-ap-rustc_abi"
version = "0.143.0"

[project.features]
nightly = []
rand = ["dep:rand"]
rand_xoshiro = ["dep:rand_xoshiro"]

[rust]
name = "ra_ap_rustc_abi"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.4.1" }
rand = { loaf = "crates-io/rand", version = "^0.9.0", default-features = false, optional = true }
rand_xoshiro = { loaf = "crates-io/rand_xoshiro", version = "^0.7.0", optional = true }
rustc_hashes = { loaf = "crates-io/ra-ap-rustc_hashes", version = "^0.143.0" }
rustc_index = { loaf = "crates-io/ra-ap-rustc_index", version = "^0.143.0", default-features = false }
tracing = { loaf = "crates-io/tracing", version = "^0.1" }
