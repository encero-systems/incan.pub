# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/openssl-macros"
version = "0.1.1"

[rust]
name = "openssl_macros"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^2", features = ["full"] }
