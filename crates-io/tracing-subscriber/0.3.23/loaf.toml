# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/tracing-subscriber"
version = "0.3.23"

[project.features]
alloc = []
ansi = ["fmt", "nu-ansi-term"]
chrono = ["dep:chrono"]
default = ["smallvec", "fmt", "ansi", "tracing-log", "std"]
env-filter = ["matchers", "once_cell", "tracing", "std", "thread_local", "dep:regex-automata"]
fmt = ["registry", "std"]
json = ["tracing-serde", "serde", "serde_json"]
local-time = ["dep:time", "time/local-offset"]
matchers = ["dep:matchers"]
nu-ansi-term = ["dep:nu-ansi-term"]
once_cell = ["dep:once_cell"]
parking_lot = ["dep:parking_lot"]
regex = []
registry = ["sharded-slab", "thread_local", "std"]
serde = ["dep:serde"]
serde_json = ["dep:serde_json"]
sharded-slab = ["dep:sharded-slab"]
smallvec = ["dep:smallvec"]
std = ["alloc", "tracing-core/std"]
thread_local = ["dep:thread_local"]
time = ["dep:time"]
tracing = ["dep:tracing"]
tracing-log = ["dep:tracing-log"]
tracing-serde = ["dep:tracing-serde"]
valuable = ["tracing-core/valuable", "valuable_crate", "valuable-serde", "dep:tracing-serde", "tracing-serde/valuable"]
valuable-serde = ["dep:valuable-serde"]
valuable_crate = ["dep:valuable_crate"]

[rust]
name = "tracing_subscriber"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
chrono = { loaf = "crates-io/chrono", version = "^0.4.26", features = ["clock", "std"], default-features = false, optional = true }
matchers = { loaf = "crates-io/matchers", version = "^0.2.0", optional = true }
nu-ansi-term = { loaf = "crates-io/nu-ansi-term", version = "^0.50.0", optional = true }
once_cell = { loaf = "crates-io/once_cell", version = "^1.13.0", optional = true }
parking_lot = { loaf = "crates-io/parking_lot", version = "^0.12.1", optional = true }
regex-automata = { loaf = "crates-io/regex-automata", version = "^0.4", features = ["std"], default-features = false, optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.140", optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0.82", optional = true }
sharded-slab = { loaf = "crates-io/sharded-slab", version = "^0.1.4", optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1.9.0", optional = true }
thread_local = { loaf = "crates-io/thread_local", version = "^1.1.4", optional = true }
time = { loaf = "crates-io/time", version = "^0.3.2", features = ["formatting"], optional = true }
tracing = { loaf = "crates-io/tracing", version = "^0.1.43", default-features = false, optional = true }
tracing-core = { loaf = "crates-io/tracing-core", version = "^0.1.35", default-features = false }
tracing-log = { loaf = "crates-io/tracing-log", version = "^0.2.0", features = ["log-tracer", "std"], default-features = false, optional = true }
tracing-serde = { loaf = "crates-io/tracing-serde", version = "^0.2.0", optional = true }
valuable-serde = { loaf = "crates-io/valuable-serde", version = "^0.1.0", default-features = false, optional = true, target = "cfg(tracing_unstable)" }
valuable_crate = { loaf = "crates-io/valuable", version = "^0.1.0", default-features = false, optional = true, target = "cfg(tracing_unstable)" }
