# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/fragile"
version = "3.0.0"

[project.features]
default = ["stream"]
future = []
futures-core = ["dep:futures-core"]
slab = ["dep:slab"]
stream = ["future", "futures-core"]

[rust]
name = "fragile"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
futures-core = { loaf = "crates-io/futures-core", version = "^0.3.11", optional = true }
slab = { loaf = "crates-io/slab", version = "^0.4.5", optional = true }
