# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/miette-derive"
version = "7.6.0"

[rust]
name = "miette_derive"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.83" }
quote = { loaf = "crates-io/quote", version = "^1.0.35" }
syn = { loaf = "crates-io/syn", version = "^2.0.87" }
