# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/num-rational"
version = "0.4.2"

[project.features]
default = ["num-bigint", "std"]
num-bigint = ["dep:num-bigint"]
num-bigint-std = ["dep:num-bigint", "num-bigint/std"]
serde = ["dep:serde"]
std = ["num-bigint?/std", "num-integer/std", "num-traits/std"]

[rust]
name = "num_rational"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
num-bigint = { loaf = "crates-io/num-bigint", version = "^0.4.0", default-features = false, optional = true }
num-integer = { loaf = "crates-io/num-integer", version = "^0.1.42", features = ["i128"], default-features = false }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.18", features = ["i128"], default-features = false }
serde = { loaf = "crates-io/serde", version = "^1.0.0", default-features = false, optional = true }
