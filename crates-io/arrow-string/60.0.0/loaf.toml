# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/arrow-string"
version = "60.0.0"

[rust]
name = "arrow_string"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
arrow-array = { loaf = "crates-io/arrow-array", version = "^60.0.0" }
arrow-buffer = { loaf = "crates-io/arrow-buffer", version = "^60.0.0" }
arrow-data = { loaf = "crates-io/arrow-data", version = "^60.0.0" }
arrow-schema = { loaf = "crates-io/arrow-schema", version = "^60.0.0" }
arrow-select = { loaf = "crates-io/arrow-select", version = "^60.0.0" }
memchr = { loaf = "crates-io/memchr", version = "^2.7.4" }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.19", features = ["std"], default-features = false }
regex = { loaf = "crates-io/regex", version = "^1.7.0", features = ["perf", "std", "unicode"], default-features = false }
regex-syntax = { loaf = "crates-io/regex-syntax", version = "^0.8.0", features = ["unicode"], default-features = false }
