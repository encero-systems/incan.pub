# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/prometheus"
version = "0.14.0"

[project.features]
default = ["protobuf"]
gen = ["protobuf-codegen"]
libc = ["dep:libc"]
nightly = ["libc"]
process = ["libc", "procfs"]
procfs = ["dep:procfs"]
protobuf = ["dep:protobuf"]
protobuf-codegen = []
push = ["reqwest", "libc", "protobuf"]
reqwest = ["dep:reqwest"]

[rust]
name = "prometheus"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0" }
fnv = { loaf = "crates-io/fnv", version = "^1.0" }
lazy_static = { loaf = "crates-io/lazy_static", version = "^1.4" }
libc = { loaf = "crates-io/libc", version = "^0.2", optional = true }
memchr = { loaf = "crates-io/memchr", version = "^2.3" }
parking_lot = { loaf = "crates-io/parking_lot", version = "^0.12" }
procfs = { loaf = "crates-io/procfs", version = "^0.17", default-features = false, optional = true, target = "cfg(target_os = \"linux\")" }
protobuf = { loaf = "crates-io/protobuf", version = "^3.7.2", optional = true }
reqwest = { loaf = "crates-io/reqwest", version = "^0.12", features = ["blocking"], optional = true }
thiserror = { loaf = "crates-io/thiserror", version = "^2.0" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default", "protobuf"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default", "protobuf"]
cfg = []
