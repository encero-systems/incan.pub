# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/scan_fmt"
version = "0.2.6"

[project.features]
default = ["regex", "std"]
regex = ["dep:regex"]
std = []

[rust]
name = "scan_fmt"
type = "lib"
edition = "2015"
build-script = false

[dependencies]
regex = { loaf = "crates-io/regex", version = "^1", optional = true }
