# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ghash"
version = "0.6.0"

[project.features]
zeroize = ["polyval/zeroize", "dep:zeroize"]

[rust]
name = "ghash"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
polyval = { loaf = "crates-io/polyval", version = "^0.7", features = ["hazmat"] }
zeroize = { loaf = "crates-io/zeroize", version = "^1", default-features = false, optional = true }
