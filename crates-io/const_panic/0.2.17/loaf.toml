# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/const_panic"
version = "0.2.17"

[project.features]
__ui_tests = ["trybuild", "test"]
const_panic_proc_macros = ["dep:const_panic_proc_macros"]
default = ["non_basic"]
derive = ["const_panic_proc_macros", "non_basic"]
docsrs = []
non_basic = []
rust_1_64 = []
rust_1_82 = ["rust_1_64"]
rust_1_88 = ["rust_1_82"]
rust_latest_stable = ["rust_1_88"]
test = []
trybuild = ["dep:trybuild"]

[rust]
name = "const_panic"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
const_panic_proc_macros = { loaf = "crates-io/const_panic_proc_macros", version = "=0.2.17", optional = true }
trybuild = { loaf = "crates-io/trybuild", version = "^1.0", optional = true }
typewit = { loaf = "crates-io/typewit", version = "^1.9.0", default-features = false }
