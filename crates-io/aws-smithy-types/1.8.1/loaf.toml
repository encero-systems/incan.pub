# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-smithy-types"
version = "1.8.1"

[project.features]
byte-stream-poll-next = []
http-body-0-4-x = ["dep:http-body-0-4", "dep:http"]
http-body-1-x = ["dep:http-body-1-0", "dep:http-body-util"]
hyper-0-14-x = ["dep:hyper-0-14"]
rt-tokio = ["http-body-1-x", "dep:tokio-util", "dep:tokio", "tokio?/rt", "tokio?/fs", "tokio?/io-util", "tokio-util?/io", "dep:futures-core"]
serde-deserialize = []
serde-serialize = []
test-util = []

[rust]
name = "aws_smithy_types"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
base64-simd = { loaf = "crates-io/base64-simd", version = "^0.8" }
bytes = { loaf = "crates-io/bytes", version = "^1.11.1" }
bytes-utils = { loaf = "crates-io/bytes-utils", version = "^0.1" }
futures-core = { loaf = "crates-io/futures-core", version = "^0.3.31", optional = true }
http = { loaf = "crates-io/http", version = "^0.2.12", optional = true }
http-1x = { loaf = "crates-io/http", version = "^1.3.1" }
http-body-0-4 = { loaf = "crates-io/http-body", version = "^0.4.6", optional = true }
http-body-1-0 = { loaf = "crates-io/http-body", version = "^1.0.1", optional = true }
http-body-util = { loaf = "crates-io/http-body-util", version = "^0.1.3", optional = true }
hyper-0-14 = { loaf = "crates-io/hyper", version = "^0.14.26", optional = true }
itoa = { loaf = "crates-io/itoa", version = "^1.0.17" }
num-integer = { loaf = "crates-io/num-integer", version = "^0.1.46" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.14" }
pin-utils = { loaf = "crates-io/pin-utils", version = "^0.1.0" }
ryu = { loaf = "crates-io/ryu", version = "^1.0.22" }
serde = { loaf = "crates-io/serde", version = "^1.0.228", features = ["derive"], target = "cfg(aws_sdk_unstable)" }
time = { loaf = "crates-io/time", version = "^0.3.4", features = ["parsing"] }
tokio = { loaf = "crates-io/tokio", version = "^1.49.0", optional = true }
tokio-util = { loaf = "crates-io/tokio-util", version = "^0.7.18", optional = true }
