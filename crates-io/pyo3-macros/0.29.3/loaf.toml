# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/pyo3-macros"
version = "0.29.3"

[project.features]
experimental-async = ["pyo3-macros-backend/experimental-async"]
experimental-inspect = ["pyo3-macros-backend/experimental-inspect"]
multiple-pymethods = []

[rust]
name = "pyo3_macros"
type = "proc-macro"
edition = "2021"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0.60", default-features = false }
pyo3-macros-backend = { loaf = "crates-io/pyo3-macros-backend", version = "=0.29.3" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^2", features = ["extra-traits", "full"] }
