# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/web-time"
version = "1.1.0"

[project.features]
serde = ["dep:serde"]

[rust]
name = "web_time"
type = "lib"
edition = "2021"

[dependencies]
js-sys = { loaf = "crates-io/js-sys", version = "^0.3.20", target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }
serde = { loaf = "crates-io/serde", version = "^1", optional = true, target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }
wasm-bindgen = { loaf = "crates-io/wasm-bindgen", version = "^0.2.70", default-features = false, target = "cfg(all(target_family = \"wasm\", target_os = \"unknown\"))" }
