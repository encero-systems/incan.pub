# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/slotmap"
version = "1.1.1"

[project.features]
default = ["std"]
serde = ["dep:serde"]
std = []
unstable = []

[rust]
name = "slotmap"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
serde = { loaf = "crates-io/serde", version = "^1.0", features = ["alloc", "derive"], default-features = false, optional = true }
