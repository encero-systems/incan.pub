# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/oxc_regular_expression"
version = "0.155.0"

[rust]
name = "oxc_regular_expression"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bitflags = { loaf = "crates-io/bitflags", version = "^2.13.0" }
oxc_allocator = { loaf = "crates-io/oxc_allocator", version = "^0.155.0" }
oxc_ast_macros = { loaf = "crates-io/oxc_ast_macros", version = "^0.155.0" }
oxc_diagnostics = { loaf = "crates-io/oxc_diagnostics", version = "^0.155.0" }
oxc_span = { loaf = "crates-io/oxc_span", version = "^0.155.0" }
oxc_str = { loaf = "crates-io/oxc_str", version = "^0.155.0" }
phf = { loaf = "crates-io/phf", version = "^0.14.0", features = ["macros"] }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2" }
unicode-id-start = { loaf = "crates-io/unicode-id-start", version = "^1" }
