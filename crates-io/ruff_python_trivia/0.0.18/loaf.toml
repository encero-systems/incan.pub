# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ruff_python_trivia"
version = "0.0.18"

[rust]
name = "ruff_python_trivia"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
itertools = { loaf = "crates-io/itertools", version = "^0.15.0", features = ["use_std"], default-features = false }
memchr = { loaf = "crates-io/memchr", version = "^2.7.1", features = ["std"], default-features = false }
ruff_source_file = { loaf = "crates-io/ruff_source_file", version = "^0.0.18" }
ruff_text_size = { loaf = "crates-io/ruff_text_size", version = "^0.0.18" }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.0.0", features = ["std"], default-features = false }
unicode-ident = { loaf = "crates-io/unicode-ident", version = "^1.0.12", default-features = false }
unicode-normalization = { loaf = "crates-io/unicode-normalization", version = "^0.1.23", features = ["std"], default-features = false }
