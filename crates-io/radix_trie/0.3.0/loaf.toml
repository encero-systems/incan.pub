# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/radix_trie"
version = "0.3.0"

[project.features]
serde = ["dep:serde"]

[rust]
name = "radix_trie"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
endian-type = { loaf = "crates-io/endian-type", version = "^0.2.0" }
nibble_vec = { loaf = "crates-io/nibble_vec", version = "^0.1" }
serde = { loaf = "crates-io/serde", version = "^1.0", optional = true }
