# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/maybe-rayon"
version = "0.1.1"

[project.features]
default = ["threads"]
rayon = ["dep:rayon"]
threads = ["rayon"]

[rust]
name = "maybe_rayon"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
cfg-if = { loaf = "crates-io/cfg-if", version = "^1.0" }
rayon = { loaf = "crates-io/rayon", version = "^1.0", optional = true }
