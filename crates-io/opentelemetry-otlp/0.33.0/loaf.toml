# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/opentelemetry-otlp"
version = "0.33.0"

[project.features]
default = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs", "internal-logs"]
flate2 = ["dep:flate2"]
grpc-tonic = ["tonic", "tonic-types", "prost", "http", "tokio", "opentelemetry-proto/gen-tonic"]
gzip-http = ["flate2"]
gzip-tonic = ["dep:tonic", "tonic/gzip"]
http = ["dep:http"]
http-json = ["serde_json", "prost", "opentelemetry-http", "opentelemetry-proto/gen-tonic-messages", "opentelemetry-proto/with-serde", "http", "httpdate", "trace", "metrics"]
http-proto = ["prost", "opentelemetry-http", "opentelemetry-proto/gen-tonic-messages", "http", "httpdate", "trace", "metrics"]
httpdate = ["dep:httpdate"]
hyper-client = ["dep:opentelemetry-http", "opentelemetry-http/hyper", "tokio"]
integration-testing = ["tonic", "prost", "dep:tokio", "tokio/full", "trace", "logs"]
internal-logs = ["opentelemetry_sdk/internal-logs", "opentelemetry/internal-logs"]
logs = ["opentelemetry/logs", "opentelemetry_sdk/logs", "opentelemetry-proto/logs"]
metrics = ["opentelemetry/metrics", "opentelemetry_sdk/metrics", "opentelemetry-proto/metrics"]
opentelemetry-http = ["dep:opentelemetry-http"]
prost = ["dep:prost"]
reqwest = ["dep:reqwest"]
reqwest-blocking-client = ["dep:reqwest", "reqwest/blocking", "dep:opentelemetry-http", "opentelemetry-http/reqwest-blocking"]
reqwest-client = ["reqwest", "dep:opentelemetry-http", "opentelemetry-http/reqwest", "tokio"]
reqwest-rustls = ["reqwest", "dep:opentelemetry-http", "opentelemetry-http/reqwest-rustls"]
serde_json = ["dep:serde_json"]
tls-aws-lc = ["dep:tonic", "tonic/tls-aws-lc"]
tls-provider-agnostic = ["dep:tonic", "tonic/_tls-any"]
tls-ring = ["dep:tonic", "tonic/tls-ring"]
tls-roots = ["dep:tonic", "tonic/tls-native-roots"]
tls-webpki-roots = ["dep:tonic", "tonic/tls-webpki-roots"]
tokio = ["dep:tokio"]
tonic = ["dep:tonic"]
tonic-types = ["dep:tonic-types"]
trace = ["opentelemetry/trace", "opentelemetry_sdk/trace", "opentelemetry-proto/trace"]
zstd = ["dep:zstd"]
zstd-http = ["zstd"]
zstd-tonic = ["dep:tonic", "tonic/zstd"]

[rust]
name = "opentelemetry_otlp"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
flate2 = { loaf = "crates-io/flate2", version = "^1.1.2", optional = true }
http = { loaf = "crates-io/http", version = "^1.1", features = ["std"], default-features = false, optional = true }
httpdate = { loaf = "crates-io/httpdate", version = "^1.0.3", optional = true }
opentelemetry = { loaf = "crates-io/opentelemetry", version = "^0.33", default-features = false }
opentelemetry-http = { loaf = "crates-io/opentelemetry-http", version = "^0.33", default-features = false, optional = true }
opentelemetry-proto = { loaf = "crates-io/opentelemetry-proto", version = "^0.33", default-features = false }
opentelemetry_sdk = { loaf = "crates-io/opentelemetry_sdk", version = "^0.33", default-features = false }
prost = { loaf = "crates-io/prost", version = "^0.14", optional = true }
reqwest = { loaf = "crates-io/reqwest", version = "^0.13.1", default-features = false, optional = true }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0", optional = true }
thiserror = { loaf = "crates-io/thiserror", version = "^2", default-features = false }
tokio = { loaf = "crates-io/tokio", version = "^1", features = ["rt", "sync", "time"], default-features = false, optional = true }
tonic = { loaf = "crates-io/tonic", version = "^0.14.1", default-features = false, optional = true }
tonic-types = { loaf = "crates-io/tonic-types", version = "^0.14.1", optional = true }
zstd = { loaf = "crates-io/zstd", version = "^0.13", optional = true }
