# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/toml"
version = "1.1.6+spec-1.1.0"

[project.features]
debug = ["std", "toml_parser?/debug", "dep:anstream", "dep:anstyle"]
default = ["std", "serde", "parse", "display"]
display = ["dep:toml_writer"]
fast_hash = ["preserve_order", "dep:foldhash"]
parse = ["dep:toml_parser", "dep:winnow"]
preserve_order = ["dep:indexmap", "std"]
serde = ["dep:serde_core", "toml_datetime/serde", "serde_spanned/serde"]
std = ["indexmap?/std", "serde_core?/std", "toml_parser?/std", "toml_writer?/std", "toml_datetime/std", "serde_spanned/std"]
unbounded = []

[rust]
name = "toml"
type = "lib"
edition = "2024"

[dependencies]
anstream = { loaf = "crates-io/anstream", version = "^1.0.0", optional = true }
anstyle = { loaf = "crates-io/anstyle", version = "^1.0.14", optional = true }
foldhash = { loaf = "crates-io/foldhash", version = "^0.2.0", default-features = false, optional = true }
indexmap = { loaf = "crates-io/indexmap", version = "^2.13.0", default-features = false, optional = true }
serde_core = { loaf = "crates-io/serde_core", version = "^1.0.228", features = ["alloc"], default-features = false, optional = true }
serde_spanned = { loaf = "crates-io/serde_spanned", version = "^1.1.1", features = ["alloc"], default-features = false }
toml_datetime = { loaf = "crates-io/toml_datetime", version = "^1.1.1", features = ["alloc"], default-features = false }
toml_parser = { loaf = "crates-io/toml_parser", version = "^1.1.3", features = ["alloc"], default-features = false, optional = true }
toml_writer = { loaf = "crates-io/toml_writer", version = "^1.1.2", features = ["alloc"], default-features = false, optional = true }
winnow = { loaf = "crates-io/winnow", version = "^1.0.0", default-features = false, optional = true }
