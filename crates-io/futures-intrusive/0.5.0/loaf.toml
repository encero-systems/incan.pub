# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/futures-intrusive"
version = "0.5.0"

[project.features]
alloc = ["futures-core/alloc"]
default = ["std"]
parking_lot = ["dep:parking_lot"]
std = ["alloc", "parking_lot"]

[rust]
name = "futures_intrusive"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
futures-core = { loaf = "crates-io/futures-core", version = "^0.3", default-features = false }
lock_api = { loaf = "crates-io/lock_api", version = "^0.4.1" }
parking_lot = { loaf = "crates-io/parking_lot", version = "^0.12.0", optional = true }
