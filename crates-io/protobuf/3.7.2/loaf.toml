# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/protobuf"
version = "3.7.2"

[project.features]
bytes = ["dep:bytes"]
default = []
with-bytes = ["bytes"]

[rust]
name = "protobuf"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
bytes = { loaf = "crates-io/bytes", version = "^1.1", optional = true }
once_cell = { loaf = "crates-io/once_cell", version = "^1.9.0" }
protobuf-support = { loaf = "crates-io/protobuf-support", version = "=3.7.2" }
thiserror = { loaf = "crates-io/thiserror", version = "^1.0.30" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default"]
cfg = []
out = [{ name = "version.rs", path = "out/version.rs", digest = "sha256:cd75b44de5972630354402e9f2537729c86ba37a9ac0fc56d998bb3b3e841b16" }]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default"]
cfg = []
out = [{ name = "version.rs", path = "out/version.rs", digest = "sha256:cd75b44de5972630354402e9f2537729c86ba37a9ac0fc56d998bb3b3e841b16" }]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["default"]
cfg = []
out = [{ name = "version.rs", path = "out/version.rs", digest = "sha256:cd75b44de5972630354402e9f2537729c86ba37a9ac0fc56d998bb3b3e841b16" }]
