# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/crossbeam-epoch"
version = "0.9.21"

[project.features]
alloc = []
default = ["std"]
loom = ["loom-crate", "crossbeam-utils/loom"]
loom-crate = ["dep:loom-crate"]
nightly = ["crossbeam-utils/nightly"]
std = ["alloc", "crossbeam-utils/std"]

[rust]
name = "crossbeam_epoch"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
crossbeam-utils = { loaf = "crates-io/crossbeam-utils", version = "^0.8.18", default-features = false }
loom-crate = { loaf = "crates-io/loom", version = "^0.7.1", optional = true, target = "cfg(crossbeam_loom)" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["alloc", "default", "std"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["alloc", "std"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["alloc", "default", "std"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["alloc", "std"]
cfg = []
