# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/darling"
version = "0.24.1"

[project.features]
default = ["suggestions"]
diagnostics = ["darling_core/diagnostics"]
serde = ["darling_core/serde"]
suggestions = ["darling_core/suggestions"]

[rust]
name = "darling"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
darling_core = { loaf = "crates-io/darling_core", version = "=0.24.1" }
darling_macro = { loaf = "crates-io/darling_macro", version = "=0.24.1" }
