# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/aws-smithy-runtime-api"
version = "1.19.0"

[project.features]
client = []
default = []
http-02x = ["dep:http-02x"]
http-1x = []
http-auth = ["dep:zeroize"]
legacy-client = ["client"]
test-util = ["aws-smithy-types/test-util", "http-1x"]

[rust]
name = "aws_smithy_runtime_api"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
aws-smithy-async = { loaf = "crates-io/aws-smithy-async", version = "^1.3.0" }
aws-smithy-runtime-api-macros = { loaf = "crates-io/aws-smithy-runtime-api-macros", version = "^1.1.0" }
aws-smithy-types = { loaf = "crates-io/aws-smithy-types", version = "^1.8.1", features = ["http-body-1-x"] }
bytes = { loaf = "crates-io/bytes", version = "^1.11.1" }
http-02x = { loaf = "crates-io/http", version = "^0.2.12", optional = true }
http-1x = { loaf = "crates-io/http", version = "^1.3.1" }
pin-project-lite = { loaf = "crates-io/pin-project-lite", version = "^0.2.14" }
tokio = { loaf = "crates-io/tokio", version = "^1.49.0", features = ["sync"] }
tracing = { loaf = "crates-io/tracing", version = "^0.1.44" }
zeroize = { loaf = "crates-io/zeroize", version = "^1.7.0", optional = true }
