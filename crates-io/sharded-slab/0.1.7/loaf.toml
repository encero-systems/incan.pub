# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/sharded-slab"
version = "0.1.7"

[project.features]
loom = ["dep:loom"]

[rust]
name = "sharded_slab"
type = "lib"
edition = "2018"
build-script = false

[dependencies]
lazy_static = { loaf = "crates-io/lazy_static", version = "^1" }
loom = { loaf = "crates-io/loom", version = "^0.5", features = ["checkpoint"], optional = true, target = "cfg(loom)" }
