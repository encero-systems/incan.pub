# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/rustc-literal-escaper"
version = "0.0.4"

[project.features]
rustc-dep-of-std = ["dep:std", "dep:core"]

[rust]
name = "rustc_literal_escaper"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
core = { loaf = "crates-io/rustc-std-workspace-core", version = "^1.0.0", optional = true }
std = { loaf = "crates-io/rustc-std-workspace-std", version = "^1.0.0", optional = true }
