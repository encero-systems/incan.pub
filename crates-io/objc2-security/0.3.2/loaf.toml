# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/objc2-security"
version = "0.3.2"

[project.features]
AuthSession = ["bitflags"]
Authorization = ["bitflags"]
AuthorizationDB = ["objc2-core-foundation/CFBundle", "objc2-core-foundation/CFDictionary"]
