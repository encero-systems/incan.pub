# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/oxc_ast_macros"
version = "0.155.0"

[rust]
name = "oxc_ast_macros"
type = "proc-macro"
edition = "2024"
build-script = false

[dependencies]
phf = { loaf = "crates-io/phf", version = "^0.14.0" }
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1" }
quote = { loaf = "crates-io/quote", version = "^1" }
syn = { loaf = "crates-io/syn", version = "^3", features = ["clone-impls", "full", "parsing", "printing", "proc-macro"], default-features = false }
