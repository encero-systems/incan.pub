# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/clang-sys"
version = "1.9.1"

[project.features]
clang_10_0 = ["clang_9_0"]
clang_11_0 = ["clang_10_0"]
clang_12_0 = ["clang_11_0"]
clang_13_0 = ["clang_12_0"]
clang_14_0 = ["clang_13_0"]
clang_15_0 = ["clang_14_0"]
clang_16_0 = ["clang_15_0"]
clang_17_0 = ["clang_16_0"]
clang_18_0 = ["clang_17_0"]
clang_19_0 = ["clang_18_0"]
clang_20_0 = ["clang_19_0"]
clang_3_5 = []
clang_3_6 = ["clang_3_5"]
clang_3_7 = ["clang_3_6"]
clang_3_8 = ["clang_3_7"]
clang_3_9 = ["clang_3_8"]
clang_4_0 = ["clang_3_9"]
clang_5_0 = ["clang_4_0"]
clang_6_0 = ["clang_5_0"]
clang_7_0 = ["clang_6_0"]
clang_8_0 = ["clang_7_0"]
clang_9_0 = ["clang_8_0"]
libcpp = []
libloading = ["dep:libloading"]
runtime = ["libloading"]
static = []

[rust]
name = "clang_sys"
type = "lib"
edition = "2021"
build-script = true

[dependencies]
glob = { loaf = "crates-io/glob", version = "^0.3" }
libc = { loaf = "crates-io/libc", version = "^0.2.39", default-features = false }
libloading = { loaf = "crates-io/libloading", version = "^0.8", optional = true }
