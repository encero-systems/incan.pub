# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/foreign-types-macros"
version = "0.2.4"

[project.features]
std = []

[rust]
name = "foreign_types_macros"
type = "proc-macro"
edition = "2018"
build-script = false

[dependencies]
proc-macro2 = { loaf = "crates-io/proc-macro2", version = "^1.0" }
quote = { loaf = "crates-io/quote", version = "^1.0" }
syn = { loaf = "crates-io/syn", version = "^3.0", features = ["full"] }
