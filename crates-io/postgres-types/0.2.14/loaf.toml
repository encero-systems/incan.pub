# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/postgres-types"
version = "0.2.14"

[project.features]
array-impls = ["array-init"]
array-init = ["dep:array-init"]
bit-vec-06 = ["dep:bit-vec-06"]
bit-vec-07 = ["dep:bit-vec-07"]
bit-vec-08 = ["dep:bit-vec-08"]
bit-vec-09 = ["dep:bit-vec-09"]
chrono-04 = ["dep:chrono-04"]
cidr-02 = ["dep:cidr-02"]
cidr-03 = ["dep:cidr-03"]
derive = ["postgres-derive"]
eui48-04 = ["dep:eui48-04"]
eui48-1 = ["dep:eui48-1"]
geo-types-06 = ["dep:geo-types-06"]
geo-types-0_7 = ["dep:geo-types-0_7"]
jiff-01 = ["dep:jiff-01"]
jiff-02 = ["dep:jiff-02"]
js = ["postgres-protocol/js"]
postgres-derive = ["dep:postgres-derive"]
serde-1 = ["dep:serde-1"]
serde_json-1 = ["dep:serde_json-1"]
smol_str-01 = ["dep:smol_str-01"]
time-02 = ["dep:time-02"]
time-03 = ["dep:time-03"]
uuid-08 = ["dep:uuid-08"]
uuid-1 = ["dep:uuid-1"]
with-bit-vec-0_6 = ["bit-vec-06"]
with-bit-vec-0_7 = ["bit-vec-07"]
with-bit-vec-0_8 = ["bit-vec-08"]
with-bit-vec-0_9 = ["bit-vec-09"]
with-chrono-0_4 = ["chrono-04"]
with-cidr-0_2 = ["cidr-02"]
with-cidr-0_3 = ["cidr-03"]
with-eui48-0_4 = ["eui48-04"]
with-eui48-1 = ["eui48-1"]
with-geo-types-0_6 = ["geo-types-06"]
with-geo-types-0_7 = ["geo-types-0_7"]
with-jiff-0_1 = ["jiff-01"]
with-jiff-0_2 = ["jiff-02"]
with-serde_json-1 = ["serde-1", "serde_json-1"]
with-smol_str-01 = ["smol_str-01"]
with-time-0_2 = ["time-02"]
with-time-0_3 = ["time-03"]
with-uuid-0_8 = ["uuid-08"]
with-uuid-1 = ["uuid-1"]

[rust]
name = "postgres_types"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
array-init = { loaf = "crates-io/array-init", version = "^2", optional = true }
bit-vec-06 = { loaf = "crates-io/bit-vec", version = "^0.6", optional = true }
bit-vec-07 = { loaf = "crates-io/bit-vec", version = "^0.7", optional = true }
bit-vec-08 = { loaf = "crates-io/bit-vec", version = "^0.8", optional = true }
bit-vec-09 = { loaf = "crates-io/bit-vec", version = "^0.9", optional = true }
bytes = { loaf = "crates-io/bytes", version = "^1.11" }
chrono-04 = { loaf = "crates-io/chrono", version = "^0.4.33", features = ["clock"], default-features = false, optional = true }
cidr-02 = { loaf = "crates-io/cidr", version = "^0.2", optional = true }
cidr-03 = { loaf = "crates-io/cidr", version = "^0.3", optional = true }
eui48-04 = { loaf = "crates-io/eui48", version = "^0.4.6", optional = true }
eui48-1 = { loaf = "crates-io/eui48", version = "^1.0", default-features = false, optional = true }
fallible-iterator = { loaf = "crates-io/fallible-iterator", version = "^0.2" }
geo-types-06 = { loaf = "crates-io/geo-types", version = "^0.6", optional = true }
geo-types-0_7 = { loaf = "crates-io/geo-types", version = "^0.7.8", optional = true }
jiff-01 = { loaf = "crates-io/jiff", version = "^0.1", features = ["std"], default-features = false, optional = true }
jiff-02 = { loaf = "crates-io/jiff", version = "^0.2", features = ["std"], default-features = false, optional = true }
postgres-derive = { loaf = "crates-io/postgres-derive", version = "^0.4.9", optional = true }
postgres-protocol = { loaf = "crates-io/postgres-protocol", version = "^0.6.12" }
serde-1 = { loaf = "crates-io/serde_core", version = "^1.0.221", optional = true }
serde_json-1 = { loaf = "crates-io/serde_json", version = "^1.0.144", optional = true }
smol_str-01 = { loaf = "crates-io/smol_str", version = "^0.1.23", default-features = false, optional = true }
time-02 = { loaf = "crates-io/time", version = "^0.2.7", optional = true }
time-03 = { loaf = "crates-io/time", version = "^0.3.5", default-features = false, optional = true }
uuid-08 = { loaf = "crates-io/uuid", version = "^0.8", optional = true }
uuid-1 = { loaf = "crates-io/uuid", version = "^1.0", optional = true }
