# Projection of the loaves.pub event log; regenerate with `loaves-pub build`, never edit.

[project]
name = "crates-io/defmt-parser"
version = "1.0.0"

[project.features]
unstable = []

[rust]
name = "defmt_parser"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
thiserror = { loaf = "crates-io/thiserror", version = "^2" }
