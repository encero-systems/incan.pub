# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/writeable"
version = "0.6.2"

[project.features]
alloc = []
default = ["alloc"]
either = ["dep:either"]

[rust]
name = "writeable"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
either = { loaf = "crates-io/either", version = "^1.9.0", default-features = false, optional = true }
