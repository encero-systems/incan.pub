# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/arrow-buffer"
version = "60.0.0"

[project.features]
pool = []

[rust]
name = "arrow_buffer"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
bytes = { loaf = "crates-io/bytes", version = "^1.4" }
half = { loaf = "crates-io/half", version = "^2.1", default-features = false }
num-bigint = { loaf = "crates-io/num-bigint", version = "^0.5.0", features = ["std"], default-features = false }
num-traits = { loaf = "crates-io/num-traits", version = "^0.2.19", features = ["std"], default-features = false }
