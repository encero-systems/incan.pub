# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/predicates"
version = "3.1.4"

[project.features]
color = []
default = ["diff", "regex", "float-cmp", "normalize-line-endings", "color"]
diff = ["dep:difflib"]
float-cmp = ["dep:float-cmp"]
normalize-line-endings = ["dep:normalize-line-endings"]
regex = ["dep:regex"]
unstable = []

[rust]
name = "predicates"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
anstyle = { loaf = "crates-io/anstyle", version = "^1.0.0" }
difflib = { loaf = "crates-io/difflib", version = "^0.4", optional = true }
float-cmp = { loaf = "crates-io/float-cmp", version = "^0.10", optional = true }
normalize-line-endings = { loaf = "crates-io/normalize-line-endings", version = "^0.3.0", optional = true }
predicates-core = { loaf = "crates-io/predicates-core", version = "^1.0" }
regex = { loaf = "crates-io/regex", version = "^1.0", optional = true }
