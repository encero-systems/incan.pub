# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/system-deps"
version = "9.0.0"

[project.features]
binary = ["dep:system-deps-meta", "system-deps-meta/binary", "dep:which", "toml/serde"]
default = []
gz = ["dep:system-deps-meta", "system-deps-meta/gz"]
inno = ["dep:system-deps-meta", "system-deps-meta/inno"]
pkg = ["dep:system-deps-meta", "system-deps-meta/pkg"]
system-deps-meta = ["dep:system-deps-meta"]
xz = ["dep:system-deps-meta", "system-deps-meta/xz"]
zip = ["dep:system-deps-meta", "system-deps-meta/zip"]

[rust]
name = "system_deps"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
cfg-expr = { loaf = "crates-io/cfg-expr", version = ">=0.17, <0.21", features = ["targets"] }
heck = { loaf = "crates-io/heck", version = "^0.5" }
pkg-config = { loaf = "crates-io/pkg-config", version = "^0.3.34" }
system-deps-meta = { loaf = "crates-io/system-deps-meta", version = "^9.0.0", optional = true }
toml = { loaf = "crates-io/toml", version = "^1", features = ["parse", "std"], default-features = false }
version-compare = { loaf = "crates-io/version-compare", version = "^0.2" }
which = { loaf = "crates-io/which", version = "^8", optional = true }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["default"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "release"
features = ["default"]
cfg = []
