# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/cranelift-codegen"
version = "0.123.17"

[project.features]
all-arch = ["all-native-arch", "pulley"]
all-native-arch = ["x86", "arm64", "s390x", "riscv64"]
anyhow = ["dep:anyhow"]
arm64 = []
capstone = ["dep:capstone"]
core = []
default = ["std", "unwind", "host-arch", "timing"]
disas = ["anyhow", "capstone"]
enable-serde = ["serde", "serde_derive", "cranelift-entity/enable-serde", "cranelift-bitset/enable-serde", "regalloc2/enable-serde", "smallvec/serde"]
gimli = ["dep:gimli"]
host-arch = []
incremental-cache = ["enable-serde", "postcard", "sha2"]
isle-errors = []
postcard = ["dep:postcard"]
pulley = ["dep:pulley-interpreter", "pulley-interpreter/encode", "pulley-interpreter/disas"]
riscv64 = []
s390x = []
serde = ["dep:serde"]
serde_derive = ["dep:serde_derive"]
sha2 = ["dep:sha2"]
souper-harvest = ["souper-ir", "dep:souper-ir", "souper-ir/stringify"]
souper-ir = ["dep:souper-ir"]
std = ["serde?/std"]
timing = []
trace-log = ["regalloc2/trace-log"]
unwind = ["gimli"]
x86 = []

[rust]
name = "cranelift_codegen"
type = "lib"
edition = "2024"
build-script = true

[dependencies]
anyhow = { loaf = "crates-io/anyhow", version = "^1.0.93", features = ["std"], default-features = false, optional = true }
bumpalo = { loaf = "crates-io/bumpalo", version = "^3" }
capstone = { loaf = "crates-io/capstone", version = "^0.13.0", optional = true }
cranelift-assembler-x64 = { loaf = "crates-io/cranelift-assembler-x64", version = "^0.123.17" }
cranelift-bforest = { loaf = "crates-io/cranelift-bforest", version = "^0.123.17" }
cranelift-bitset = { loaf = "crates-io/cranelift-bitset", version = "^0.123.17" }
cranelift-codegen-shared = { loaf = "crates-io/cranelift-codegen-shared", version = "^0.123.17" }
cranelift-control = { loaf = "crates-io/cranelift-control", version = "^0.123.17" }
cranelift-entity = { loaf = "crates-io/cranelift-entity", version = "^0.123.17" }
gimli = { loaf = "crates-io/gimli", version = "^0.32.0", features = ["read", "std", "write"], default-features = false, optional = true }
hashbrown = { loaf = "crates-io/hashbrown", version = "^0.15", default-features = false }
log = { loaf = "crates-io/log", version = "^0.4.27", default-features = false }
postcard = { loaf = "crates-io/postcard", version = "^1.0.8", features = ["alloc"], default-features = false, optional = true }
pulley-interpreter = { loaf = "crates-io/pulley-interpreter", version = "=36.0.17", optional = true }
regalloc2 = { loaf = "crates-io/regalloc2", version = "^0.12.2", features = ["checker"] }
rustc-hash = { loaf = "crates-io/rustc-hash", version = "^2.0.0" }
serde = { loaf = "crates-io/serde", version = "^1.0.215", features = ["alloc"], default-features = false, optional = true }
serde_derive = { loaf = "crates-io/serde_derive", version = "^1.0.188", optional = true }
sha2 = { loaf = "crates-io/sha2", version = "^0.10.2", optional = true }
smallvec = { loaf = "crates-io/smallvec", version = "^1.6.1", features = ["union"] }
souper-ir = { loaf = "crates-io/souper-ir", version = "^2.1.0", optional = true }
target-lexicon = { loaf = "crates-io/target-lexicon", version = "^0.13.0" }
wasmtime-math = { loaf = "crates-io/wasmtime-internal-math", version = "=36.0.17" }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["gimli", "host-arch", "pulley", "std", "timing", "unwind"]
cfg = ["feature=\"arm64\""]
out = [{ name = "assembler-isle-macro.rs", path = "out/ce6c25645823/assembler-isle-macro.rs", digest = "sha256:ce6c25645823115afcf0df06c086c0517b8c59685c6e57fb58f926601c5d9dd4" }, { name = "inst_builder.rs", path = "out/57d848ff5a83/inst_builder.rs", digest = "sha256:57d848ff5a83a84f1af25941db10caa4eca2e9c55ddc913ca30914a6650b901a" }, { name = "isle_aarch64.rs", path = "out/6a8a6b68013c/isle_aarch64.rs", digest = "sha256:6a8a6b68013ccaf81a968b175277477efca0e3b15de9a6b380ca6d95f75bcbc2" }, { name = "isle_numerics.rs", path = "out/e662a747ca8a/isle_numerics.rs", digest = "sha256:e662a747ca8a599b374601ecb3c13141347a8c0874fa7ea04f805d6c5bdbaaf5" }, { name = "isle_opt.rs", path = "out/8f7858dcce1d/isle_opt.rs", digest = "sha256:8f7858dcce1de04eba95797494d46efd4d0b9b9596e79fc6b12b615753cb4c3a" }, { name = "isle_riscv64.rs", path = "out/c11f688e1c40/isle_riscv64.rs", digest = "sha256:c11f688e1c40207ad6afe2a6d72cce616d0d6a2b2b8e6f489b0da46a8c6b4830" }, { name = "isle_s390x.rs", path = "out/0ec3b4588e59/isle_s390x.rs", digest = "sha256:0ec3b4588e59b26bef40de4308200858ec6fc0b6011e3e96f6bbe28013b89c2b" }, { name = "isle_x64.rs", path = "out/26eebb358001/isle_x64.rs", digest = "sha256:26eebb3580010103e768275faa06578ec133466834a918c85c30e063a5620e45" }, { name = "opcodes.rs", path = "out/97d07cf80795/opcodes.rs", digest = "sha256:97d07cf807959ef66eab2bc8c431d0ff42e2ae85335ac61fe8ec571c23397218" }, { name = "settings-arm64.rs", path = "out/073417b02aa2/settings-arm64.rs", digest = "sha256:073417b02aa2679326d61e281d2137473530eeb285e8107e8353da1b2598eb64" }, { name = "settings-pulley.rs", path = "out/26c8cd1f0b4e/settings-pulley.rs", digest = "sha256:26c8cd1f0b4e977fda3b923517980946f001c2d92f4bce4477253b473c1d46e1" }, { name = "settings.rs", path = "out/8ebefaea0e39/settings.rs", digest = "sha256:8ebefaea0e399bbdd7f47dd21cf2761084326f3bb0df550f497eba202c5f7ccf" }, { name = "types.rs", path = "out/43e3c5d3dffa/types.rs", digest = "sha256:43e3c5d3dffaf87745770f10ceaba2bbeae60ecb2848c