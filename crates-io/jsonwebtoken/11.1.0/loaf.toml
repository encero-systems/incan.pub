# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/jsonwebtoken"
version = "11.1.0"

[project.features]
aws_lc_rs = ["dep:aws-lc-rs"]
default = ["use_pem"]
rust_crypto = ["dep:ed25519-dalek", "dep:hmac", "dep:p256", "dep:p384", "dep:rand", "dep:rsa", "dep:sha2"]
use_pem = ["dep:pem", "dep:simple_asn1"]

[rust]
name = "jsonwebtoken"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
aws-lc-rs = { loaf = "crates-io/aws-lc-rs", version = "^1.15.0", optional = true }
base64 = { loaf = "crates-io/base64", version = "^0.22" }
ed25519-dalek = { loaf = "crates-io/ed25519-dalek", version = "^2.1.1", features = ["pkcs8"], optional = true }
getrandom = { loaf = "crates-io/getrandom", version = "^0.2", target = "cfg(target_arch = \"wasm32\")" }
hmac = { loaf = "crates-io/hmac", version = "^0.12.1", features = ["reset"], optional = true }
js-sys = { loaf = "crates-io/js-sys", version = "^0.3", target = "cfg(target_arch = \"wasm32\")" }
p256 = { loaf = "crates-io/p256", version = "^0.13.2", features = ["ecdsa"], optional = true }
p384 = { loaf = "crates-io/p384", version = "^0.13.0", features = ["ecdsa"], optional = true }
pem = { loaf = "crates-io/pem", version = "^3", optional = true }
rand = { loaf = "crates-io/rand", version = "^0.8.5", features = ["std"], default-features = false, optional = true }
rsa = { loaf = "crates-io/rsa", version = "^0.9.6", optional = true }
serde = { loaf = "crates-io/serde", version = "^1.0.228", features = ["derive"] }
serde_json = { loaf = "crates-io/serde_json", version = "^1.0" }
sha2 = { loaf = "crates-io/sha2", version = "^0.10.7", features = ["oid"], optional = true }
signature = { loaf = "crates-io/signature", version = "^2.2.0", features = ["std"] }
simple_asn1 = { loaf = "crates-io/simple_asn1", version = "^0.6", optional = true }
zeroize = { loaf = "crates-io/zeroize", version = "^1.8.2", features = ["derive"] }
