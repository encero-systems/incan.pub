# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/brotli"
version = "9.0.0"

[project.features]
alloc-stdlib = ["dep:alloc-stdlib"]
benchmark = ["brotli-decompressor/benchmark"]
billing = []
default = ["std"]
disable-timer = ["brotli-decompressor/disable-timer"]
disallow_large_window_size = []
external-literal-probability = []
ffi-api = ["brotli-decompressor/ffi-api"]
float64 = []
floating_point_context_mixing = []
no-stdlib-ffi-binding = []
pass-through-ffi-panics = []
portable-float = []
safe = []
seccomp = ["alloc-no-stdlib/unsafe", "brotli-decompressor/seccomp"]
sha2 = ["dep:sha2"]
simd = []
std = ["alloc-stdlib", "brotli-decompressor/std"]
validation = ["sha2"]
vector_scratch_space = []

[rust]
name = "brotli"
type = "lib"
edition = "2015"
build-script = false

[dependencies]
alloc-no-stdlib = { loaf = "crates-io/alloc-no-stdlib", version = ">=3.0.0, <4.0.0" }
alloc-stdlib = { loaf = "crates-io/alloc-stdlib", version = ">=0.3.0, <0.4", optional = true }
brotli-decompressor = { loaf = "crates-io/brotli-decompressor", version = "~6.0", default-features = false }
sha2 = { loaf = "crates-io/sha2", version = "~0.10", optional = true }
