# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/crunchy"
version = "0.2.4"

[project.features]
default = ["limit_128"]
limit_1024 = []
limit_128 = []
limit_2048 = []
limit_256 = []
limit_512 = []
limit_64 = []
std = []

[rust]
name = "crunchy"
type = "lib"
edition = "2021"
build-script = true

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default", "limit_128"]
cfg = []
out = [{ name = "lib.rs", path = "out/8a34c08e38e3/lib.rs", digest = "sha256:8a34c08e38e337c79f1ed30061082b2c9d78f07ec4d9a7b1129b3d7ed5a0a9cb" }]
environment = [{ name = "CRUNCHY_LIB_SUFFIX", literal = "/lib.rs" }]

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default", "limit_128"]
