# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/crunchy"
version = "0.2.4"

[project.features]
default = ["limit_128"]
limit_1024 = []
limit_128 = []
limit_2048 = []
limit_256 = []
limit_512 = []
limit_64 = []
std = []

[rust]
name = "crunchy"
type = "lib"
edition = "2021"
build-script = true
