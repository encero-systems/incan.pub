# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/ntapi"
version = "0.4.3"

[project.features]
default = ["user"]
func-types = []
impl-default = ["winapi/impl-default"]
kernel = []
user = []

[rust]
name = "ntapi"
type = "lib"
edition = "2018"
build-script = true

[dependencies]
winapi = { loaf = "crates-io/winapi", version = "^0.3.9", features = ["cfg", "evntrace", "in6addr", "inaddr", "minwinbase", "ntsecapi", "windef", "winioctl"] }

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "debug"
features = ["default", "user"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "aarch64-apple-darwin"
profile = "release"
features = ["default", "user"]
cfg = []

[[rust.facts]]
toolchain = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
target = "x86_64-unknown-linux-gnu"
profile = "debug"
features = ["default", "user"]
cfg = []
