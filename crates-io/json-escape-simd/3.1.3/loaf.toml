# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/json-escape-simd"
version = "3.1.3"

[project.features]
asan = ["escape-simd/asan"]
avx512 = ["escape-simd/avx512"]
codspeed = []
default = []

[rust]
name = "json_escape_simd"
type = "lib"
edition = "2024"
build-script = false

[dependencies]
escape-simd = { loaf = "crates-io/escape-simd", version = "^0.1.1", features = ["json"] }
