# Projection of the incan.pub event log; regenerate with `incan-pub build`, never edit.

[project]
name = "crates-io/hyper-rustls"
version = "0.27.10"

[project.features]
aws-lc-rs = ["rustls/aws_lc_rs"]
default = ["native-tokio", "http1", "tls12", "logging", "aws-lc-rs"]
fips = ["aws-lc-rs", "rustls/fips"]
http1 = ["hyper-util/http1"]
http2 = ["hyper-util/http2"]
log = ["dep:log"]
logging = ["log", "tokio-rustls/logging", "rustls/logging"]
native-tokio = ["rustls-native-certs"]
ring = ["rustls/ring"]
rustls-native-certs = ["dep:rustls-native-certs"]
rustls-platform-verifier = ["dep:rustls-platform-verifier"]
tls12 = ["tokio-rustls/tls12", "rustls/tls12"]
webpki-roots = ["dep:webpki-roots"]
webpki-tokio = ["webpki-roots"]

[rust]
name = "hyper_rustls"
type = "lib"
edition = "2021"
build-script = false

[dependencies]
http = { loaf = "crates-io/http", version = "^1" }
hyper = { loaf = "crates-io/hyper", version = "^1", default-features = false }
hyper-util = { loaf = "crates-io/hyper-util", version = "^0.1", features = ["client-legacy", "tokio"], default-features = false }
log = { loaf = "crates-io/log", version = "^0.4.4", optional = true }
rustls = { loaf = "crates-io/rustls", version = "^0.23", default-features = false }
rustls-native-certs = { loaf = "crates-io/rustls-native-certs", version = "^0.8", optional = true }
rustls-platform-verifier = { loaf = "crates-io/rustls-platform-verifier", version = "^0.7", optional = true }
tokio = { loaf = "crates-io/tokio", version = "^1.0" }
tokio-rustls = { loaf = "crates-io/tokio-rustls", version = "^0.26", default-features = false }
tower-service = { loaf = "crates-io/tower-service", version = "^0.3" }
webpki-roots = { loaf = "crates-io/webpki-roots", version = "^1", optional = true }
