name: toolchain

# Build the Incan compiler once per operating system at one commit and push it to the GitHub Container Registry as
# `ghcr.io/encero-systems/incan.pub/toolchain/incan:<commit>-<target triple>`, so the other workflows download it
# instead of building it or keeping its target directory in the Actions cache. No Incan release installs the dev line
# yet; this goes away when one does. Releases cannot hold these binaries: this repository's releases are immutable once
# published, and a build-cache binary is not a release.
#
# The binary is not relocatable: it prepares its standard library from the source tree it was built in, at that
# absolute path (INCAN_SOURCE_ROOT and INCAN_STDLIB move part of it, not the derive provider). Every job of this
# repository has the same workspace path, so a job that downloads the binary checks out `encero-systems/incan` at the
# same commit into `incan`, exactly where this workflow built it. The binary only runs under the file name `incan`.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full encero-systems/incan commit to build"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
          - runner: macos-latest
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the Incan toolchain
        uses: actions/checkout@v4
        with:
          repository: encero-systems/incan
          ref: ${{ inputs.commit }}
          path: incan
      - name: Build the Incan CLI
        working-directory: incan
        run: cargo build -p incan-cli
      - name: Install oras
        uses: oras-project/setup-oras@v1
      - name: Push the binary
        env:
          COMMIT: ${{ inputs.commit }}
          TRIPLE: ${{ matrix.triple }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf incan.tar.gz -C incan/target/debug incan
          printf '%s' "$REGISTRY_TOKEN" | oras login ghcr.io --username "$REGISTRY_USER" --password-stdin
          oras push "ghcr.io/encero-systems/incan.pub/toolchain/incan:$COMMIT-$TRIPLE" \
            --artifact-type application/vnd.incan.toolchain.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/encero-systems/incan.pub" \
            --annotation "dev.incan.toolchain.commit=$COMMIT" \
            --annotation "dev.incan.toolchain.target=$TRIPLE" \
            incan.tar.gz:application/vnd.incan.toolchain.v1.tar+gzip
