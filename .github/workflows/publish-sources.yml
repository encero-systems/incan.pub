name: publish-sources

# Push adopted versions' source Loaf archives to the GitHub Container Registry, as packages linked to this repository.
# Each archive is rebuilt by adoption on the runner and must have exactly the digest the index names. The tool is the
# binary the check workflow published for this commit's tool key (`toolchain/incan-pub:<tool key>-<triple>`; see
# check.yml).

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated NAME@VERSION pairs, as adopted on the index branch"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tool
        uses: actions/checkout@v4
        with:
          path: tool
      - name: Check out the index branch
        uses: actions/checkout@v4
        with:
          ref: index
          path: index
      - name: Install oras
        uses: oras-project/setup-oras@v1
      - name: Download the tool
        run: |
          key="$(git -C tool ls-tree HEAD -- build.sh loaf.toml oven.lock src tests .github/workflows/check.yml | git hash-object --stdin)"
          oras pull "ghcr.io/encero-systems/incan.pub/toolchain/incan-pub:$key-x86_64-unknown-linux-gnu" \
            --output "$RUNNER_TEMP/tool" \
            || { echo "::error::no incan-pub binary for tool key $key yet; the check workflow publishes it when it passes"; exit 1; }
          tar -xzf "$RUNNER_TEMP/tool/incan-pub.tar.gz" -C "$RUNNER_TEMP/tool"
      - name: Push the source Loaf archives
        working-directory: index
        env:
          INCAN_PUB_REGISTRY_USER: ${{ github.actor }}
          INCAN_PUB_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ inputs.versions }}
        # A version whose adoption no longer reproduces its archive is refused by push-source; the others still go up,
        # and the run fails at the end naming every refused version.
        run: |
          refused=""
          for pair in $VERSIONS; do
            "$RUNNER_TEMP/tool/incan-pub" push-source "${pair%@*}" "${pair#*@}" \
              --cache "$RUNNER_TEMP/cache" --blobs "$RUNNER_TEMP/blobs" --work "$RUNNER_TEMP/work" \
              || refused="$refused $pair"
          done
          if [ -n "$refused" ]; then
            echo "::error::not pushed:$refused"
            exit 1
          fi
