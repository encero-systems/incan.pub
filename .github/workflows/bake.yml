name: bake

# Compile one shard of adopted Loaves on a GitHub-hosted runner and push every unit it compiled to the GitHub Container
# Registry as an asset, under a build-provenance attestation over the unit archives. A shard is a directory under
# `bake/` holding the root requests (`roots.json`) and the resolution Oven compiles them under (`lock.json`).
#
# The run proposes; it does not record. It uploads the asset proposals as the `asset-proposals` artifact, and
# `incan-pub admit-assets` on a checkout of `index` records them after pulling each archive anonymously, so the index
# stays the authority. Packages this workflow creates take the visibility of this public repository; a package first
# pushed from anywhere else comes out private.
#
# Only GitHub-hosted runners run this. A self-hosted runner never attaches to this public repository, where pull
# requests from forks could reach it.

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Directory under bake/ with roots.json and lock.json"
        required: true
      only:
        description: "Comma-separated NAME@VERSION units to publish; every unit the closure compiled when empty"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  # The compiler the tool is built with, and the one whose `oven compile-closure` lists the units it compiled. Both are
  # downloaded from the GHCR package the toolchain workflow pushes (`toolchain/incan:<commit>-<triple>`).
  TOOL_INCAN: 7bfe19aec30971e3377323ae9107ea5d642ebd96
  CLOSURE_INCAN: e62f768676a3fff0810b09c3bfd7755ef553f0a5
  RUST_TOOLCHAIN: 1.98.0

jobs:
  bake:
    runs-on: macos-latest
    steps:
      - name: Check out the tool
        uses: actions/checkout@v4
        with:
          path: tool
      - name: Check out the index branch
        uses: actions/checkout@v4
        with:
          ref: index
          path: index
      - name: Install oras
        uses: oras-project/setup-oras@v1
      - name: Download the Incan compilers
        run: |
          for commit in "$TOOL_INCAN" "$CLOSURE_INCAN"; do
            directory="$RUNNER_TEMP/incan-${commit:0:12}"
            oras pull "ghcr.io/encero-systems/incan.pub/toolchain/incan:$commit-aarch64-apple-darwin" --output "$directory"
            tar -xzf "$directory/incan.tar.gz" -C "$directory"
          done
      - name: Install the Rust toolchain the units are compiled with
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-wasip1
      - name: Check out the tool's compiler sources
        uses: actions/checkout@v4
        with:
          repository: encero-systems/incan
          ref: ${{ env.TOOL_INCAN }}
          path: incan
      - name: Build incan-pub
        working-directory: tool
        run: INCAN="$RUNNER_TEMP/incan-${TOOL_INCAN:0:12}/incan" ./build.sh
      - name: Fetch the shard's source Loaf archives
        env:
          SHARD: ${{ inputs.shard }}
        run: tool/target/incan-pub fetch-sources "tool/bake/$SHARD/lock.json" --blobs "$RUNNER_TEMP/blobs" --work "$RUNNER_TEMP/fetch"
      - name: Check out the closure compiler's sources
        uses: actions/checkout@v4
        with:
          repository: encero-systems/incan
          ref: ${{ env.CLOSURE_INCAN }}
          path: incan
      - name: Compile the shard
        env:
          SHARD: ${{ inputs.shard }}
          INCAN_HOME: ${{ runner.temp }}/closure-home
          INCAN_NO_BANNER: "1"
        run: |
          "$RUNNER_TEMP/incan-${CLOSURE_INCAN:0:12}/incan" oven compile-closure \
            --pin "$GITHUB_WORKSPACE/index" --index-commit "$(git -C index rev-parse HEAD)" \
            --roots "tool/bake/$SHARD/roots.json" --lock "tool/bake/$SHARD/lock.json" --profile debug \
            --out "$RUNNER_TEMP/closure/closure.json" --blobs "$RUNNER_TEMP/blobs/sha256" \
            --rustc "$(rustup which --toolchain "$RUST_TOOLCHAIN" rustc)"
      - name: Pack the compiled units
        env:
          ONLY: ${{ inputs.only }}
        run: tool/target/incan-pub pack-units "$RUNNER_TEMP/closure" --out "$RUNNER_TEMP/units" --only "$ONLY"
      - name: Attest the unit archives
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/units/*.tar
      - name: Push the units
        env:
          INCAN_PUB_REGISTRY_USER: ${{ github.actor }}
          INCAN_PUB_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION: ${{ steps.attest.outputs.attestation-url }}
        run: |
          tool/target/incan-pub push-units "$RUNNER_TEMP/units" --builder registry --attestation "$ATTESTATION" \
            --proposals "$RUNNER_TEMP/proposals" --work "$RUNNER_TEMP/push"
      - name: Upload the asset proposals
        uses: actions/upload-artifact@v4
        with:
          name: asset-proposals
          path: ${{ runner.temp }}/proposals
