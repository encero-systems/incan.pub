name: bake

# Compile shards of adopted Loaves on a GitHub-hosted runner and push every unit they compiled to the GitHub Container
# Registry as an asset, under a build-provenance attestation over the unit archives. A shard is a directory under
# `bake/` holding the root requests (`roots.json`) and the resolution Oven compiles them under (`lock.json`); one run
# compiles the shards it is given in turn, so a unit two shards share is compiled once per root and reused after.
#
# Every shard is compiled twice, in two roots, and `pack-units --reproduces` refuses the run unless both give every unit
# the same identity, entry and archive bytes: a unit that depends on where it was compiled is never published.
#
# The run proposes; it does not record. It uploads the asset proposals as the `asset-proposals` artifact, and
# `incan-pub admit-assets` on a checkout of `index` records them after pulling each archive anonymously, so the index
# stays the authority. Packages this workflow creates take the visibility of this public repository; a package first
# pushed from anywhere else comes out private.
#
# Only GitHub-hosted runners run this. A self-hosted runner never attaches to this public repository, where pull
# requests from forks could reach it.

run-name: bake ${{ inputs.target }} ${{ inputs.profile }} ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Space-separated directories under bake/, each with roots.json and lock.json"
        required: true
      target:
        description: "The target every shard is compiled for, on a runner of that platform"
        required: true
        default: aarch64-apple-darwin
        type: choice
        options: [aarch64-apple-darwin, x86_64-unknown-linux-gnu]
      profile:
        description: "The profile every shard is compiled in"
        required: true
        default: debug
        type: choice
        options: [debug, release]
      only:
        description: "Comma-separated NAME@VERSION units to publish; every unit the shards compiled when empty"
        required: false
        default: ""
      label:
        description: "A name for this run, shown in its title, so a caller that dispatches several can find its own"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  # The compiler whose `oven compile-closure` lists the units it compiled, downloaded from the GHCR package the toolchain
  # workflow pushes (`toolchain/incan:<commit>-<triple>`). The tool itself is the binary the check workflow published
  # for this commit's tool key (`toolchain/incan-pub:<tool key>-<triple>`; see check.yml).
  CLOSURE_INCAN: 71694cb7b97254dd1367ac2fcdbfd221c77ba630
  RUST_TOOLCHAIN: 1.98.0

jobs:
  bake:
    runs-on: ${{ inputs.target == 'x86_64-unknown-linux-gnu' && 'ubuntu-latest' || 'macos-latest' }}
    env:
      SHARDS: ${{ inputs.shards }}
      PROFILE: ${{ inputs.profile }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out the tool
        uses: actions/checkout@v4
        with:
          path: tool
      - name: Check out the index branch
        uses: actions/checkout@v4
        with:
          ref: index
          path: index
      - name: Install oras
        uses: oras-project/setup-oras@v1
      - name: Download the tool and the closure compiler
        run: |
          key="$(git -C tool ls-tree HEAD -- build.sh loaf.toml oven.lock src tests .github/workflows/check.yml | git hash-object --stdin)"
          oras pull "ghcr.io/encero-systems/incan.pub/toolchain/incan-pub:$key-$TARGET" \
            --output "$RUNNER_TEMP/tool" \
            || { echo "::error::no incan-pub binary for tool key $key yet; the check workflow publishes it when it passes"; exit 1; }
          tar -xzf "$RUNNER_TEMP/tool/incan-pub.tar.gz" -C "$RUNNER_TEMP/tool"
          oras pull "ghcr.io/encero-systems/incan.pub/toolchain/incan:$CLOSURE_INCAN-$TARGET" --output "$RUNNER_TEMP/incan"
          tar -xzf "$RUNNER_TEMP/incan/incan.tar.gz" -C "$RUNNER_TEMP/incan"
      - name: Install the Rust toolchain the units are compiled with, twice
        # The second root compiles with a second copy at another path that also carries rust-src, so the gate below
        # proves a unit depends on neither where the toolchain is installed nor which components it has.
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          RUSTUP_HOME="$RUNNER_TEMP/rustup-src" CARGO_HOME="$RUNNER_TEMP/cargo-src" \
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-src
      - name: Fetch the shards' source Loaf archives
        run: |
          for shard in $SHARDS; do
            "$RUNNER_TEMP/tool/incan-pub" fetch-sources "tool/bake/$shard/lock.json" \
              --blobs "$RUNNER_TEMP/blobs" --work "$RUNNER_TEMP/fetch"
          done
      - name: Check out the closure compiler's sources
        uses: actions/checkout@v4
        with:
          repository: encero-systems/incan
          ref: ${{ env.CLOSURE_INCAN }}
          path: incan
      - name: Compile each shard twice, in two roots, and pack the units that reproduce
        env:
          ONLY: ${{ inputs.only }}
          INCAN_NO_BANNER: "1"
        run: |
          # Where a C-compiling unit's fact may find its executable's owner (RFC 119 rule 6): on macOS the runner's own
          # Command Line Tools. A fact recorded under another owner does not apply here.
          if [ "$RUNNER_OS" = macOS ]; then export INCAN_OVEN_LINK_OWNERS=/Library/Developer/CommandLineTools; fi
          commit="$(git -C index rev-parse HEAD)"
          first_rustc="$(rustup which --toolchain "$RUST_TOOLCHAIN" rustc)"
          second_rustc="$(RUSTUP_HOME="$RUNNER_TEMP/rustup-src" CARGO_HOME="$RUNNER_TEMP/cargo-src" rustup which --toolchain "$RUST_TOOLCHAIN" rustc)"
          for shard in $SHARDS; do
            for root in first second; do
              rustc="$first_rustc"
              [ "$root" = second ] && rustc="$second_rustc"
              INCAN_HOME="$RUNNER_TEMP/$root/home" "$RUNNER_TEMP/incan/incan" oven compile-closure \
                --pin "$GITHUB_WORKSPACE/index" --index-commit "$commit" \
                --roots "tool/bake/$shard/roots.json" --lock "tool/bake/$shard/lock.json" --profile "$PROFILE" \
                --out "$RUNNER_TEMP/$root/closure/closure.json" --blobs "$RUNNER_TEMP/blobs/sha256" --rustc "$rustc"
            done
            # A shard whose closure refuses a unit (one that does not compile, or misses a fact) publishes nothing and
            # is listed at the end; the other shards still bake. Units that compiled but differ between the roots
            # fail the run below.
            if ! jq -e '.refused | length == 0' "$RUNNER_TEMP/first/closure/closure.json" > /dev/null; then
              mkdir -p "$RUNNER_TEMP/proposals"
              jq -r --arg shard "$shard" '.refused[] | "\($shard)\t\(.loaf) \(.version)\t\(.reason | split("\n")[0] | .[0:300])"' \
                "$RUNNER_TEMP/first/closure/closure.json" >> "$RUNNER_TEMP/proposals/refused-shards.tsv"
              continue
            fi
            out="$RUNNER_TEMP/units/$(echo "$shard" | tr '/' '-')"
            "$RUNNER_TEMP/tool/incan-pub" pack-units "$RUNNER_TEMP/first/closure" --out "$out" --only "$ONLY" \
              --reproduces "$RUNNER_TEMP/second/closure"
          done
          if [ -s "$RUNNER_TEMP/proposals/refused-shards.tsv" ]; then
            echo "::warning::$(cut -f1 "$RUNNER_TEMP/proposals/refused-shards.tsv" | sort -u | wc -l) shard(s) refused; see refused-shards.tsv in the asset-proposals artifact"
            cat "$RUNNER_TEMP/proposals/refused-shards.tsv"
          fi
          # One copy of each archive to attest: shards that share a unit pack the same bytes under the same name.
          mkdir -p "$RUNNER_TEMP/attest"
          for archive in "$RUNNER_TEMP"/units/*/*.tar; do
            [ -e "$RUNNER_TEMP/attest/$(basename "$archive")" ] || cp "$archive" "$RUNNER_TEMP/attest/"
          done
      - name: Attest the unit archives
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/attest/*.tar
      - name: Push the units
        env:
          INCAN_PUB_REGISTRY_USER: ${{ github.actor }}
          INCAN_PUB_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTESTATION: ${{ steps.attest.outputs.attestation-url }}
        run: |
          for units in "$RUNNER_TEMP"/units/*/; do
            "$RUNNER_TEMP/tool/incan-pub" push-units "$units" --builder registry --attestation "$ATTESTATION" \
              --proposals "$RUNNER_TEMP/proposals" --work "$RUNNER_TEMP/push"
          done
      - name: Upload the asset proposals
        uses: actions/upload-artifact@v4
        with:
          name: asset-proposals
          path: ${{ runner.temp }}/proposals
