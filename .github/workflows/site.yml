name: site

# Publish the web surface: the pages `loaves-pub site` generates from the catalog on `index`, beside the index, records,
# event log and content they describe. `check` on `index` dispatches this workflow after each push there, and `check`
# on a push here runs it once it has published the tool binary, so a change to the design or the tool reaches the site.
# It pulls the tool for this commit's key (see check.yml) instead of building it, and everything but the last job is
# independent of who hosts the result.
#
# Rendering runs the formatter's packages over documents every upstream supplies, so the `render` job holds a read-only
# token that its checkouts do not keep. It hands the site to the `publish` job, which only deploys it.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

env:
  TRIPLE: x86_64-unknown-linux-gnu

jobs:
  render:
    # `check` runs for pull requests too; only a run for a push to main publishes a binary. Its admission of the log can
    # fail while `index` lags behind the tool, which withholds nothing, so any finished run will do.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tool
          persist-credentials: false
      - name: Check out the index branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: index
          path: index
          persist-credentials: false
      - name: Install oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.3.0
      - name: Pull the tool of this commit's key
        run: |
          key="$(git -C tool ls-tree HEAD -- build.sh loaf.toml src tests .github/workflows/check.yml | git hash-object --stdin)"
          oras pull "ghcr.io/encero-systems/loaves.pub/toolchain/loaves-pub:$key-$TRIPLE" --output "$RUNNER_TEMP/tool" \
            || { echo "::error::no loaves-pub binary for tool key $key yet; the check workflow publishes it when it passes"; exit 1; }
          tar -xzf "$RUNNER_TEMP/tool/loaves-pub.tar.gz" -C "$RUNNER_TEMP/tool"
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the formatter's pinned packages
        working-directory: tool/site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format the documents
        working-directory: tool/site
        run: node format-documents.mjs "$GITHUB_WORKSPACE/index" "$RUNNER_TEMP/formatted"
      - name: Render the pages
        run: |
          "$RUNNER_TEMP/tool/loaves-pub" site --root index --formatted "$RUNNER_TEMP/formatted" \
            --templates tool/site/templates --checkpoint "$(git -C index rev-parse HEAD)" --out out
          cp -R tool/site/assets tool/site/arcade out/
          cp -R index/catalog index/index index/crates-io index/content index/graphs index/events out/
      - name: Test the design and the rendered site
        working-directory: tool/site
        run: SITE_OUT="$GITHUB_WORKSPACE/out" npm test
      - name: Hand the site to the publish job
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: out
  publish:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
