name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tool
        uses: actions/checkout@v4
        with:
          path: tool
      - name: Check out the index branch
        uses: actions/checkout@v4
        with:
          ref: index
          path: index
      - name: Install the Incan toolchain
        run: |
          curl -fsSL https://github.com/encero-systems/incan/releases/download/v0.5.1/install.sh \
            | bash -s -- --manifest https://github.com/encero-systems/incan/releases/download/v0.5.1/manifest.json \
                         --bin-dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Warm the Cargo registry the 0.5.1 test envelope needs
        working-directory: tool
        run: ./scripts/prewarm-toolchain.sh
      - name: Test and build incan-pub
        working-directory: tool
        run: ./build.sh
      - name: Snapshot the crates.io index lines the log names
        working-directory: index
        run: ../tool/scripts/snapshot-crates-io-index.sh ../tool/target/incan-pub .crates-io-snapshot
      - name: Admit the published log with this tool
        working-directory: index
        run: ../tool/target/incan-pub check --crates-io-index .crates-io-snapshot
