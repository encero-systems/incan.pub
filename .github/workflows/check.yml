name: check

# Admit the log and compare the projections with the tool `main` publishes for its tool key (see check.yml there), and
# after a push publish the site from the result. Checking the log writes nothing, so the `registry` job holds a
# read-only token that no checkout keeps; only the `site` job can dispatch a workflow, and it runs nothing else.

on:
  push:
    branches: [index]
  pull_request:
    branches: [index]

permissions:
  contents: read

env:
  TRIPLE: x86_64-unknown-linux-gnu

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the index branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: index
          persist-credentials: false
      - name: Check out the tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: tool
          persist-credentials: false
      - name: Install oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      # `check` on `main` publishes the binary of a new tool key once its tests pass, so a push here that lands between
      # a change to the tool and that publication finds no binary; run it again once `check` on `main` has passed.
      - name: Pull the tool of main's key
        run: |
          key="$(git -C tool ls-tree HEAD -- build.sh loaf.toml src tests .github/workflows/check.yml | git hash-object --stdin)"
          oras pull "ghcr.io/encero-systems/incan.pub/toolchain/incan-pub:$key-$TRIPLE" --output "$RUNNER_TEMP/tool" \
            || { echo "::error::no incan-pub binary for tool key $key yet; the check workflow on main publishes it when it passes"; exit 1; }
          tar -xzf "$RUNNER_TEMP/tool/incan-pub.tar.gz" -C "$RUNNER_TEMP/tool"
      - name: Snapshot the crates.io index lines the log names
        working-directory: index
        run: ../tool/scripts/snapshot-crates-io-index.sh "$RUNNER_TEMP/tool/incan-pub" .crates-io-snapshot
      - name: Admit the log and compare the projections
        working-directory: index
        run: '"$RUNNER_TEMP/tool/incan-pub" check --crates-io-index .crates-io-snapshot'

  site:
    needs: registry
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Publish the site from this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
