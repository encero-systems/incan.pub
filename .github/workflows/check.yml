name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The Incan dev line this tool is built with. No release installs it yet, so CI builds the compiler at this commit.
  INCAN_COMMIT: 7bfe19aec30971e3377323ae9107ea5d642ebd96

jobs:
  tool:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tool
        uses: actions/checkout@v4
        with:
          path: tool
      - name: Check out the index branch
        uses: actions/checkout@v4
        with:
          ref: index
          path: index
      - name: Check out the Incan toolchain
        uses: actions/checkout@v4
        with:
          repository: encero-systems/incan
          ref: ${{ env.INCAN_COMMIT }}
          path: incan
      - name: Reuse the toolchain build for this commit
        uses: actions/cache@v4
        with:
          path: incan/target
          key: incan-cli-debug-${{ env.INCAN_COMMIT }}
      - name: Build the Incan toolchain
        working-directory: incan
        run: cargo build -p incan-cli
      - name: Add the Rust target the standard library's vocab desugarer builds for
        run: rustup target add wasm32-wasip1
      - name: Test and build incan-pub
        working-directory: tool
        run: INCAN="$GITHUB_WORKSPACE/incan/target/debug/incan" ./build.sh
      - name: Snapshot the crates.io index lines the log names
        working-directory: index
        run: ../tool/scripts/snapshot-crates-io-index.sh ../tool/target/incan-pub .crates-io-snapshot
      - name: Admit the published log with this tool
        working-directory: index
        run: ../tool/target/incan-pub check --crates-io-index .crates-io-snapshot
